<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Encaje Rosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+SC:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  /* Plantilla «Encaje y satén»: columna tipo sitio-invitación; satén con marco de encaje, papel lino, cierre en sobre con sello.
     Los colores vienen de CONFIG.tema (rosa o azul). */
  :root{
    --satin:#C396A3; --paper1:#D9CFD3; --paper2:#EACFD6; --ivory:#F2EEEA; --ink:#4A2E36; --soft:#7E5E67; --seal:#E4B1BF; --ribbon:#D8A7B5; --pearl:#E9C4CF;
    --script:"Pinyon Script", "Snell Roundhand", cursive; --caps:"Cormorant SC", "Cormorant Garamond", Georgia, serif; --serif:"Cormorant Garamond", Georgia, serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--satin)}
  body{color:var(--ink);font-family:var(--caps);font-variant-numeric:lining-nums}
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit}
  main{width:min(100vw,480px);margin:0 auto;container-type:inline-size;overflow:hidden;overflow:clip;box-shadow:0 0 60px rgba(40,20,30,.25);position:relative}
  .linen{position:relative;background-color:var(--c);
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px),
      radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.18),transparent 60%)}
  .sec{padding:14cqw 9cqw;text-align:center}
  .script{font-family:var(--script);font-weight:400;line-height:1.05;color:var(--ink)}
  .txt{font-size:4cqw;letter-spacing:.12em;line-height:1.75;color:var(--ink)}
  .rv{opacity:0;transform:translateY(22px)}
  .btn{display:inline-block;padding:1.6cqw 5.5cqw;border:1px solid var(--ink);border-radius:99px;font-family:var(--caps);font-size:3.3cqw;letter-spacing:.18em;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.18)}
  .btn:active{background:var(--ink);color:var(--ivory)}
  .thumb{width:22cqw;aspect-ratio:3/4;margin:6cqw auto;overflow:hidden;box-shadow:0 1.6cqw 3cqw rgba(40,20,30,.2)}
  .thumb img{width:100%;height:100%;object-fit:cover}

  /* portada */
  .hero{position:relative;height:132cqw;overflow:hidden}
  .hero .satin{position:absolute;inset:-4%;width:108%;max-width:none;height:108%;object-fit:cover;object-position:50% 0;will-change:transform}
  .oval{position:absolute;left:50%;top:13cqw;width:80cqw;margin-left:-40cqw;aspect-ratio:760/980}
  .oval img{width:100%;height:auto}
  .oval .in{position:absolute;inset:16% 18%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .oval .t1{font-family:var(--script);font-size:11.5cqw;line-height:1;color:var(--ink)}
  .oval .t2{font-family:var(--caps);font-size:4.6cqw;letter-spacing:.32em;padding-left:.32em;margin-top:1cqw;color:var(--ink)}
  .oval .duo{position:relative;font-family:var(--script);font-size:11cqw;line-height:1.3;color:var(--ink)}
  .oval .duo .a{display:block;margin-left:-6cqw}.oval .duo .b{display:block;margin-left:7cqw}
  .oval .duo .amp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22cqw;opacity:.18;pointer-events:none}
  .oval .dt{margin-top:5cqw;font-family:var(--caps);font-size:3.4cqw;letter-spacing:.16em;line-height:1.6;color:var(--ink)}

  /* horario */
  .tl{position:relative;margin-top:4cqw;display:grid;gap:7cqw}
  .tl .it b{display:block;font-family:var(--serif);font-style:italic;font-weight:300;font-size:13cqw;line-height:.9;color:var(--soft);opacity:.75;letter-spacing:.02em}
  .tl .it span{display:block;font-size:3.8cqw;letter-spacing:.12em;margin-top:-1.5cqw}
  .tl .it:nth-child(odd) b{margin-right:12cqw}.tl .it:nth-child(even) b{margin-left:10cqw}
  .pearl{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 34% 30%,#fff 0,var(--pearl) 45%,rgba(0,0,0,.18) 100%);box-shadow:0 .6cqw 1.2cqw rgba(40,20,30,.2)}

  /* confirmación */
  .tag{display:block;width:44cqw;margin:6cqw auto 0;transform-origin:88% 22%}
  .tag svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 1.6cqw 2cqw rgba(40,20,30,.22))}

  /* dress code */
  .dots{display:flex;justify-content:center;gap:4cqw;margin:5cqw 0 9cqw}
  .dots button{width:10cqw;height:10cqw;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 1cqw 2cqw rgba(40,20,30,.15);transition:transform .3s}
  .dots button.on{transform:translateY(-1.4cqw) scale(1.1)}
  .dname{min-height:5cqw;margin-top:-6cqw;margin-bottom:6cqw;font-size:3.4cqw;letter-spacing:.16em;color:var(--soft)}
  .h-caps{font-family:var(--caps);font-size:4.6cqw;letter-spacing:.2em;margin-bottom:3cqw}

  /* cierre en sobre */
  .env{position:relative;padding:14cqw 9cqw 46cqw;text-align:center;overflow:hidden;background:var(--ivory)}
  .env .flap{position:absolute;left:-2%;right:-2%;bottom:0;height:46cqw;background:linear-gradient(180deg,#FFFFFF,var(--ivory));clip-path:polygon(0 100%,0 0,50% 64%,100% 0,100% 100%);
    filter:drop-shadow(0 -1cqw 1.6cqw rgba(40,20,30,.12))}
  .env .flap::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),transparent 30%)}
  .env .seal{position:absolute;left:50%;bottom:6cqw;width:26cqw;margin-left:-13cqw;z-index:2;cursor:pointer;filter:drop-shadow(0 1.2cqw 1.6cqw rgba(40,20,30,.28))}
  .env .wm{position:absolute;left:0;right:0;bottom:2cqw;font-size:2.8cqw;letter-spacing:.2em;color:var(--soft);opacity:.6;z-index:1}

  /* formulario */
  #rsvp{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(40,20,30,.35);visibility:hidden;opacity:0;transition:opacity .3s}
  #rsvp.on{visibility:visible;opacity:1}
  #rsvp .sheet{width:min(100vw,480px);max-height:92vh;overflow:auto;border-radius:6cqw 6cqw 0 0;padding:9cqw 8cqw calc(8cqw + env(safe-area-inset-bottom));container-type:inline-size;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  #rsvp.on .sheet{transform:none}
  #rsvp h3{font-family:var(--script);font-weight:400;font-size:13cqw;text-align:center}
  #rsvp p.txt{text-align:center;margin:2cqw 0 5cqw;font-size:3.6cqw}
  #rsvp label.q{display:block;font-size:3.5cqw;letter-spacing:.12em;margin:4cqw 0 1.6cqw}
  #rsvp input[type=text],#rsvp textarea{width:100%;font-family:var(--serif);font-size:4.6cqw;color:var(--ink);border:1px solid rgba(0,0,0,.15);background:rgba(255,255,255,.7);padding:2.4cqw 3cqw;border-radius:1.4cqw;outline:none;resize:none}
  #rsvp input[type=text]:focus,#rsvp textarea:focus{border-color:var(--ink)}
  .opt{display:flex;align-items:center;gap:3cqw;margin-top:2cqw;padding:3cqw 4cqw;border-radius:1.4cqw;background:rgba(255,255,255,.45);border:1px solid transparent;font-size:3.8cqw;letter-spacing:.06em;cursor:pointer}
  .opt:has(input:checked){border-color:var(--ink);background:rgba(255,255,255,.75)}
  .opt input{accent-color:var(--ink)}
  .stepper{display:flex;align-items:center;justify-content:space-between;padding:2cqw 2cqw 2cqw 4cqw;border-radius:1.4cqw;background:rgba(255,255,255,.45);font-size:3.8cqw}
  .stepper div{display:flex;align-items:center;gap:4cqw}
  .stepper button{width:9cqw;height:9cqw;border-radius:50%;border:1px solid var(--ink);font-size:5cqw;line-height:1}
  .stepper b{font-family:var(--serif);font-size:6cqw;font-weight:400;min-width:6cqw;text-align:center}
  .send{display:block;width:100%;margin-top:6cqw;padding:3.4cqw;border-radius:99px;background:var(--ink);color:var(--ivory);text-align:center;text-decoration:none;font-size:3.6cqw;letter-spacing:.18em}
  .close{display:block;margin:5cqw auto 0;font-size:3.4cqw;letter-spacing:.16em;text-decoration:underline;text-underline-offset:1.2cqw}

  #music{position:fixed;z-index:20;top:calc(3.5vw + env(safe-area-inset-top));right:max(3.5vw,calc(50vw - 240px + 14px));width:42px;height:42px;border-radius:50%;
    background:rgba(255,255,255,.75);backdrop-filter:blur(6px);display:grid;place-items:center;box-shadow:0 4px 14px rgba(40,20,30,.18)}
  #music[hidden]{display:none}
  #music svg{width:18px;height:18px}
  #music .bars rect{fill:var(--ink);transform-origin:50% 100%;transform-box:fill-box}
  #music.off::after{content:"";position:absolute;width:24px;height:1.5px;background:var(--ink);transform:rotate(-45deg)}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--ivory);padding:10px 18px;border-radius:99px;font-size:15px;opacity:0;z-index:40;pointer-events:none;transition:opacity .3s}
  @media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<main id="inv"></main>
<div id="rsvp" role="dialog" aria-modal="true" aria-label="Confirmar asistencia"><div class="sheet linen" style="--c:var(--paper2)" id="sheet"></div></div>
<button id="music" type="button" aria-label="Música" hidden><svg viewBox="0 0 20 20" class="bars"><rect x="2" y="4" width="3" height="13" rx="1"/><rect x="8.5" y="2" width="3" height="15" rx="1"/><rect x="15" y="6" width="3" height="11" rx="1"/></svg></button>
<div id="toast"></div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(() => {
  "use strict";
  const C = window.CONFIG, E = C.evento, T = C.tema;
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  Object.entries(T.colores).forEach(([k, v]) => document.documentElement.style.setProperty("--" + k, v));
  document.title = C.tituloPestana;
  const fecha = new Date(E.fechaISO);
  const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  const fechaLarga = `${fecha.getDate()} de ${MESES[fecha.getMonth()]} de ${fecha.getFullYear()}`;

  // etiqueta de papel con listón (original)
  const tagSvg = `<svg viewBox="0 0 260 150"><path d="M222 30C246 8 262 14 258 30C254 48 232 44 236 26" fill="none" stroke="var(--ribbon)" stroke-width="5" stroke-linecap="round"/>
    <path d="M222 30C236 46 246 70 238 96" fill="none" stroke="var(--ribbon)" stroke-width="4.5" stroke-linecap="round"/>
    <g transform="rotate(-14 130 80)"><path d="M18 40H196L232 72 196 104H18Z" fill="#FBF9F6" stroke="#E4DDD8" stroke-width="1.5"/>
    <path d="M24 46H194L224 72 194 98H24Z" fill="none" stroke="#E8E2DD" stroke-width="1"/>
    <circle cx="208" cy="72" r="6.5" fill="none" stroke="#CFC6C0" stroke-width="2"/>
    <text x="108" y="79" text-anchor="middle" font-family="Cormorant SC, Georgia, serif" font-size="20" letter-spacing="4" fill="var(--ink)">${esc(C.textoEtiqueta || "CONFIRMAR")}</text>
    <path d="M168 82l5 13 3-5 5 5 3-3-5-5 5-3z" fill="var(--ink)" opacity=".8"/></g></svg>`;
  // sello de cera con iniciales (original)
  const seal = (() => {
    let d = ""; for (let i = 0; i <= 40; i++) { const a = i / 40 * Math.PI * 2, r = 46 + Math.sin(i * 2.7) * 2.2 + (i % 4 ? 0 : 1.6); d += `${i ? "L" : "M"}${(50 + Math.cos(a) * r).toFixed(1)} ${(50 + Math.sin(a) * r).toFixed(1)}`; }
    return `<svg viewBox="0 0 100 100" class="seal" role="button" aria-label="Sello"><defs><radialGradient id="sg" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".45" stop-color="var(--seal)"/><stop offset="1" stop-color="var(--seal)"/></radialGradient>
      <radialGradient id="sd" cx=".6" cy=".7" r=".8"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient></defs>
      <path d="${d}Z" fill="url(#sg)"/><path d="${d}Z" fill="url(#sd)"/>
      <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(0,0,0,.14)" stroke-width="2"/><circle cx="50" cy="50" r="33" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1"/>
      <text x="50.6" y="61.5" text-anchor="middle" font-family="Pinyon Script, cursive" font-size="${C.iniciales.length > 1 ? 28 : 36}" fill="rgba(0,0,0,.18)">${esc(C.iniciales)}</text>
      <text x="50" y="60.5" text-anchor="middle" font-family="Pinyon Script, cursive" font-size="${C.iniciales.length > 1 ? 28 : 36}" fill="rgba(255,255,255,.55)">${esc(C.iniciales)}</text></svg>`;
  })();
  const pearls = (list) => list.map(([x, y, s]) => `<i class="pearl" style="left:${x}cqw;top:${y}cqw;width:${s}cqw;height:${s}cqw" data-float="1"></i>`).join("");

  $("#inv").innerHTML = `
  <header class="hero">
    <img class="satin" src="${esc(T.saten)}" alt="">
    <div class="oval" id="oval"><img src="${esc(T.encaje)}" alt="">
      <div class="in">
        ${C.nombres ? `<div class="duo"><span class="a">${esc(C.nombres[0])}</span><span class="amp">&amp;</span><span class="b">${esc(C.nombres[1])}</span></div>`
                    : `<div class="t1">${esc(C.tituloScript)}</div><div class="t2">${esc(C.tituloCaps)}</div>`}
        <div class="dt">${esc(E.fechaCorta)}</div>
      </div>
    </div>
  </header>

  <section class="sec linen" style="--c:var(--paper1)">
    <p class="txt rv">${esc(E.saludo)}</p>
    ${E.mensaje.map(m => `<p class="txt rv" style="margin-top:4cqw">${esc(m)}</p>`).join("")}
    <div class="script rv" style="font-size:9cqw;margin-top:9cqw">${esc(fechaLarga)}</div>
  </section>

  <section class="sec linen" style="--c:var(--paper2);position:relative">
    <div class="script rv" style="font-size:14cqw">Locación</div>
    <p class="txt rv" style="margin-top:2cqw">${esc(E.lugarTipo)}<br>${esc(E.lugar)}</p>
    <div class="thumb rv"><img src="${esc(C.fotoLugar || T.saten)}" alt="" loading="lazy" style="${C.fotoLugar ? "" : "object-position:30% 20%;transform:scale(2.2)"}"></div>
    <a class="btn rv" href="${esc(E.mapa)}" target="_blank" rel="noopener">VER EN EL MAPA</a>
    <div class="script rv" style="font-size:14cqw;margin-top:14cqw">Horario</div>
    <div class="tl">${E.horario.map(([h, t]) => `<div class="it rv"><b>${esc(h)}</b><span>${esc(t)}</span></div>`).join("")}</div>
    ${pearls([[22, 168, 4.6], [30, 196, 2.4], [72, 214, 3.2], [24, 236, 2], [70, 252, 4]])}
  </section>

  <section class="sec linen" style="--c:var(--paper1)">
    <div class="script rv" style="font-size:14cqw">Confirmación</div>
    <p class="txt rv" style="margin-top:3cqw">${esc(E.rsvpTexto)}<br>Antes del ${esc(E.rsvpFecha)}.</p>
    <button class="tag rv" type="button" id="openRsvp" aria-label="Abrir confirmación">${tagSvg}</button>
  </section>

  <section class="sec linen" style="--c:var(--paper2);position:relative">
    <div class="thumb rv" style="margin-top:0"><img src="${esc(C.fotoVestimenta || T.saten)}" alt="" loading="lazy" style="${C.fotoVestimenta ? "" : "object-position:70% 60%;transform:scale(2.4)"}"></div>
    <div class="script rv" style="font-size:14cqw">Dress code</div>
    <p class="txt rv" style="margin-top:3cqw">${esc(E.vestimenta)}</p>
    <div class="dots rv" id="dots">${E.paleta.map(([c, n], i) => `<button type="button" style="background:${esc(c)}" data-i="${i}" aria-label="${esc(n)}"></button>`).join("")}</div>
    <div class="dname" id="dname"></div>
    <div class="h-caps rv">DETALLES</div>
    <p class="txt rv">${esc(E.detalles)}</p>
    <div style="position:relative;height:24cqw">${pearls([[46, 4, 4.2], [54, 12, 2.4], [49, 19, 1.8]])}</div>
  </section>

  <footer class="env">
    <div class="txt rv">${esc(C.despedida)}</div>
    <div class="script rv" style="font-size:${C.nombres ? 11 : 14}cqw;margin-top:2cqw">${C.nombres ? `${esc(C.nombres[0])} <span style="opacity:.5">&amp;</span> ${esc(C.nombres[1])}` : esc(C.firma)}</div>
    <div class="flap"></div>
    ${seal}
    <div class="wm">${esc(C.marcaDeAgua)}</div>
  </footer>`;

  // formulario de confirmación
  $("#sheet").innerHTML = `<h3>Confirmación</h3><p class="txt">${esc(E.rsvpTexto)}</p>
    <form id="form" onsubmit="return false" autocomplete="on">
      <label class="q" for="rn">TU NOMBRE</label><input type="text" id="rn" maxlength="80">
      <label class="q">¿NOS ACOMPAÑAS?</label>
      <label class="opt"><input type="radio" name="as" value="si" checked><span>Sí, ahí estaré</span></label>
      <label class="opt"><input type="radio" name="as" value="no"><span>No podré asistir</span></label>
      <div id="paxRow"><label class="q">PERSONAS</label><div class="stepper"><span>Asistentes</span><div><button type="button" data-d="-1" aria-label="Menos">−</button><b id="pax">1</b><button type="button" data-d="1" aria-label="Más">+</button></div></div></div>
      <label class="q" for="rm">MENSAJE (OPCIONAL)</label><textarea id="rm" rows="2" maxlength="300"></textarea>
      <a class="send" id="send" target="_blank" rel="noopener">ENVIAR POR WHATSAPP</a>
    </form><button class="close" type="button" id="closeRsvp">Cerrar</button>`;
  let pax = 1;
  const upd = () => {
    const si = $("input[name=as]:checked").value === "si", n = $("#rn").value.trim() || "(sin nombre)", m = $("#rm").value.trim();
    $("#paxRow").style.display = si ? "" : "none";
    const txt = `¡Hola! Soy ${n}. ` + (si ? `Confirmo mi asistencia a ${C.eventoNombre}: ${pax} ${pax === 1 ? "persona" : "personas"}.` : `No podré asistir a ${C.eventoNombre}, pero les mando mucho cariño.`) + (m ? `\n\n${m}` : "");
    $("#send").href = `https://wa.me/${E.rsvpWhatsapp}?text=${encodeURIComponent(txt)}`;
  };
  $$("#form input, #form textarea").forEach(el => el.addEventListener("input", upd));
  $$(".stepper button").forEach(b => b.addEventListener("click", () => { pax = Math.min(20, Math.max(1, pax + +b.dataset.d)); $("#pax").textContent = pax; upd(); }));
  $("#send").addEventListener("click", e => { if (!$("#rn").value.trim()) { e.preventDefault(); $("#rn").focus(); toast("Escribe tu nombre"); } });
  upd();
  const openR = () => { $("#rsvp").classList.add("on"); };
  const closeR = () => { $("#rsvp").classList.remove("on"); };
  $("#openRsvp").addEventListener("click", () => { gsap.fromTo("#openRsvp", { rotation: 0 }, { rotation: -8, duration: .15, yoyo: true, repeat: 3, onComplete: openR }); });
  $("#closeRsvp").addEventListener("click", closeR);
  $("#rsvp").addEventListener("click", e => { if (e.target.id === "rsvp") closeR(); });

  // paleta
  $$("#dots button").forEach(b => b.addEventListener("click", () => { $$("#dots button").forEach(x => x.classList.toggle("on", x === b)); $("#dname").textContent = E.paleta[+b.dataset.i][1].toUpperCase(); }));

  // sello
  $(".env .seal").addEventListener("click", () => { gsap.fromTo(".env .seal", { scale: 1, rotation: 0 }, { scale: 1.15, rotation: -6, duration: .18, yoyo: true, repeat: 3, ease: "sine.inOut" }); toast(C.mensajeSello || "¡Te esperamos!"); });

  function toast(t) { const el = $("#toast"); el.textContent = t; el.style.opacity = 1; clearTimeout(toast._t); toast._t = setTimeout(() => el.style.opacity = 0, 1800); }

  // animaciones
  gsap.fromTo(".hero .satin", { scale: 1.12 }, { scale: 1, duration: 3.2, ease: "power2.out" });
  gsap.fromTo("#oval", { opacity: 0, scale: .9, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 1.6, delay: .3, ease: "power3.out" });
  gsap.fromTo("#oval .in > *", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 1.2, stagger: .25, delay: 1.1, ease: "power2.out" });
  gsap.to(".hero .satin", { x: "-1.5%", duration: 7, yoyo: true, repeat: -1, ease: "sine.inOut", delay: 3.2 });
  const io = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return; io.unobserve(e.target); gsap.to(e.target, { opacity: 1, y: 0, duration: 1.1, ease: "power3.out" }); }), { threshold: .15 });
  $$(".rv").forEach(el => io.observe(el));
  $$("[data-float]").forEach((p, i) => gsap.to(p, { y: -8 - (i % 3) * 3, duration: 2.4 + (i % 4) * .5, yoyo: true, repeat: -1, ease: "sine.inOut", delay: i * .3 }));
  gsap.to("#openRsvp", { rotation: 4, duration: 1.8, yoyo: true, repeat: -1, ease: "sine.inOut" });
  addEventListener("scroll", () => { const y = scrollY; if (y < innerHeight) $(".hero .satin").style.translate = `0 ${y * .2}px`; }, { passive: true });

  // música opcional (suena con el primer toque)
  if (C.musica) {
    const btn = $("#music"); btn.hidden = false; btn.classList.add("off");
    const a = Object.assign(new Audio(C.musica), { loop: true });
    let on = false;
    const set = v => { on = v; btn.classList.toggle("off", !on); };
    const start = () => { if (on) return; a.play().then(() => set(true)).catch(() => {}); };
    ["pointerup", "touchend", "click", "keydown"].forEach(ev => addEventListener(ev, start, { passive: true }));
    btn.addEventListener("click", e => { e.stopPropagation(); if (on) { a.pause(); set(false); } else a.play().then(() => set(true)).catch(() => {}); });
    a.play().then(() => set(true)).catch(() => {});
  }
})();
</script>
</body>
</html>
