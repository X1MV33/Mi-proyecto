<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collage Salvia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+SC:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* Plantilla «Collage salvia»: lino en relieve, collage de papelería (tira de fotos, marco ovalado, tarjeta, corazón, vinil),
     charola de plata con encaje, calendario con sello, dress code, plato de corazón para confirmar y sobre con perlas. Todo el arte es original (SVG/CSS). */
  :root{
    --linen:#EEEAE1; --cream:#F7F4EC; --paper:#FBF9F4; --sage:#B4BF97; --sage-d:#8E9C6E; --sage-l:#DCE2C9; --choc:#5A4030; --ink:#463729; --soft:#7A6A58;
    --script:"Pinyon Script", "Snell Roundhand", cursive; --caps:"Cormorant SC", "Cormorant Garamond", serif; --serif:"Cormorant Garamond", Georgia, serif; --sans:"Jost", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#DCD6C9}
  body{color:var(--ink);font-family:var(--sans);font-weight:300}
  img{display:block;max-width:100%}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  main{position:relative;width:min(100vw,480px);margin:0 auto;container-type:inline-size;overflow:hidden;overflow:clip;background:var(--cream);box-shadow:0 0 70px rgba(60,45,30,.25)}
  .linen{background-color:var(--linen);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(120,100,70,.05) 0 1px,transparent 1px 3px),radial-gradient(120% 70% at 50% 30%,rgba(255,255,255,.5),transparent 70%)}
  .script{font-family:var(--script);font-weight:400;line-height:1}
  .caps{font-family:var(--caps);letter-spacing:.08em}
  .txt{font-size:3.6cqw;line-height:1.65;color:var(--ink)}
  .txt b{font-weight:500}
  .h2{text-align:center;color:var(--ink)}
  .h2 .s{display:block;font-family:var(--script);font-size:13cqw;line-height:.95}
  .h2 .c{display:block;font-family:var(--caps);font-size:7cqw;letter-spacing:.06em;margin-top:-1cqw}
  .on-sage .h2{color:var(--paper)}
  .pill{display:inline-block;padding:2.6cqw 9cqw;border-radius:99px;background:var(--sage);color:var(--paper);font-size:3.6cqw;letter-spacing:.14em;text-transform:uppercase;box-shadow:0 1.2cqw 3cqw -1cqw rgba(70,55,40,.35)}
  .pill.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--sage-d)}
  .pill:active{transform:scale(.97)}
  .rv{opacity:0;transform:translateY(5cqw);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
  .rv.in{opacity:1;transform:none}
  .ph{position:relative;overflow:hidden;background:linear-gradient(145deg,#D9D4C9,#B9B2A4);display:grid;place-items:center;color:rgba(70,55,40,.55);text-align:center}
  .ph span{font-family:var(--script);font-size:4.4cqw;line-height:1}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bw img{filter:grayscale(1) contrast(1.05)}
  .bw.ph{background:linear-gradient(145deg,#D6D6D3,#A9A9A5)}

  /* portada collage */
  .hero{position:relative;padding:12cqw 0 10cqw;overflow:hidden}
  .emb{position:absolute;top:0;bottom:0;width:30cqw;pointer-events:none}
  .emb.l{left:-6cqw}.emb.r{right:-6cqw}
  .hero .top{position:relative;text-align:center;font-family:var(--caps);font-size:5cqw;letter-spacing:.12em;color:var(--soft)}
  .collage{position:relative;height:136cqw;margin-top:4cqw}
  .piece{position:absolute;filter:drop-shadow(0 1.6cqw 2.2cqw rgba(60,45,30,.28));animation:drop 1.3s cubic-bezier(.2,.9,.25,1.15) both}
  @keyframes drop{from{opacity:0;transform:translateY(-14cqw) rotate(calc(var(--r) - 12deg)) scale(1.08)}to{opacity:1;transform:rotate(var(--r))}}
  .piece{transform:rotate(var(--r))}
  .strip{left:16cqw;top:2cqw;width:21cqw;padding:1.6cqw 1.6cqw 4cqw;background:#FBFAF6;--r:-5deg;animation-delay:.25s}
  .strip .ph{aspect-ratio:1/1.05;margin-bottom:1.4cqw}
  .card{left:42cqw;top:5cqw;width:43cqw;height:60cqw;--r:4deg;animation-delay:.45s}
  .card svg{position:absolute;inset:0;width:100%;height:100%}
  .card .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 3cqw}
  .card .mono{width:9cqw;height:11cqw;border:1px solid #A89A6E;border-radius:50%;display:grid;place-items:center;font-family:var(--script);font-size:5cqw;color:#8C7B4E}
  .card .std{font-family:var(--caps);font-size:3.5cqw;letter-spacing:.1em;margin-top:3cqw;color:var(--ink)}
  .card .nm{font-family:var(--script);font-size:8.6cqw;line-height:1.05;color:#5F6B45;margin-top:1.4cqw}
  .card .amp{font-family:var(--script);font-size:6cqw;color:#9AA67E;line-height:.8}
  .oval{left:4cqw;top:52cqw;width:44cqw;--r:-3deg;animation-delay:.7s}
  .oval .ph{position:absolute;left:17%;top:13%;width:66%;height:74%;border-radius:50%}
  .heart{left:58cqw;top:56cqw;width:33cqw;--r:6deg;animation-delay:.9s}
  .heart .d{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:5%;font-family:var(--serif);font-size:6.4cqw;letter-spacing:.06em;color:#F3ECE0}
  .vinyl{left:44cqw;top:78cqw;width:33cqw;height:33cqw;--r:0deg;animation-delay:1.05s;border-radius:50%}
  .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 30%,rgba(255,255,255,.06) 31%,transparent 33%),repeating-radial-gradient(circle,#141312 0 1.2px,#22201E 1.2px 2.4px);box-shadow:inset 0 0 0 1px #000}
  .disc::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent,rgba(255,255,255,.14) 8%,transparent 16%,transparent 50%,rgba(255,255,255,.1) 58%,transparent 66%)}
  .disc .ph{position:absolute;inset:30%;border-radius:50%}
  .vinyl.play .disc{animation:spin 3.2s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .vinyl .btn{position:absolute;left:50%;top:50%;width:10cqw;height:10cqw;margin:-5cqw 0 0 -5cqw;border-radius:50%;background:#FBFAF6;display:grid;place-items:center;box-shadow:0 1cqw 2cqw rgba(0,0,0,.35);z-index:2}
  .vinyl .btn svg{width:4cqw;height:4cqw}
  .callas{left:68cqw;top:76cqw;width:26cqw;--r:4deg;animation-delay:1.2s}
  .hero .info{position:relative;text-align:center;margin-top:2cqw}
  .hero .info .d{font-family:var(--caps);font-size:5cqw;letter-spacing:.08em;color:var(--soft)}
  .hero .info .v{font-family:var(--script);font-size:10cqw;line-height:1.05;padding:0 6cqw;color:var(--ink);margin:1cqw 0}
  .hero .info .a{font-family:var(--caps);font-size:4.2cqw;line-height:1.35;color:var(--soft);padding:0 10cqw}
  .hero .info .h{font-family:var(--caps);font-size:4.4cqw;letter-spacing:.06em;margin-top:2.4cqw;color:var(--soft)}

  /* secciones */
  .sec{position:relative;padding:14cqw 7cqw;text-align:center}
  .arch{position:relative;margin:0 4cqw;padding:16cqw 6cqw 14cqw;background:var(--sage);border-radius:50cqw 50cqw 6cqw 6cqw;text-align:center}
  .arch.full{border-radius:50cqw 50cqw 0 0;margin:0}
  .flower{position:absolute;width:18cqw;filter:drop-shadow(0 1.2cqw 1.6cqw rgba(60,50,30,.25));animation:sway 6s ease-in-out infinite}
  @keyframes sway{50%{transform:rotate(8deg) translateY(-1cqw)}}
  .tray{position:relative;width:86cqw;margin:6cqw auto 0}
  .tray svg.t{width:100%;height:auto;display:block}
  .tray .lace{position:absolute;left:17%;top:15%;width:66%;height:62%}
  .tray .lace svg{position:absolute;inset:0;width:100%;height:100%}
  .tray .lace .in{position:absolute;inset:14% 12%;display:flex;flex-direction:column;justify-content:center;gap:2cqw}
  .tray.big .lace{left:11%;top:8%;width:78%;height:84%}
  .tray.big .lace .in{inset:11% 11%;gap:1cqw}
  .polas{position:absolute;display:flex;gap:2cqw}
  .polaroid{background:#FBFAF6;padding:1.4cqw 1.4cqw 5cqw;box-shadow:0 1.4cqw 2.4cqw rgba(50,40,30,.3)}
  .polaroid .ph{width:22cqw;aspect-ratio:1/.85}
  .prog{display:grid;gap:1.4cqw;text-align:left}
  .prog div{display:flex;align-items:baseline;gap:2cqw}
  .prog b{font-family:var(--serif);font-style:italic;font-weight:400;font-size:5cqw;color:var(--ink);min-width:12cqw}
  .prog i{flex:1;border-bottom:1px solid rgba(70,55,40,.5);transform:translateY(-1cqw)}
  .prog span{font-size:3.1cqw;max-width:26cqw;text-align:right;line-height:1.25}
  .cal{position:relative;width:62cqw;margin:6cqw auto 0;padding:5cqw 5cqw 6cqw;background:var(--paper);box-shadow:0 2cqw 4cqw -1cqw rgba(40,40,20,.35);transform:rotate(3deg)}
  .cal .y{font-family:var(--caps);font-size:3cqw;letter-spacing:.2em;color:var(--soft)}
  .cal .m{font-family:var(--script);font-size:9cqw;color:#7C3E44;margin:1cqw 0 2cqw}
  .cal table{width:100%;border-collapse:collapse;font-family:var(--serif);font-size:3.4cqw;color:var(--ink)}
  .cal th{font-weight:500;font-size:2.8cqw;padding-bottom:1.4cqw}
  .cal td{height:6.4cqw;position:relative}
  .cal td.on svg{position:absolute;left:50%;top:50%;width:8.4cqw;transform:translate(-50%,-52%)}
  .cal .seal{position:absolute;right:-4cqw;bottom:-5cqw;width:15cqw}
  .cal .bow{position:absolute;left:-6cqw;top:-7cqw;width:24cqw;transform:rotate(-14deg)}
  .count{display:flex;justify-content:center;gap:3cqw;margin-top:9cqw}
  .count div{min-width:15cqw}
  .count b{display:block;font-family:var(--serif);font-size:9cqw;font-weight:400;line-height:1;color:var(--paper)}
  .count span{font-size:2.8cqw;letter-spacing:.16em;text-transform:uppercase;color:var(--paper);opacity:.85}
  .place{position:relative;height:78cqw;margin-top:6cqw}
  .place .env{position:absolute;left:2cqw;top:4cqw;width:62cqw}
  .place .note{position:absolute;left:10cqw;top:10cqw;width:46cqw;padding:5cqw 4cqw;background:var(--paper);transform:rotate(-12deg);box-shadow:0 1cqw 2cqw rgba(50,40,30,.2);font-size:3.6cqw;line-height:1.5}
  .place .polaroid{position:absolute;left:4cqw;top:46cqw;transform:rotate(-4deg)}
  .place .cand{position:absolute;right:0;top:0;width:38cqw;height:78cqw}
  .dots{display:flex;justify-content:center;margin:6cqw 0 2cqw}
  .dots button{width:15cqw;height:15cqw;border-radius:50%;margin-left:-3cqw;box-shadow:0 0 0 1.2cqw var(--cream);transition:transform .3s}
  .dots button:first-child{margin-left:0}
  .dots button.on{transform:translateY(-2cqw)}
  .dname{min-height:5cqw;font-size:3.2cqw;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
  .outfit{display:grid;grid-template-columns:30cqw 1fr;gap:4cqw;align-items:center;text-align:left;margin-top:5cqw}
  .outfit svg{width:30cqw;height:auto}
  .outfit h3{font-family:var(--caps);font-weight:400;font-size:7cqw;letter-spacing:.04em}
  .outfit p{font-size:3.5cqw;line-height:1.6;margin-top:1cqw}
  .on-sage .txt{color:var(--paper)}
  .kids{position:relative;margin-top:10cqw;padding:12cqw 8cqw 10cqw;background:var(--cream);border-radius:6cqw}
  .kids .lacebg{position:absolute;inset:0;opacity:.6}
  .kids h3{position:relative;font-family:var(--caps);font-weight:400;font-size:8cqw}
  .kids p{position:relative}
  .on-sage .kids .txt{color:var(--ink);margin-top:2cqw}
  .plate{position:relative;width:84cqw;margin:6cqw auto 0}
  .plate svg.p{width:100%;height:auto;display:block}
  .plate .lace{position:absolute;left:24%;top:22%;width:52%;height:50%}
  .plate .lace svg{position:absolute;inset:0;width:100%;height:100%}
  .plate .lace p{position:absolute;inset:16% 12%;display:grid;place-items:center;font-size:3.3cqw;line-height:1.5}
  .closing{position:relative;height:96cqw;margin-top:4cqw}
  .closing svg{position:absolute;inset:0;width:100%;height:100%}
  .closing .msg{position:absolute;left:25%;top:34%;width:50%;text-align:center;transform:rotate(-6deg)}
  .closing .msg .s{font-family:var(--script);font-size:9.6cqw;line-height:.95;color:var(--ink)}
  .closing .msg .c{font-family:var(--caps);font-size:4.6cqw;margin-top:1.4cqw;color:var(--soft)}
  .wm{padding:6cqw 0 8cqw;text-align:center;font-size:2.8cqw;letter-spacing:.2em;color:var(--soft);opacity:.7}

  /* formulario */
  #rsvp{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(40,32,24,.4);visibility:hidden;opacity:0;transition:opacity .3s}
  #rsvp.on{visibility:visible;opacity:1}
  #rsvp .sheet{width:min(100vw,480px);max-height:92vh;overflow:auto;border-radius:6cqw 6cqw 0 0;padding:9cqw 8cqw calc(8cqw + env(safe-area-inset-bottom));container-type:inline-size;background:var(--cream);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  #rsvp.on .sheet{transform:none}
  #rsvp h3{text-align:center;font-family:var(--script);font-weight:400;font-size:13cqw}
  #rsvp label.q{display:block;font-size:3.4cqw;letter-spacing:.12em;text-transform:uppercase;margin:4cqw 0 1.6cqw;color:var(--soft)}
  #rsvp input[type=text],#rsvp textarea{width:100%;font-family:var(--sans);font-size:16px;color:var(--ink);border:1px solid rgba(70,55,40,.2);background:#fff;padding:3cqw;border-radius:2cqw;outline:none;resize:none}
  .opt{display:flex;align-items:center;gap:3cqw;margin-top:2cqw;padding:3cqw 4cqw;border-radius:2cqw;background:#fff;border:1px solid transparent;font-size:3.8cqw;cursor:pointer}
  .opt:has(input:checked){border-color:var(--sage-d)}
  .opt input{accent-color:var(--sage-d)}
  .stepper{display:flex;align-items:center;justify-content:space-between;padding:2cqw 2cqw 2cqw 4cqw;border-radius:2cqw;background:#fff;font-size:3.8cqw}
  .stepper div{display:flex;align-items:center;gap:4cqw}
  .stepper button{width:9cqw;height:9cqw;border-radius:50%;border:1px solid var(--sage-d);font-size:5cqw;line-height:1}
  .stepper b{font-family:var(--serif);font-size:6cqw;font-weight:400;min-width:6cqw;text-align:center}
  .send{display:block;width:100%;margin-top:6cqw;padding:3.6cqw;border-radius:99px;background:var(--sage-d);color:#fff;text-align:center;font-size:3.6cqw;letter-spacing:.16em;text-transform:uppercase}
  .close{display:block;margin:5cqw auto 0;font-size:3.4cqw;text-decoration:underline;text-underline-offset:1.2cqw;color:var(--soft)}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;z-index:40;pointer-events:none;transition:opacity .3s}
  @media (prefers-reduced-motion:reduce){.piece,.flower,.vinyl.play .disc{animation:none}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<main id="inv"></main>
<div id="rsvp" role="dialog" aria-modal="true" aria-label="Confirmar asistencia"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
(() => {
"use strict";
const C = window.CONFIG, E = C.evento;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
document.title = C.tituloPestana;
const ph = (src, cls = "") => `<div class="ph ${cls}">${src ? `<img src="${esc(src)}" alt="" loading="lazy">` : `<span>Tu foto<br>aquí</span>`}</div>`;
let uid = 0; const id = p => p + (++uid);

/* ---------- arte SVG (original) ---------- */
const HEART = "M50 90C20 68 4 50 4 31 4 16 15 6 28 6c9 0 17 5 22 13C55 11 63 6 72 6c13 0 24 10 24 25 0 19-16 37-46 59z";
const silver = g => `<linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8D8B87"/><stop offset=".22" stop-color="#F4F3F0"/><stop offset=".4" stop-color="#A9A7A2"/><stop offset=".62" stop-color="#ECEBE7"/><stop offset=".82" stop-color="#7E7C77"/><stop offset="1" stop-color="#D5D3CE"/></linearGradient>`;
const embossF = f => `<filter id="${f}" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"/><feDiffuseLighting in="b" surfaceScale="2.6" diffuseConstant="1.12" lighting-color="#F5F1E8" result="d"><feDistantLight azimuth="225" elevation="62"/></feDiffuseLighting><feComposite in="d" in2="SourceAlpha" operator="in" result="dd"/><feSpecularLighting in="b" surfaceScale="3.2" specularConstant=".45" specularExponent="20" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting><feComposite in="s" in2="SourceAlpha" operator="in" result="ss"/><feMerge><feMergeNode in="dd"/><feMergeNode in="ss"/></feMerge></filter>`;
function peony(x, y, r, rot) { let d = ""; for (let ring = 0; ring < 3; ring++) { const n = 9 - ring * 2, rr = r * (1 - ring * .28); for (let k = 0; k < n; k++) { const a = (k / n) * 6.283 + ring * .4 + rot; const px = x + Math.cos(a) * rr * .55, py = y + Math.sin(a) * rr * .55; d += `<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${(rr * .48).toFixed(1)}" ry="${(rr * .32).toFixed(1)}" transform="rotate(${(a * 57.3 + 90).toFixed(0)} ${px.toFixed(1)} ${py.toFixed(1)})"/>`; } } return d + `<circle cx="${x}" cy="${y}" r="${(r * .18).toFixed(1)}"/>`; }
function leaf(x, y, l, a) { return `<path transform="translate(${x} ${y}) rotate(${a})" d="M0 0C${l * .3} ${-l * .22} ${l * .75} ${-l * .2} ${l} 0C${l * .75} ${l * .2} ${l * .3} ${l * .22} 0 0Z"/>`; }
function sprig(x, y, l, a) { let d = `<path transform="translate(${x} ${y}) rotate(${a})" d="M0 0Q${l * .5} ${-l * .08} ${l} 0" fill="none" stroke="#000" stroke-width="2.4"/>`; for (let i = 1; i < 7; i++) { const t = i / 7, px = x + Math.cos(a / 57.3) * l * t, py = y + Math.sin(a / 57.3) * l * t; d += `<circle cx="${(px + 6).toFixed(1)}" cy="${(py - 6).toFixed(1)}" r="4.2"/><circle cx="${(px - 5).toFixed(1)}" cy="${(py + 6).toFixed(1)}" r="3.6"/>`; } return d; }
function rose(x, y, r, rot) {
  let d = "";
  for (let ring = 0; ring < 4; ring++) {
    const n = 7 - ring, rr = r * (1 - ring * .23);
    for (let k = 0; k < n; k++) {
      const a0 = (k / n) * 6.283 + ring * .55 + rot, a1 = a0 + 6.283 / n * 1.05;
      const p0 = [x + Math.cos(a0) * rr, y + Math.sin(a0) * rr], p1 = [x + Math.cos(a1) * rr, y + Math.sin(a1) * rr];
      const am = (a0 + a1) / 2, c = [x + Math.cos(am) * rr * 1.32, y + Math.sin(am) * rr * 1.32];
      d += `M${p0[0].toFixed(1)} ${p0[1].toFixed(1)}Q${c[0].toFixed(1)} ${c[1].toFixed(1)} ${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`;
    }
  }
  return `<path d="${d}" fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="${(r * .14).toFixed(1)}"/>`;
}

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .14 });
$$(".rv").forEach(el => io.observe(el));
$$("#dots button").forEach(b => b.addEventListener("click", () => { $$("#dots button").forEach(x => x.classList.toggle("on", x === b)); $("#dname").textContent = E.paleta[+b.dataset.i][1]; }));
function tick() { const ms = fecha - new Date(), d = Math.max(0, ms); const p = [Math.floor(d / 864e5), Math.floor(d / 36e5) % 24, Math.floor(d / 6e4) % 60]; $("#count").innerHTML = [["Días", p[0]], ["Horas", p[1]], ["Min", p[2]]].map(([t, v]) => `<div><b>${v}</b><span>${t}</span></div>`).join(""); }
tick(); setInterval(tick, 30000);
function toast(t) { const el = $("#toast"); el.textContent = t; el.style.opacity = 1; clearTimeout(toast._t); toast._t = setTimeout(() => el.style.opacity = 0, 1900); }

// música en el vinil
let audio = null;
$("#play").addEventListener("click", () => {
  if (!C.musica) { toast("Aquí sonará su canción 🎶"); $("#vinyl").classList.toggle("play"); return; }
  audio = audio || Object.assign(new Audio(C.musica), { loop: true });
  if (audio.paused) audio.play().then(() => { $("#vinyl").classList.add("play"); $("#play").innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="#2B2420"/></svg>'; }).catch(() => toast("Toca de nuevo para escuchar"));
  else { audio.pause(); $("#vinyl").classList.remove("play"); $("#play").innerHTML = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#2B2420"/></svg>'; }
});

// confirmación
$("#sheet").innerHTML = `<h3>Confirmación</h3>
  <form id="form" onsubmit="return false">
    <label class="q" for="rn">Tu nombre</label><input type="text" id="rn" maxlength="80">
    <label class="q">¿Nos acompañas?</label>
    <label class="opt"><input type="radio" name="as" value="si" checked><span>Sí, ahí estaré</span></label>
    <label class="opt"><input type="radio" name="as" value="no"><span>No podré asistir</span></label>
    <div id="paxRow"><label class="q">Personas</label><div class="stepper"><span>Asistentes</span><div><button type="button" data-d="-1" aria-label="Menos">−</button><b id="pax">1</b><button type="button" data-d="1" aria-label="Más">+</button></div></div></div>
    <label class="q" for="rm">Mensaje (opcional)</label><textarea id="rm" rows="2" maxlength="300"></textarea>
    <a class="send" id="send" target="_blank" rel="noopener">Enviar por WhatsApp</a>
  </form><button class="close" type="button" id="closeR">Cerrar</button>`;
let pax = 1;
const upd = () => { const si = $("input[name=as]:checked").value === "si", n = $("#rn").value.trim() || "(sin nombre)", m = $("#rm").value.trim(); $("#paxRow").style.display = si ? "" : "none";
  const t = `¡Hola! Soy ${n}. ` + (si ? `Confirmo mi asistencia a la boda de ${n1} y ${n2}: ${pax} ${pax === 1 ? "persona" : "personas"}.` : `No podré asistir a la boda de ${n1} y ${n2}, pero les mando mucho cariño.`) + (m ? `\n\n${m}` : "");
  $("#send").href = `https://wa.me/${E.rsvpWhatsapp}?text=${encodeURIComponent(t)}`; };
$$("#form input, #form textarea").forEach(el => el.addEventListener("input", upd));
$$(".stepper button").forEach(b => b.addEventListener("click", () => { pax = Math.min(20, Math.max(1, pax + +b.dataset.d)); $("#pax").textContent = pax; upd(); }));
$("#send").addEventListener("click", e => { if (!$("#rn").value.trim()) { e.preventDefault(); $("#rn").focus(); toast("Escribe tu nombre"); } });
upd();
$$("[data-rsvp]").forEach(b => b.addEventListener("click", () => $("#rsvp").classList.add("on")));
$("#closeR").addEventListener("click", () => $("#rsvp").classList.remove("on"));
$("#rsvp").addEventListener("click", e => { if (e.target.id === "rsvp") $("#rsvp").classList.remove("on"); });
})();
</script>
</body>
</html>
