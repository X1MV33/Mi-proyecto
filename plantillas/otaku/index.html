<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Invitación Otaku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=block" rel="stylesheet">
<style>
  /* Tomo de manga: papel, tinta negra, tramas de puntos y un rojo de sello (hanko) */
  :root{
    --paper:#F4F1EA; --paper2:#FBFAF6; --ink:#121212; --ink2:#3A3A3A; --red:#D7263D; --gray:#8C8C8C;
    --display:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
    --sfx:"Bangers","Dela Gothic One",cursive;
    --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0c0c0c;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--body);color:var(--ink);-webkit-tap-highlight-color:transparent}
  #stage{position:relative;width:min(100vw,56.25vh);width:min(100vw,56.25dvh);height:100%;overflow:hidden;container-type:size;background:#111;isolation:isolate;
    user-select:none;-webkit-user-select:none}
  img{display:block;-webkit-user-drag:none}
  .will{will-change:transform,opacity}

  /* =================== PORTADA ANIMADA (capas reales de la imagen) =================== */
  #cover{position:absolute;inset:0;z-index:5;background:#e9e9e9;overflow:hidden;cursor:pointer}
  #tilt{position:absolute;inset:0;perspective:160cqw;transform-style:preserve-3d}
  .cv{--cw:max(100cqw,46.16cqh);position:absolute;width:var(--cw);height:calc(var(--cw) * 2.1665);
    left:calc(50% - var(--cw) / 2);top:calc(50% - var(--cw) * 1.0833);transform-style:preserve-3d;transform-origin:50% 47%}
  .ly{position:absolute;inset:0;width:100%;height:100%}
  .ly.top{transform-origin:0% 100%}
  .ly.bot{transform-origin:100% 0%}
  .sweep{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
    background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.75) 50%,transparent 62%) -120% 0/60% 100% no-repeat;
    -webkit-mask:url("portada/franja_ojos.webp") 0 0/100% 100% no-repeat;mask:url("portada/franja_ojos.webp") 0 0/100% 100% no-repeat}
  .glint{position:absolute;width:5%;aspect-ratio:1;margin:-2.5% 0 0 -2.5%;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,255,255,.35) 30%,transparent 65%)}
  .glint.g1{left:72.3%;top:40.2%}
  .glint.g2{left:31.1%;top:52.6%}
  #dust{position:absolute;inset:0;pointer-events:none}
  .speck{position:absolute;width:.9cqw;height:.9cqw;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 1cqw rgba(255,255,255,.6)}
  .speck.ink{background:rgba(20,20,20,.55);box-shadow:none}
  .speed{position:absolute;inset:-20%;pointer-events:none;opacity:0;
    background:repeating-conic-gradient(from 0deg at 50% 47%,transparent 0 2.6deg,rgba(10,10,10,.9) 2.6deg 3.1deg);
    -webkit-mask:radial-gradient(circle at 50% 47%,transparent 18%,#000 55%);mask:radial-gradient(circle at 50% 47%,transparent 18%,#000 55%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.09;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 70% at 50% 47%,transparent 55%,rgba(0,0,0,.42) 100%)}
  .tapb{position:absolute;left:50%;bottom:calc(9cqh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;
    font-family:var(--sfx);font-size:7.6cqw;letter-spacing:.06em;color:var(--ink);background:#fff;border:.7cqw solid var(--ink);
    padding:2cqw 6cqw;border-radius:50%;white-space:nowrap;box-shadow:1.2cqw 1.2cqw 0 var(--ink)}
  .tapb::after{content:"";position:absolute;left:58%;top:100%;border:2.6cqw solid transparent;border-top:3.4cqw solid var(--ink);transform:skewX(-20deg)}
  .tapb::before{content:"";position:absolute;left:calc(58% + .9cqw);top:calc(100% - .9cqw);border:1.8cqw solid transparent;border-top:2.4cqw solid #fff;transform:skewX(-20deg);z-index:1}
  .wm{position:absolute;left:0;right:0;bottom:calc(2.6cqh + env(safe-area-inset-bottom,0px));text-align:center;z-index:3;
    font-size:2.8cqw;letter-spacing:.24em;color:rgba(255,255,255,.85);text-shadow:0 0 1cqw rgba(0,0,0,.6);pointer-events:none}
  /* escena Yuta + Rika (después de tocar) */
  #scene{position:absolute;inset:0;z-index:6;overflow:hidden;visibility:hidden;background:#e6e7ec}
  .sc{--sw:max(100cqw,57.13cqh);position:absolute;width:var(--sw);height:calc(var(--sw) * 1.7504);
    left:calc(50% - var(--sw) / 2);top:calc(50% - var(--sw) * .8752);transform-origin:51.11% 52.98%}
  .sc .mouth{position:absolute;left:44.02%;top:14.16%;width:14.79%;height:12.79%;transform-origin:50% 8%}
  .sc .rglow{position:absolute;left:51.37%;top:20.4%;width:12%;aspect-ratio:1;margin:-6% 0 0 -6%;border-radius:50%;opacity:0;mix-blend-mode:screen;
    background:radial-gradient(circle,#fff 0,rgba(255,170,185,.85) 30%,rgba(200,30,60,.35) 55%,transparent 72%)}
  .sc .reye{position:absolute;left:51.37%;top:11.52%;width:7%;aspect-ratio:1;margin:-3.5% 0 0 -3.5%;border-radius:50%;opacity:0;mix-blend-mode:screen;
    background:radial-gradient(circle,rgba(255,235,235,1) 0,rgba(255,40,60,.85) 30%,transparent 70%)}
  .speed2{position:absolute;inset:-30%;pointer-events:none;opacity:0;
    background:repeating-conic-gradient(from 0deg at var(--mx,50%) var(--my,30%),transparent 0 2.4deg,rgba(15,12,20,.85) 2.4deg 2.9deg);
    -webkit-mask:radial-gradient(circle at var(--mx,50%) var(--my,30%),transparent 20%,#000 46%,transparent 70%);mask:radial-gradient(circle at var(--mx,50%) var(--my,30%),transparent 20%,#000 46%,transparent 70%)}
  #flash{position:absolute;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none}
  #loader{position:absolute;inset:0;z-index:30;background:#111;color:#eee;display:flex;align-items:center;justify-content:center;font-family:var(--sfx);font-size:6cqw;letter-spacing:.1em}
  body.reel .ui{display:none!important}
  body.reel{cursor:none}

  /* =================== INVITACIÓN (tomo de manga) =================== */
  #inv{position:absolute;inset:0;z-index:4;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;visibility:hidden;background:var(--paper)}
  /* fondo: collage de manga fijo detrás del contenido (aclarado para que se lea) */
  .bgfix{position:sticky;top:0;height:100cqh;margin-bottom:-100cqh;z-index:0;overflow:hidden;pointer-events:none}
  .bgfix .img{position:absolute;inset:-6% 0;background:url("portada/fondo_manga.jpg") center/cover}
  .bgfix::after{content:"";position:absolute;inset:0;background:
    radial-gradient(circle,rgba(0,0,0,.06) .5px,transparent .9px) 0 0/1.6cqw 1.6cqw,
    linear-gradient(rgba(246,244,238,.8),rgba(246,244,238,.74))}
  #invContent{position:relative;z-index:1}
  .page{position:relative;padding:14cqw 7cqw;border-bottom:1.2cqw solid var(--ink)}
  .rv{opacity:0}
  h2.ttl{font-family:var(--display);font-weight:400;font-size:8.4cqw;line-height:1.15;text-align:center;margin-bottom:7cqw}
  h2.ttl span{display:block;font-family:var(--body);font-weight:700;font-size:3.4cqw;letter-spacing:.3em;color:var(--red);margin-bottom:1.6cqw}
  .sfx{position:absolute;font-family:var(--sfx);color:var(--red);-webkit-text-stroke:.5cqw var(--ink);paint-order:stroke fill;line-height:1;pointer-events:none;
    text-shadow:.8cqw .8cqw 0 var(--ink)}

  /* portada del tomo */
  .tomo{padding:8cqw 6cqw 14cqw;background:rgba(255,255,255,.55);overflow:hidden}
  .t-top{display:flex;justify-content:space-between;align-items:flex-start}
  .vol{font-family:var(--sfx);font-size:6cqw;letter-spacing:.06em;background:var(--ink);color:#fff;padding:1cqw 3cqw;transform:skewX(-8deg)}
  .vol b{font-size:9cqw;font-weight:400;margin-left:1.4cqw;color:var(--red)}
  .jp{writing-mode:vertical-rl;font-family:var(--display);font-size:6.4cqw;color:var(--red);letter-spacing:.2em}
  .t-art{position:relative;height:84cqw;margin:4cqw -1cqw 0;border:1.2cqw solid var(--ink);overflow:hidden;transform:rotate(-1.6deg);box-shadow:2cqw 2cqw 0 var(--ink)}
  .t-art img{width:100%;height:100%;object-fit:cover;object-position:50% 47%;transform:scale(1.15)}
  .t-art .lines{position:absolute;inset:-30%;opacity:.25;background:repeating-conic-gradient(from 0deg at 50% 50%,transparent 0 3deg,#000 3deg 3.4deg);
    -webkit-mask:radial-gradient(circle,transparent 30%,#000 70%);mask:radial-gradient(circle,transparent 30%,#000 70%)}
  .t-title{margin-top:8cqw;text-align:center;font-family:var(--display);font-weight:400;font-size:20cqw;line-height:.95;letter-spacing:-.01em}
  .t-title small{display:block;font-family:var(--sfx);font-size:9cqw;letter-spacing:.06em;color:var(--red);margin-bottom:2cqw;-webkit-text-stroke:.35cqw var(--ink);paint-order:stroke fill}
  .t-sub{margin-top:4cqw;text-align:center;font-weight:700;font-size:4.4cqw;letter-spacing:.06em}
  .t-sub b{background:var(--ink);color:#fff;padding:.4cqw 2cqw;margin-right:1cqw}
  .t-date{margin-top:3cqw;text-align:center;font-size:4.2cqw;color:var(--ink2)}
  .tomo .sfx.s1{right:4cqw;top:46cqw;font-size:15cqw;transform:rotate(12deg)}
  .scrollhint{margin-top:8cqw;text-align:center;font-family:var(--sfx);font-size:5cqw;letter-spacing:.2em}

  /* globo de diálogo */
  .bubble{position:relative;background:#fff;border:.7cqw solid var(--ink);border-radius:46% 54% 50% 50% / 50% 50% 50% 50%;padding:10cqw 9cqw;
    font-size:4.8cqw;line-height:1.55;text-align:center;font-weight:500}
  .bubble::after{content:"";position:absolute;left:20%;bottom:-6cqw;border:3cqw solid transparent;border-top:6cqw solid var(--ink);transform:rotate(18deg)}
  .bubble::before{content:"";position:absolute;left:calc(20% + .6cqw);bottom:-4.2cqw;border:2.4cqw solid transparent;border-top:4.8cqw solid #fff;transform:rotate(18deg);z-index:1}
  .sec-msg .sfx{right:6cqw;bottom:6cqw;font-size:11cqw;transform:rotate(-10deg)}

  /* viñetas */
  .panels{display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
  .pn{position:relative;background:#fff;border:1cqw solid var(--ink);padding:6cqw 4cqw;min-width:0;box-shadow:1.4cqw 1.4cqw 0 var(--ink)}
  .pn.wide{grid-column:1 / -1}
  .pn .tag{position:absolute;top:-3.6cqw;left:3cqw;background:var(--red);color:#fff;font-weight:700;font-size:3cqw;letter-spacing:.2em;padding:.8cqw 2.4cqw;border:.6cqw solid var(--ink)}
  .pn .big{font-family:var(--display);font-size:16cqw;line-height:1}
  .pn .mid{font-family:var(--display);font-size:5.6cqw;line-height:1.2}
  .pn p{font-size:4cqw;line-height:1.45;color:var(--ink2);margin-top:2cqw}
  .mbtn{display:inline-block;margin-top:4cqw;font-family:var(--sfx);font-size:5cqw;letter-spacing:.08em;color:#fff;background:var(--ink);padding:1.6cqw 5cqw;
    text-decoration:none;transform:skewX(-8deg);border:0;cursor:pointer}
  .mbtn.red{background:var(--red);box-shadow:1cqw 1cqw 0 var(--ink)}
  .mbtn.ghost{background:#fff;color:var(--ink);border:.6cqw solid var(--ink)}

  /* cuenta regresiva */
  .count{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4cqw}
  .count div{background:var(--ink);color:#fff;text-align:center;padding:4cqw 0 2.4cqw;transform:skewX(-6deg)}
  .count b{display:block;font-family:var(--sfx);font-weight:400;font-size:12cqw;line-height:1;font-variant-numeric:tabular-nums}
  .count span{font-size:2.6cqw;letter-spacing:.2em;text-transform:uppercase;color:#ddd}
  .cal{display:flex;flex-wrap:wrap;gap:3cqw;justify-content:center;margin-top:6cqw}
  .sec-count .sfx{left:4cqw;top:8cqw;font-size:9cqw;transform:rotate(-12deg)}

  /* itinerario: episodios */
  .eps{display:flex;flex-direction:column;gap:3.4cqw}
  .ep{display:grid;grid-template-columns:24cqw 1fr;align-items:stretch;background:#fff;border:.8cqw solid var(--ink)}
  .ep:nth-child(even){transform:rotate(.8deg)} .ep:nth-child(odd){transform:rotate(-.8deg)}
  .ep .h{background:var(--ink);color:#fff;font-family:var(--sfx);font-size:7cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:2cqw 0}
  .ep .h small{font-family:var(--body);font-size:2.6cqw;letter-spacing:.2em;color:var(--red);margin-bottom:1cqw}
  .ep .w{padding:4cqw;font-weight:700;font-size:4.8cqw;display:flex;align-items:center}

  /* galería */
  .gal{display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
  .gal figure{border:1cqw solid var(--ink);overflow:hidden;aspect-ratio:3/4;cursor:zoom-in;background:#ddd;box-shadow:1.2cqw 1.2cqw 0 var(--ink)}
  .gal figure:nth-child(3n+1){grid-column:1 / -1;aspect-ratio:16/10}
  .gal img{width:100%;height:100%;object-fit:cover;filter:grayscale(.15) contrast(1.05)}
  #lightbox{position:absolute;inset:0;z-index:40;background:rgba(10,10,10,.94);display:flex;align-items:center;justify-content:center;visibility:hidden;opacity:0}
  #lightbox img{max-width:92cqw;max-height:80cqh;border:1cqw solid #fff}
  #lightbox button{position:absolute;top:calc(4cqw + env(safe-area-inset-top,0px));right:4cqw;width:11cqw;height:11cqw;border-radius:50%;border:.5cqw solid #fff;background:none;color:#fff;font-size:6cqw;cursor:pointer}

  /* confirmación */
  .rsvp{display:flex;flex-direction:column;gap:3.6cqw;background:#fff;border:1cqw solid var(--ink);padding:7cqw 6cqw;box-shadow:1.6cqw 1.6cqw 0 var(--ink)}
  .rsvp label.q,.rsvp .q{font-weight:700;font-size:4cqw}
  .rsvp input[type=text],.rsvp textarea{font:inherit;font-size:4.4cqw;border:.6cqw solid var(--ink);padding:2.6cqw 3cqw;width:100%;background:var(--paper2);outline:none;resize:none;border-radius:0}
  .rsvp input:focus,.rsvp textarea:focus{background:#fff;box-shadow:1cqw 1cqw 0 var(--red)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
  .opt{position:relative;cursor:pointer}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt span{display:block;text-align:center;padding:2.6cqw 1cqw;border:.6cqw solid var(--ink);font-family:var(--sfx);font-size:5.2cqw;letter-spacing:.06em;background:#fff;transition:background .2s,color .2s}
  .opt input:checked + span{background:var(--ink);color:#fff}
  .opt input:focus-visible + span{outline:.6cqw solid var(--red);outline-offset:.6cqw}
  .stepper{display:flex;align-items:center;justify-content:space-between;border:.6cqw solid var(--ink);padding:1.4cqw 2cqw 1.4cqw 3cqw;font-weight:700;font-size:4.2cqw}
  .stepper div{display:flex;align-items:center;gap:3cqw}
  .stepper button{width:9cqw;height:9cqw;border:.6cqw solid var(--ink);background:#fff;font-family:var(--sfx);font-size:6cqw;cursor:pointer;line-height:1}
  .stepper b{font-family:var(--sfx);font-weight:400;font-size:8cqw;min-width:7cqw;text-align:center;color:var(--red)}
  .wa{display:block;text-align:center;margin-top:2cqw;font-family:var(--sfx);font-size:6.4cqw;letter-spacing:.08em;color:#fff;background:var(--red);
    padding:3cqw;text-decoration:none;border:.7cqw solid var(--ink);box-shadow:1.2cqw 1.2cqw 0 var(--ink)}
  .note{font-size:3.6cqw;color:var(--ink2);text-align:center;margin-top:-1cqw}

  /* fin */
  .fin{background:var(--ink);color:#fff;text-align:center;padding:20cqw 8cqw 16cqw;border:0}
  .fin .jp2{font-family:var(--display);font-size:16cqw;letter-spacing:.06em}
  .fin .cont{font-family:var(--sfx);font-size:9cqw;letter-spacing:.08em;margin-top:2cqw}
  .fin p{margin-top:5cqw;font-size:4.4cqw;color:#ccc}
  .hanko{width:26cqw;height:26cqw;margin:10cqw auto 0;background:var(--red);border-radius:2cqw;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:13cqw;color:#fff;transform:rotate(-8deg);box-shadow:inset 0 0 0 1.2cqw var(--red),inset 0 0 0 1.8cqw #fff;opacity:0}
  .fin .wm2{margin-top:12cqw;font-size:2.8cqw;letter-spacing:.24em;color:#888}

  /* interfaz flotante */
  #musicBtn{position:absolute;z-index:25;top:calc(3cqw + env(safe-area-inset-top,0px));right:3.5cqw;width:12cqw;height:12cqw;border:.7cqw solid var(--ink);
    background:#fff;font-family:var(--sfx);font-size:6cqw;cursor:pointer;box-shadow:1cqw 1cqw 0 var(--ink);visibility:hidden;color:var(--ink)}
  #musicBtn.off{background:#ddd;text-decoration:line-through}
  #pageNum{position:absolute;z-index:25;bottom:calc(3cqw + env(safe-area-inset-bottom,0px));right:3.5cqw;font-family:var(--sfx);font-size:4.4cqw;letter-spacing:.1em;
    background:var(--ink);color:#fff;padding:.8cqw 2.6cqw;visibility:hidden;transform:skewX(-8deg)}
  #fx{position:absolute;inset:0;z-index:26;pointer-events:none;overflow:hidden}
  .pop{position:absolute;font-family:var(--sfx);color:var(--red);-webkit-text-stroke:.45cqw var(--ink);paint-order:stroke fill;text-shadow:.6cqw .6cqw 0 var(--ink);
    font-size:10cqw;line-height:1;transform:translate(-50%,-50%);white-space:nowrap}
  .burst{position:absolute;width:30cqw;height:30cqw;margin:-15cqw 0 0 -15cqw}
  @media (prefers-reduced-motion: reduce){ .speck{display:none} }
</style>
</head>
<body>
<div id="stage" aria-label="Invitación otaku">

  <!-- ===== PORTADA ANIMADA ===== -->
  <section id="cover" aria-label="Portada: toca para abrir">
    <div id="tilt">
      <div class="cv will" id="cv">
        <img class="ly band will" data-src="portada/franja_ojos.webp" alt="">
        <div class="sweep"></div>
        <i class="glint g1 will"></i><i class="glint g2 will"></i>
        <img class="ly top will" data-src="portada/papel_arriba.webp" alt="">
        <img class="ly bot will" data-src="portada/papel_abajo.webp" alt="">
      </div>
    </div>
    <div id="dust"></div>
    <div class="speed will" id="speed"></div>
    <div class="grain"></div><div class="vig"></div>
    <div class="tapb ui will" id="tap"></div>
    <div class="wm" id="wm"></div>
  </section>
  <section id="scene" aria-hidden="true">
    <div class="sc will" id="sc">
      <img class="ly" data-src="portada/rika_escena.jpg" alt="">
      <img class="mouth will" id="mouth" data-src="portada/rika_boca.webp" alt="">
      <i class="rglow will" id="rglow"></i>
      <i class="reye will" id="reye"></i>
    </div>
    <div class="speed2 will" id="speed2"></div>
    <div class="grain"></div><div class="vig"></div>
  </section>
  <div id="flash"></div>

  <!-- ===== INVITACIÓN ===== -->
  <main id="inv" aria-hidden="true"><div class="bgfix" aria-hidden="true"><div class="img" id="bgImg"></div></div><div id="invContent"></div></main>

  <button id="musicBtn" class="ui" aria-label="Activar o pausar la música">♪</button>
  <div id="pageNum" class="ui"></div>
  <div id="fx" aria-hidden="true"></div>
  <div id="lightbox" role="dialog" aria-label="Foto"><img id="lbImg" alt=""><button id="lbClose" aria-label="Cerrar">×</button></div>
  <div id="loader">CARGANDO…</div>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const CONFIG = window.CONFIG;   // los datos viven en config.js
(() => {
  "use strict";
  const REEL = new URLSearchParams(location.search).get("reel") === "1";
  if (REEL) document.body.classList.add("reel");

  /* ---------------- música original (chiptune suave) ---------------- */
  const Musica = (() => {
    let ctx, master, timer, audio, on = false, nextT = 0, step = 0;
    const BPM = 112, S16 = 60 / BPM / 4, mtof = n => 440 * Math.pow(2, (n - 69) / 12);
    const prog = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];          // Lam – Fa – Do – Sol
    const lead = [76, 0, 74, 76, 79, 0, 76, 74, 72, 0, 74, 72, 69, 0, 72, 74];

      a.gain.setValueAtTime(0, t); a.gain.linearRampToValueAtTime(g, t + .01); a.gain.exponentialRampToValueAtTime(.0001, t + d);

      const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain(); f.type = "highpass"; f.frequency.value = 7000; g.gain.value = .05; s.buffer = b; s.connect(f).connect(g).connect(master); s.start(t); }
    function sched() {
      while (nextT < ctx.currentTime + .2) {
        const bar = Math.floor(step / 16) % 4, s = step % 16, ch = prog[bar];
        if (s % 4 === 0) note(ch[0] - 24, nextT, .35, "triangle", .28);
        if (s % 2 === 0) note(ch[(s / 2) % 3] + 12, nextT, .18, "square", .035);
        if (s % 2 === 1) hat(nextT);
        const m = lead[s]; if (m && Math.floor(step / 64) % 2 === 1) note(m, nextT, .28, "square", .05);
        nextT += S16; step++;
      }
    }
    function play() {
      on = true;
      if (CONFIG.musica) { audio = audio || Object.assign(new Audio(CONFIG.musica), { loop: true, volume: .8 }); audio.play().catch(() => {}); }
      else {
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if (!master) { master = ctx.createGain(); const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 3200; master.connect(lp).connect(ctx.destination); }
        ctx.resume(); master.gain.setTargetAtTime(.6, ctx.currentTime, .4); nextT = ctx.currentTime + .05; clearInterval(timer); timer = setInterval(sched, 50);
      }
      $("#musicBtn").classList.remove("off");
    }
    function pause() { on = false; if (audio) audio.pause(); if (ctx) { master.gain.setTargetAtTime(0, ctx.currentTime, .15); setTimeout(() => clearInterval(timer), 600); } $("#musicBtn").classList.add("off"); }
    document.addEventListener("visibilitychange", () => { if (document.hidden) { audio && audio.pause(); ctx && ctx.suspend(); } else if (on) { audio && audio.play(); ctx && ctx.resume(); } });
    return { play, toggle: () => (on ? pause() : play()) };
  })();

  /* ---------------- animación ---------------- */
  function start() {
    gsap.to("#loader", { opacity: 0, duration: .5, onComplete: () => $("#loader").remove() });
    const cv = $("#cv");

    // vida en la portada: respiración, papeles que se mueven distinto (profundidad), brillo en los ojos
    gsap.fromTo(cv, { scale: 1.06 }, { scale: 1.0, duration: 2.4, ease: "power2.out" });
    gsap.to(cv, { scale: 1.035, duration: 6, ease: "sine.inOut", yoyo: true, repeat: -1, delay: 2.4 });
    gsap.to(cv, { rotationY: 2.2, rotationX: -1.4, duration: 7, ease: "sine.inOut", yoyo: true, repeat: -1 });
    gsap.set(".ly.top", { z: 40 }); gsap.set(".ly.bot", { z: 40 });
    gsap.to(".ly.top", { x: -6, y: -7, rotation: -.4, duration: 4.6, ease: "sine.inOut", yoyo: true, repeat: -1 });
    gsap.to(".ly.bot", { x: 6, y: 7, rotation: .35, duration: 5.3, ease: "sine.inOut", yoyo: true, repeat: -1 });
    gsap.to(".ly.band", { x: 2, y: -2, duration: 6.2, ease: "sine.inOut", yoyo: true, repeat: -1 });
    gsap.to(".sweep", { backgroundPosition: "220% 0", duration: 2.6, ease: "power1.inOut", repeat: -1, repeatDelay: 2.8, delay: 1.2 });
    $$(".glint").forEach((g, i) => gsap.fromTo(g, { opacity: .25, scale: .7 }, { opacity: .85, scale: 1.15, duration: 1.6 + i * .3, ease: "sine.inOut", yoyo: true, repeat: -1, delay: i * .8 }));
    // latido "doki doki" ocasional
    gsap.timeline({ repeat: -1, repeatDelay: 5.5, delay: 3 })
      .to(cv, { scale: "+=0.012", duration: .12, ease: "power2.out" }).to(cv, { scale: "-=0.012", duration: .2 })
      .to(cv, { scale: "+=0.009", duration: .12, ease: "power2.out" }).to(cv, { scale: "-=0.009", duration: .3 });
    // polvo de papel
    const dust = $("#dust");
    for (let i = 0; i < 22; i++) {
      const s = document.createElement("i"); s.className = "speck will" + (i % 3 === 0 ? " ink" : ""); dust.appendChild(s);
      gsap.set(s, { x: rand(0, W()), y: rand(0, H()), scale: rand(.3, 1.2), opacity: 0 });
      const go = () => gsap.to(s, { x: `+=${rand(-40, 40)}`, y: `-=${rand(60, 160)}`, duration: rand(5, 9), ease: "sine.inOut", keyframes: { opacity: [0, rand(.3, .8), 0] },
        onComplete() { gsap.set(s, { x: rand(0, W()), y: rand(H() * .3, H()) }); go(); } });
      gsap.delayedCall(rand(0, 5), go);
    }
    // inclinación con el dedo / ratón (los papeles están más cerca: parallax real)
    const rx = gsap.quickTo("#tilt", "rotationX", { duration: .8, ease: "power3.out" }), ry = gsap.quickTo("#tilt", "rotationY", { duration: .8, ease: "power3.out" });
    $("#cover").addEventListener("pointermove", e => { const r = stage.getBoundingClientRect(); ry(((e.clientX - r.left) / r.width - .5) * 8); rx(-((e.clientY - r.top) / r.height - .5) * 6); });
    $("#cover").addEventListener("pointerleave", () => { rx(0); ry(0); });
    addEventListener("deviceorientation", e => { if (e.beta == null || opened) return; ry(gsap.utils.clamp(-6, 6, e.gamma * .25)); rx(gsap.utils.clamp(-5, 5, (e.beta - 50) * -.15)); });
    // globo "toca para abrir"
    if (!REEL) gsap.timeline({ delay: 1.6 }).fromTo("#tap", { scale: 0, rotation: -12 }, { scale: 1, rotation: 0, duration: .6, ease: "back.out(2.2)" })
      .add(() => gsap.to("#tap", { y: -8, duration: .7, yoyo: true, repeat: -1, ease: "sine.inOut" }));
    gsap.fromTo("#wm", { opacity: 0 }, { opacity: 1, duration: 1.2, delay: 1 });

    // tocar → el papel se rasga y sale volando, la mirada se acerca y se abre la invitación

    const open = () => {
      if (opened) return; opened = true;
      if (!REEL) Musica.play();
      try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {}); } catch (e) {}
      const inv = $("#inv"), sc = $("#sc");
      let MX = W() / 2, MY = H() * .3;
      gsap.killTweensOf([".ly.top", ".ly.bot", "#tap"]);
      gsap.set("#mouth", { scaleX: .04, scaleY: .7, opacity: 0 });
      const tl2 = gsap.timeline();
      tl2
        // 1) el papel se abre un poco más… y sale volando
        .to("#tap", { scale: 0, rotation: 15, duration: .3, ease: "back.in(2)" }, 0)
        .to(cv, { x: "+=6", duration: .05, yoyo: true, repeat: 5, ease: "none" }, 0)
        .to(".ly.top", { y: -18, x: -8, rotation: -1.5, duration: .35, ease: "power2.out" }, .05)
        .to(".ly.bot", { y: 18, x: 8, rotation: 1.2, duration: .35, ease: "power2.out" }, .05)
        .to(".glint", { opacity: 1, scale: 1.8, duration: .3 }, .25)
        .to(".ly.top", { yPercent: -95, xPercent: -12, rotation: -10, rotationX: 28, duration: 1, ease: "power3.in" }, .55)
        .to(".ly.bot", { yPercent: 95, xPercent: 10, rotation: 8, rotationX: -24, duration: 1, ease: "power3.in" }, .6)
        .to(cv, { scale: 1.45, duration: 1, ease: "power2.in" }, .55)
        // 2) Yuta "se hace para atrás": la cámara se aleja y aparece de cuerpo completo
        .set("#scene", { visibility: "visible" }, .95)
        .fromTo("#scene", { opacity: 0 }, { opacity: 1, duration: .45 }, .95)
        .fromTo(sc, { scale: 3.6, filter: "blur(7px)" }, { scale: 1, filter: "blur(0px)", duration: 2.5, ease: "power3.inOut" }, .95)
        .set("#cover", { display: "none" }, 1.45)
        // 3) Rika: el ojo brilla, todo tiembla y abre la boca
        .fromTo("#reye", { opacity: 0, scale: .4 }, { opacity: 1, scale: 1.7, duration: .32, yoyo: true, repeat: 1, ease: "power2.out" }, 3.3)
        .to(sc, { x: "+=5", duration: .05, yoyo: true, repeat: 9, ease: "none" }, 3.55)

          const sp = $("#speed2"); sp.style.setProperty("--mx", ((MX + .3 * W()) / (1.6 * W()) * 100) + "%"); sp.style.setProperty("--my", ((MY + .3 * H()) / (1.6 * H()) * 100) + "%"); }, 3.72)
        .fromTo("#speed2", { opacity: 0, scale: 1.35 }, { opacity: .55, scale: 1, duration: .4, ease: "power2.out" }, 3.75)
        .to("#rglow", { opacity: 1, scale: 2.4, duration: .55, ease: "power2.in" }, 4.15)

        .to(sc, { scale: 6.5, duration: 1, ease: "power3.in" }, 4.3)
        .to("#speed2", { opacity: 0, duration: .3 }, 4.75)
        .add(() => {
          gsap.set(inv, { visibility: "visible", zIndex: 7, clipPath: `circle(0px at ${MX}px ${MY}px)` }); inv.setAttribute("aria-hidden", "false"); reveal();
          gsap.to(inv, { clipPath: `circle(${Math.hypot(W(), H())}px at ${MX}px ${MY}px)`, duration: .95, ease: "power2.in",

          gsap.fromTo(inv, { scale: .35, transformOrigin: `${MX}px ${MY}px` }, { scale: 1, duration: 1.2, ease: "power3.out" });
        }, 4.9)

    };

  }

  /* ---------------- invitación: viñetas que "golpean", efectos al tocar, número de página ---------------- */
  function reveal() {
    const root = $("#inv");
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return; io.unobserve(e.target);
      const el = e.target, isSfx = el.classList.contains("sfx");
      gsap.fromTo(el, { opacity: 0, scale: isSfx ? 2.2 : 1.14, y: isSfx ? 0 : 18 }, { opacity: 1, scale: 1, y: 0, duration: isSfx ? .45 : .6, ease: isSfx ? "back.out(3)" : "back.out(1.8)",
        onComplete() { if (!isSfx) gsap.fromTo(el, { x: -3 }, { x: 0, duration: .25, ease: "elastic.out(1,.3)" }); } });
    }), { root, threshold: .18 });
    $$(".rv", root).forEach(el => io.observe(el));
    const fin = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { fin.disconnect(); gsap.fromTo("#hanko", { opacity: 0, scale: 2.6, rotation: 10 }, { opacity: 1, scale: 1, rotation: -8, duration: .5, delay: .6, ease: "power4.in" }); } }), { root, threshold: .4 });
    fin.observe($(".fin"));
    // número de página
    const pages = $$(".page", root);
    const pn = $("#pageNum"); gsap.set([pn, "#musicBtn"], { visibility: "visible" });
    const upd = () => { const y = root.scrollTop + root.clientHeight * .4; let k = 0; pages.forEach((p, i) => { if (p.offsetTop <= y) k = i; }); pn.textContent = `P. ${String(k + 1).padStart(2, "0")}/${String(pages.length).padStart(2, "0")}`; };
    root.addEventListener("scroll", upd, { passive: true }); upd();
    // parallax suave del collage de fondo
    const bgSet = gsap.quickSetter("#bgImg", "y", "px");
    root.addEventListener("scroll", () => { const k = root.scrollTop / Math.max(1, root.scrollHeight - root.clientHeight); bgSet(gsap.utils.interpolate(H() * .04, -H() * .04, k)); }, { passive: true });
    $("#musicBtn").addEventListener("click", e => { e.stopPropagation(); Musica.toggle(); });
    // efectos de sonido visuales al tocar
    const words = ["¡BAM!", "¡ZAS!", "ドン!", "¡POW!", "キラッ", "!!", "ドキッ"];
    root.addEventListener("click", e => {
      if (e.target.closest("a,button,input,textarea,label,form,figure")) return;
      const r = stage.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, fx = $("#fx");
      const b = document.createElement("div"); b.className = "burst"; b.style.left = x + "px"; b.style.top = y + "px";
      let lines = ""; for (let i = 0; i < 14; i++) { const a = i / 14 * Math.PI * 2, r1 = 22, r2 = 44 + (i % 3) * 5; lines += `<line x1="${50 + Math.cos(a) * r1}" y1="${50 + Math.sin(a) * r1}" x2="${50 + Math.cos(a) * r2}" y2="${50 + Math.sin(a) * r2}" stroke="#121212" stroke-width="2.2" stroke-linecap="round"/>`; }
      b.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%">${lines}</svg>`; fx.appendChild(b);
      const w = document.createElement("div"); w.className = "pop"; w.textContent = words[Math.floor(Math.random() * words.length)]; w.style.left = x + "px"; w.style.top = y + "px"; fx.appendChild(w);
      gsap.fromTo(b, { scale: .3, opacity: 1 }, { scale: 1.3, opacity: 0, duration: .5, ease: "power2.out", onComplete: () => b.remove() });
      gsap.fromTo(w, { scale: 0, rotation: rand(-20, 20) }, { scale: 1, duration: .35, ease: "back.out(3)" });
      gsap.to(w, { y: -30, opacity: 0, duration: .5, delay: .45, onComplete: () => w.remove() });
    });
  }
})();
</script>
</body>
</html>
