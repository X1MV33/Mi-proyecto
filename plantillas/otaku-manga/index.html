<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="theme-color" content="#111111">
<title>Invitación Otaku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=block" rel="stylesheet">
<style>
  /* Tomo de manga: papel, tinta negra, tramas de puntos y un rojo de sello (hanko) */
  :root{
    --paper:#F4F1EA; --paper2:#FBFAF6; --ink:#121212; --ink2:#3A3A3A; --red:#D7263D; --gray:#8C8C8C;
    --display:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;
    --sfx:"Bangers","Dela Gothic One",cursive;
    --body:"Zen Kaku Gothic New",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0c0c0c;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;font-family:var(--body);color:var(--ink);-webkit-tap-highlight-color:transparent}
  #stage{position:relative;width:min(100vw,56.25vh);width:min(100vw,56.25dvh);height:100%;overflow:hidden;container-type:size;background:#111;isolation:isolate;
    user-select:none;-webkit-user-select:none}
  img{display:block;-webkit-user-drag:none}
  .will{will-change:transform,opacity}

  /* =================== PORTADA ANIMADA (capas reales de la imagen) =================== */
  #cover{position:absolute;inset:0;z-index:5;background:#e9e9e9;overflow:hidden;cursor:pointer}
  #tilt{position:absolute;inset:0;perspective:160cqw;transform-style:preserve-3d}
  .cv{--cw:max(100cqw,46.16cqh);position:absolute;width:var(--cw);height:calc(var(--cw) * 2.1665);
    left:calc(50% - var(--cw) / 2);top:calc(50% - var(--cw) * 1.0833);transform-style:preserve-3d;transform-origin:50% 47%}
  .ly{position:absolute;inset:0;width:100%;height:100%}
  .ly.top{transform-origin:0% 100%}
  .ly.bot{transform-origin:100% 0%}
  .sweep{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
    background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.75) 50%,transparent 62%) -120% 0/60% 100% no-repeat;
    -webkit-mask:url("portada/franja_ojos.webp") 0 0/100% 100% no-repeat;mask:url("portada/franja_ojos.webp") 0 0/100% 100% no-repeat}
  .glint{position:absolute;width:5%;aspect-ratio:1;margin:-2.5% 0 0 -2.5%;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,255,255,.35) 30%,transparent 65%)}
  .glint.g1{left:72.3%;top:40.2%}
  .glint.g2{left:31.1%;top:52.6%}
  #dust{position:absolute;inset:0;pointer-events:none}
  .speck{position:absolute;width:.9cqw;height:.9cqw;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 1cqw rgba(255,255,255,.6)}
  .speck.ink{background:rgba(20,20,20,.55);box-shadow:none}
  .speed{position:absolute;inset:-20%;pointer-events:none;opacity:0;
    background:repeating-conic-gradient(from 0deg at 50% 47%,transparent 0 2.6deg,rgba(10,10,10,.9) 2.6deg 3.1deg);
    -webkit-mask:radial-gradient(circle at 50% 47%,transparent 18%,#000 55%);mask:radial-gradient(circle at 50% 47%,transparent 18%,#000 55%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.09;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 85% 70% at 50% 47%,transparent 55%,rgba(0,0,0,.42) 100%)}
  .tapb{position:absolute;left:50%;bottom:calc(9cqh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;
    font-family:var(--sfx);font-size:7.6cqw;letter-spacing:.06em;color:var(--ink);background:#fff;border:.7cqw solid var(--ink);
    padding:2cqw 6cqw;border-radius:50%;white-space:nowrap;box-shadow:1.2cqw 1.2cqw 0 var(--ink)}
  .tapb::after{content:"";position:absolute;left:58%;top:100%;border:2.6cqw solid transparent;border-top:3.4cqw solid var(--ink);transform:skewX(-20deg)}
  .tapb::before{content:"";position:absolute;left:calc(58% + .9cqw);top:calc(100% - .9cqw);border:1.8cqw solid transparent;border-top:2.4cqw solid #fff;transform:skewX(-20deg);z-index:1}
  .wm{position:absolute;left:0;right:0;bottom:calc(2.6cqh + env(safe-area-inset-bottom,0px));text-align:center;z-index:3;
    font-size:2.8cqw;letter-spacing:.24em;color:rgba(255,255,255,.85);text-shadow:0 0 1cqw rgba(0,0,0,.6);pointer-events:none}
  /* escena Yuta + Rika (después de tocar) */
  #scene{position:absolute;inset:0;z-index:6;overflow:hidden;visibility:hidden;background:#e6e7ec}
  .sc{--sw:max(100cqw,57.13cqh);position:absolute;width:var(--sw);height:calc(var(--sw) * 1.7504);
    left:calc(50% - var(--sw) / 2);top:calc(50% - var(--sw) * .8752);transform-origin:51.11% 52.98%}
  .sc .base{transform-origin:50% 30%}
  .rika{position:absolute;left:8.547%;top:0;width:85.47%;height:53.71%;transform-origin:50.1% 37.3%}
  .rika img.body{position:absolute;inset:0;width:100%;height:100%}
  .rika.ghost{opacity:0;pointer-events:none}
  .rika .mouth{position:absolute;left:41.5%;top:26.36%;width:17.3%;height:23.82%;transform-origin:50% 8%}
  .smoke{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 70% 50% at 50% 30%,rgba(20,18,30,.0),rgba(20,18,30,.55) 70%)}
  .rika .rglow{position:absolute;left:50.1%;top:37.3%;width:14%;aspect-ratio:1;margin:-7% 0 0 -7%;border-radius:50%;opacity:0;mix-blend-mode:screen;
    background:radial-gradient(circle,#fff 0,rgba(255,170,185,.85) 30%,rgba(200,30,60,.35) 55%,transparent 72%)}
  .rika .reye{position:absolute;left:50.1%;top:21.45%;width:8%;aspect-ratio:1;margin:-4% 0 0 -4%;border-radius:50%;opacity:0;mix-blend-mode:screen;
    background:radial-gradient(circle,rgba(255,235,235,1) 0,rgba(255,40,60,.85) 30%,transparent 70%)}
  .speed2{position:absolute;inset:-30%;pointer-events:none;opacity:0;
    background:repeating-conic-gradient(from 0deg at var(--mx,50%) var(--my,30%),transparent 0 2.4deg,rgba(15,12,20,.85) 2.4deg 2.9deg);
    -webkit-mask:radial-gradient(circle at var(--mx,50%) var(--my,30%),transparent 20%,#000 46%,transparent 70%);mask:radial-gradient(circle at var(--mx,50%) var(--my,30%),transparent 20%,#000 46%,transparent 70%)}
  #flash{position:absolute;inset:0;z-index:20;background:#fff;opacity:0;pointer-events:none}
  #loader{position:absolute;inset:0;z-index:30;background:#111;color:#eee;display:flex;align-items:center;justify-content:center;font-family:var(--sfx);font-size:6cqw;letter-spacing:.1em}
  body.reel .ui{display:none!important}
  body.reel{cursor:none}

  /* =================== INVITACIÓN · experiencia en scroll (rojo, tinta y papel) =================== */
  #inv{position:absolute;inset:0;z-index:4;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;visibility:hidden;background:var(--paper);overscroll-behavior:contain}
  #inv{--red:#D21F2B;--red2:#8F0D17}
  #invContent{position:relative}
  .scn{position:relative}
  .frame{position:sticky;top:0;height:100cqh;overflow:hidden}
  .tex{position:absolute;inset:-10% 0;background-size:100% 100%;will-change:transform}
  .layer{will-change:transform,opacity}
  /* caja de texto blanca (como subtítulo) */
  .cap{position:absolute;left:8cqw;right:8cqw;background:#fff;color:var(--ink);padding:4cqw 4.6cqw;font-size:3.9cqw;line-height:1.5;font-weight:500;
    box-shadow:0 0 0 .5cqw var(--ink)}
  .cap b{font-weight:700}
  .kick{font-family:var(--body);font-weight:700;font-size:2.8cqw;letter-spacing:.34em;text-transform:uppercase}
  .bigt{font-family:var(--display);font-weight:400;line-height:.9;letter-spacing:-.01em}
  /* botón redondo con texto diminuto */
  .dot{position:absolute;width:15cqw;height:15cqw;border-radius:50%;background:#fff;color:var(--ink);border:.5cqw solid var(--ink);
    display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:2.1cqw;letter-spacing:.14em;line-height:1.2;
    text-decoration:none;cursor:pointer;box-shadow:0 0 0 1.4cqw rgba(255,255,255,.25);font-family:var(--body)}
  .dot:active{transform:scale(.92)}
  .dot::after{content:"";position:absolute;inset:-2.6cqw;border-radius:50%;border:.35cqw solid rgba(255,255,255,.8);animation:ring 1.8s ease-out infinite}
  @keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.25);opacity:0}}

  /* 1 · título sobre rojo con vetas de tinta */
  .s-title .tex{inset:-8% 0}
  .s-title .cover{position:absolute;left:14cqw;top:12cqh;width:72cqw;height:50cqh;border:1cqw solid var(--ink);background:#fff;overflow:hidden;box-shadow:2.4cqw 2.4cqw 0 var(--ink)}
  .s-title .cover img{width:100%;height:100%;object-fit:cover;object-position:50% 48%}
  .s-title .name{position:absolute;left:0;right:0;top:63cqh;text-align:center;color:#fff;font-size:22cqw;-webkit-text-stroke:.6cqw var(--ink);paint-order:stroke fill;text-shadow:1.4cqw 1.4cqw 0 var(--ink)}
  .s-title .sub{position:absolute;left:0;right:0;top:79cqh;text-align:center;color:#fff}
  .s-title .sub b{display:inline-block;background:var(--ink);color:#fff;font-family:var(--sfx);font-weight:400;font-size:5.4cqw;letter-spacing:.06em;padding:.6cqw 3cqw;margin-bottom:2cqw;transform:skewX(-8deg)}
  .s-title .sub div{font-size:4cqw;font-weight:700;letter-spacing:.08em;text-shadow:0 .3cqw 0 var(--ink)}
  .s-title .down{position:absolute;left:50%;bottom:calc(5cqh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:#fff;font-size:2.6cqw;letter-spacing:.4em;font-weight:700;text-align:center}
  .s-title .down i{display:block;width:.4cqw;height:6cqh;margin:2cqw auto 0;background:#fff;animation:drip 1.6s ease-in-out infinite;transform-origin:top}
  @keyframes drip{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

  /* 2 · sol rojo con la silueta de Rika */
  .s-sun{background:#fff}
  .s-sun .sun{position:absolute;left:50%;top:44cqh;width:86cqw;height:86cqw;margin:-43cqw 0 0 -43cqw;border-radius:50%;background:var(--red);overflow:hidden;
    box-shadow:0 0 0 2.4cqw #fff,0 0 0 3cqw var(--ink)}
  .s-sun .sil{position:absolute;left:4%;bottom:-10%;width:92%;filter:grayscale(1) contrast(1.9) brightness(1.05);mix-blend-mode:multiply}
  .s-sun .cap{bottom:12cqh}
  .s-sun .frame{background:#fff}
  .s-sun .kick{position:absolute;left:0;right:0;top:9cqh;text-align:center;color:var(--ink)}

  /* 3 · cortina de tinta (transición) */
  .s-ink{height:150cqh}
  .s-ink .frame{background:#fff}
  .s-ink .tex{inset:0}
  .s-ink .tex{transform-origin:top}

  /* 4 · pilares rojos y la mirada */
  .s-eyes .band{position:absolute;left:0;right:0;top:30cqh;height:28cqw;overflow:hidden;border-top:.8cqw solid var(--ink);border-bottom:.8cqw solid var(--ink);background:#111}
  .s-eyes .band img{width:100%;height:100%;object-fit:cover}
  .s-eyes .kick{position:absolute;left:8cqw;top:20cqh;color:#fff}
  .s-eyes .h2{position:absolute;left:8cqw;top:23.5cqh;color:#fff;font-size:8cqw;-webkit-text-stroke:.4cqw var(--ink);paint-order:stroke fill}
  .s-eyes .cards{position:absolute;left:8cqw;right:8cqw;top:calc(30cqh + 34cqw);display:grid;grid-template-columns:1fr 1fr;gap:3cqw}
  .s-eyes .card{background:#fff;border:.6cqw solid var(--ink);padding:3.4cqw 3.6cqw;min-width:0}
  .s-eyes .card.w{grid-column:1/-1;padding-right:22cqw;position:relative}
  .s-eyes .card small{display:block;font-size:2.4cqw;letter-spacing:.3em;font-weight:700;color:var(--red)}
  .s-eyes .card b{display:block;font-family:var(--display);font-weight:400;font-size:9cqw;line-height:1;margin-top:1cqw}
  .s-eyes .card span{display:block;font-size:3.3cqw;line-height:1.4;margin-top:1cqw;color:var(--ink2)}
  .s-eyes .card .dot{right:3.4cqw;top:50%;margin-top:-7.5cqw}

  /* 5 · cuenta regresiva */
  .s-count .tex{opacity:.9}
  .s-count .wrap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#fff}
  .s-count .kick{color:#fff}
  .s-count .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:2cqw;margin:6cqw 6cqw 0}
  .s-count .nums div{background:var(--red);border:.6cqw solid #fff;padding:3cqw 0 2cqw}
  .s-count .nums b{display:block;font-family:var(--sfx);font-weight:400;font-size:13cqw;line-height:1;font-variant-numeric:tabular-nums;text-shadow:.6cqw .6cqw 0 var(--ink)}
  .s-count .nums span{font-size:2.3cqw;letter-spacing:.24em;text-transform:uppercase}
  .s-count .cal{display:flex;gap:3cqw;justify-content:center;margin-top:8cqw}
  .s-count .cal a{font-size:2.6cqw;letter-spacing:.2em;font-weight:700;color:#fff;text-decoration:none;border:.4cqw solid #fff;padding:2.2cqw 3.6cqw;text-transform:uppercase}

  /* 6 · itinerario: episodios que caen uno por uno */
  .s-eps{background:#fff}
  .s-eps .kick{position:absolute;left:8cqw;top:9cqh;color:var(--red)}
  .s-eps .h2{position:absolute;left:8cqw;top:12cqh;font-size:9cqw}
  .s-eps .list{position:absolute;left:8cqw;right:8cqw;top:24cqh;display:flex;flex-direction:column;gap:2.6cqh}
  .s-eps .ep{display:flex;align-items:stretch;border:.6cqw solid var(--ink);background:#fff;box-shadow:1.4cqw 1.4cqw 0 var(--red)}
  .s-eps .ep .t{width:24cqw;flex:none;background:var(--ink);color:#fff;font-family:var(--sfx);font-size:7.4cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:2cqw 0}
  .s-eps .ep .t small{font-family:var(--body);font-size:2.2cqw;letter-spacing:.24em;color:#ff7d86;font-weight:700;margin-bottom:.8cqw}
  .s-eps .ep .w{padding:3.4cqw 4cqw;font-weight:700;font-size:4.6cqw;display:flex;align-items:center}

  /* 7 · código de vestimenta */
  .s-dress .bigo{position:absolute;left:-4cqw;right:-4cqw;top:16cqh;text-align:center;font-size:27cqw;color:transparent;-webkit-text-stroke:.5cqw #fff;white-space:nowrap}
  .s-dress .bigf{position:absolute;left:-4cqw;right:-4cqw;top:34cqh;text-align:center;font-size:27cqw;color:#fff;white-space:nowrap;text-shadow:1.4cqw 1.4cqw 0 var(--ink)}
  .s-dress .kick{position:absolute;left:0;right:0;top:10cqh;text-align:center;color:#fff}
  .s-dress .cap.c1{top:58cqh}
  .s-dress .cap.c2{top:78cqh}

  /* 8 · confirmación: mantén presionado */
  .s-rsvp{background:var(--ink);color:#fff;padding:16cqw 7cqw 18cqw;text-align:center;position:relative;overflow:hidden}
  .s-rsvp .tex{opacity:.18}
  .s-rsvp .kick{color:#ff7d86;position:relative}
  .s-rsvp h2{position:relative;font-family:var(--display);font-weight:400;font-size:12cqw;margin-top:2cqw}
  .s-rsvp .when{position:relative;font-size:3.6cqw;color:#ccc;margin-top:2cqw}
  .hold{position:relative;width:40cqw;height:40cqw;margin:10cqw auto 4cqw;border-radius:50%;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;
    background:conic-gradient(var(--red) calc(var(--p,0) * 1turn),rgba(255,255,255,.18) 0)}
  .hold::before{content:"";position:absolute;inset:2cqw;border-radius:50%;background:#fff}
  .hold span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);font-weight:700;font-size:2.8cqw;letter-spacing:.24em}
  .hold span b{font-family:var(--sfx);font-weight:400;font-size:8cqw;letter-spacing:.04em;color:var(--red)}
  .holdhint{position:relative;font-size:2.8cqw;letter-spacing:.24em;color:#aaa;text-transform:uppercase}
  .rsvp-wrap{position:relative;overflow:hidden;height:0;text-align:left;color:var(--ink)}
  .rsvp{display:flex;flex-direction:column;gap:3.6cqw;background:#fff;border:1cqw solid #fff;padding:7cqw 6cqw;margin-top:8cqw;box-shadow:0 0 0 .6cqw var(--red)}
  .rsvp label.q,.rsvp .q{font-weight:700;font-size:4cqw}
  .rsvp input[type=text],.rsvp textarea{font:inherit;font-size:4.4cqw;border:.6cqw solid var(--ink);padding:2.6cqw 3cqw;width:100%;background:var(--paper2);outline:none;resize:none;border-radius:0}
  .rsvp input:focus,.rsvp textarea:focus{background:#fff;box-shadow:1cqw 1cqw 0 var(--red)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
  .opt{position:relative;cursor:pointer}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt span{display:block;text-align:center;padding:2.6cqw 1cqw;border:.6cqw solid var(--ink);font-family:var(--sfx);font-size:5.2cqw;letter-spacing:.06em;background:#fff;transition:background .2s,color .2s}
  .opt input:checked + span{background:var(--red);color:#fff}
  .opt input:focus-visible + span{outline:.6cqw solid var(--red);outline-offset:.6cqw}
  .stepper{display:flex;align-items:center;justify-content:space-between;border:.6cqw solid var(--ink);padding:1.4cqw 2cqw 1.4cqw 3cqw;font-weight:700;font-size:4.2cqw}
  .stepper div{display:flex;align-items:center;gap:3cqw}
  .stepper button{width:9cqw;height:9cqw;border:.6cqw solid var(--ink);background:#fff;font-family:var(--sfx);font-size:6cqw;cursor:pointer;line-height:1}
  .stepper b{font-family:var(--sfx);font-weight:400;font-size:8cqw;min-width:7cqw;text-align:center;color:var(--red)}
  .wa{display:block;text-align:center;margin-top:2cqw;font-family:var(--sfx);font-size:6.4cqw;letter-spacing:.08em;color:#fff;background:var(--red);
    padding:3cqw;text-decoration:none;border:.7cqw solid var(--ink);box-shadow:1.2cqw 1.2cqw 0 var(--ink)}
  .wa:active{transform:translate(1cqw,1cqw);box-shadow:none}
  .note{font-size:3.6cqw;color:var(--ink2);text-align:center;margin-top:-1cqw}

  /* 9 · fin */
  .s-fin .bigt{position:absolute;left:0;right:0;top:24cqh;text-align:center;color:#fff;font-size:20cqw;-webkit-text-stroke:.5cqw var(--ink);paint-order:stroke fill;text-shadow:1.4cqw 1.4cqw 0 var(--ink)}
  .s-fin .cont{position:absolute;left:10cqw;right:10cqw;top:44cqh;text-align:center;font-family:var(--sfx);font-size:8cqw;letter-spacing:.06em;color:var(--ink);background:#fff;padding:2cqw 3cqw;box-shadow:0 0 0 .5cqw var(--ink),1.4cqw 1.4cqw 0 .5cqw var(--ink)}
  .s-fin .who{position:absolute;left:0;right:0;top:57cqh;text-align:center;font-size:3.6cqw;font-weight:700;letter-spacing:.14em;color:#fff;text-shadow:0 .3cqw 0 var(--ink),0 0 2cqw var(--ink)}
  .hanko{position:absolute;left:50%;top:65cqh;width:26cqw;height:26cqw;margin-left:-13cqw;background:var(--red);border-radius:2cqw;display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:13cqw;color:#fff;transform:rotate(-8deg);box-shadow:inset 0 0 0 1.2cqw var(--red),inset 0 0 0 1.8cqw #fff;opacity:0}
  .s-fin .wm2{position:absolute;left:0;right:0;bottom:calc(4cqh + env(safe-area-inset-bottom,0px));text-align:center;font-size:2.6cqw;letter-spacing:.24em;color:#fff;text-shadow:0 0 1.5cqw var(--ink)}

  /* interfaz flotante */

<script>

  /* ---------------- invitación (render desde CONFIG) ---------------- */
  /* ---------------- texturas de tinta dibujadas en vivo (canvas) ---------------- */
  const TX = {};
  function mkCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; }
  function texGrain(w, h) {           // rojo con vetas negras irregulares (tinta sobre madera)
    const [c, g] = mkCanvas(w, h); g.fillStyle = "#D21F2B"; g.fillRect(0, 0, w, h);
    g.globalAlpha = .18; for (let i = 0; i < 40; i++) { g.fillStyle = i % 2 ? "#F0525C" : "#9E1019"; g.fillRect(rand(0, w), 0, rand(2, 14), h); }
    g.globalAlpha = 1; g.strokeStyle = "#140B0C"; g.lineCap = "round";
    for (let i = 0; i < 46; i++) {
      let x = rand(-20, w + 20), y = rand(-h * .2, h * .3); const len = rand(h * .5, h * 1.2), lw = rand(1, w * .012);
      g.lineWidth = lw; g.beginPath(); g.moveTo(x, y);
      for (let s = 0; s < len; s += 18) { x += rand(-3.5, 3.5) + Math.sin(s * .01 + i) * 1.6; y += 18; g.lineTo(x, y); }
      g.stroke();
      if (i % 4 === 0) { g.lineWidth = lw * 2.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(-6, 6), y + rand(20, 60)); g.stroke(); }
    }
    return c.toDataURL("image/jpeg", .86);
  }
  function texHatch(w, h, inv) {      // trazos verticales de tinta (bosque / lluvia de tinta)
    const [c, g] = mkCanvas(w, h); g.fillStyle = inv ? "#0E0E0E" : "#FFFFFF"; g.fillRect(0, 0, w, h); g.strokeStyle = inv ? "#F2F2F2" : "#111"; g.lineCap = "round";
    for (let i = 0; i < w * 1.6; i++) {
      const x = rand(0, w), clump = .5 + .5 * Math.sin(x * .021) * Math.sin(x * .0067 + 1.3), len = h * (.15 + clump * .85) * rand(.4, 1);

      let xx = x; g.moveTo(xx, 0); for (let y = 0; y < len; y += 24) { xx += rand(-1.2, 1.2); g.lineTo(xx, y); } g.stroke();
      if (i % 3 === 0) { const l2 = h * rand(.05, .25) * (1 - clump); g.beginPath(); g.moveTo(x, h); g.lineTo(x + rand(-2, 2), h - l2); g.stroke(); }
    }
    return c.toDataURL("image/jpeg", .86);
  }
  function texPillars(w, h) {         // salón de pilares rojos con sombreado de tinta
    const [c, g] = mkCanvas(w, h); g.fillStyle = "#B5141F"; g.fillRect(0, 0, w, h);
    const n = 5, pw = w / n;
    for (let k = 0; k < n; k++) {

    for (let i = 0; i < 16; i++) { const x = rand(0, w), cw = rand(10, 50); g.fillRect(x, 0, cw, h * rand(.4, 1.05)); }

    root.addEventListener("click", e => {
      if (e.target.closest("a,button,input,textarea,label,form,figure,#hold")) return;
      const r = stage.getBoundingClientRect(); popAt(e.clientX - r.left, e.clientY - r.top, words[Math.floor(Math.random() * words.length)]);
    });
  }
})();
