<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>XV de Valentina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Pinyon+Script&display=block" rel="stylesheet">
<style>
  :root{
    --olive-cream:#E6E8CF;
    --serif:#8A5A5E;
    --name:#9E3460;
    --gold:#C9A15A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;
       font-family:"Cormorant Garamond",Georgia,serif;
       -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}

  /* Stage 9:16 — en móvil llena la pantalla; en pantallas anchas se encaja 9:16.
     Todo se mide en cqw/cqh (unidades del stage). */
  #stage{position:relative;
    width:min(100vw,56.25vh);width:min(100vw,56.25dvh);
    height:100%;
    overflow:hidden;container-type:size;background:#000;isolation:isolate;
    user-select:none;-webkit-user-select:none}
  .layer{position:absolute;inset:0;pointer-events:none}
  img{display:block;-webkit-user-drag:none}
  .will{will-change:transform,opacity}

  /* ---------- ESCENA 1 · fondo (detrás de la ventana) ---------- */
  #s1{z-index:1;background:#3A4428}
  #s1Zoom,#s1Breath{position:absolute;inset:0;transform-origin:50% 50%}
  #s1 .bg{position:absolute;inset:-3%}
  #s1 .bg img{width:100%;height:100%;object-fit:cover}

  /* ---------- ESCENA 1 · frente (marcos, cenefa, estrellas, monograma) ----------
     Va POR ENCIMA de la ventana: las flores tapan el borde del arco (profundidad). */
  #s1Front{z-index:3}
  #s1FrontBreath{position:absolute;inset:0;transform-origin:50% 50%}
  .cenefa{position:absolute;top:-2%;height:104%;width:9cqw;object-fit:cover;object-position:top;opacity:.9}
  .cenefa.l{left:0}
  .cenefa.r{right:0;transform:scaleX(-1)}
  .marco1{position:absolute;top:-2%;height:104%;width:36cqw}
  .marco1 img{width:100%;height:100%;object-fit:cover}
  .marco1.l{left:-3cqw}
  .marco1.l img{object-position:left center}
  .marco1.r{right:-3cqw}
  .marco1.r img{object-position:right center}
  #stars{position:absolute;inset:0}
  .star{position:absolute;width:6.4cqw;height:6.4cqw;margin:-3.2cqw 0 0 -3.2cqw}
  .star img{width:100%;height:100%}

  /* Monograma serif alto contraste (estilo didone) + tiara */
  #monogram{position:absolute;z-index:4;left:50%;top:46%;
    width:72cqw;height:72cqw;margin:-36cqw 0 0 -36cqw;opacity:0}
  #monogram svg{width:100%;height:100%;overflow:visible}
  #monogram .glyph{font-family:"Bodoni Moda","Playfair Display",serif;font-weight:400;
    fill:var(--olive-cream);fill-opacity:0;stroke:var(--olive-cream);stroke-width:.6;
    stroke-linejoin:round;filter:drop-shadow(0 0 1.6px rgba(28,34,18,.55)) drop-shadow(0 .6px 1px rgba(28,34,18,.35))}
  #monogram .glyph.under{fill:none;stroke:#3A4428;stroke-width:2.2;stroke-opacity:0;filter:none}
  #monogram .tiara{fill:none;stroke:var(--olive-cream);stroke-width:.9;stroke-linejoin:round;stroke-linecap:round}

  /* ---------- VENTANA EN ARCO (contiene ESCENA 2) ---------- */
  #win{position:absolute;z-index:2;left:50%;top:50%;
    width:62cqw;height:86.8cqw;                /* proporción 100 x 140 */
    margin:-43.4cqw 0 0 -31cqw;
    transform-origin:50% 50%;
    -webkit-mask:var(--arch) center/100% 100% no-repeat;mask:var(--arch) center/100% 100% no-repeat;
    visibility:hidden}
  #win.open{-webkit-mask:none;mask:none}
  #s2{position:absolute;width:100cqw;height:100cqh;left:50%;top:50%;
    margin:-50cqh 0 0 -50cqw;transform-origin:50% 50%;overflow:hidden;background:#EEF0EA}
  #s2 .pl{position:absolute;inset:-4% -6%}
  #s2 .pl img{width:100%;height:100%;object-fit:cover}
  #s2 .pl.cielo{inset:-2% -3%}
  /* bruma blanca: al abrir la ventana la escena 2 se ve "lavada" y luego aclara */
  #haze{position:absolute;inset:0;
    background:
      radial-gradient(ellipse 80% 42% at 50% 30%, rgba(255,255,255,.95), rgba(255,255,255,.55) 55%, rgba(255,255,255,0) 100%),
      linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 60%)}
  /* borde sombreado del arco (como corte en papel) */
  #archRim{position:absolute;z-index:2;left:50%;top:50%;
    width:62cqw;height:86.8cqw;margin:-43.4cqw 0 0 -31cqw;transform-origin:50% 50%;
    visibility:hidden;opacity:0}
  #archRim svg{width:100%;height:100%;overflow:visible}

  #particles{position:absolute;inset:0}
  .p{position:absolute;width:1.5cqw;height:1.5cqw;border-radius:50%;
     background:radial-gradient(circle, rgba(255,248,230,.95) 0%, rgba(240,210,170,.45) 40%, rgba(240,210,170,0) 70%)}

  /* marco floral escena 2 */
  .frame2{position:absolute}
  .frame2 img{width:100%;height:auto}
  .frame2.sup{top:0;left:-2%;width:104%}
  .frame2.inf{bottom:0;left:-2%;width:104%}
  .frame2.lat{top:0;height:100%;width:22cqw}
  .frame2.lat img{height:100%;width:100%;object-fit:cover;object-position:left}
  .frame2.lat.l{left:-3cqw}
  .frame2.lat.r{right:-3cqw}
  .frame2.lat.r img{transform:scaleX(-1)}

  /* textos */
  #texts{position:absolute;left:0;right:0;top:29%;display:flex;flex-direction:column;align-items:center;text-align:center}
  #kicker{font-family:"Cormorant Garamond",serif;font-weight:400;color:var(--serif);
    font-size:5.6cqw;letter-spacing:.16em;padding-left:.16em;white-space:nowrap}
  #kicker .ch{display:inline-block;opacity:0}
  .name{font-family:"Pinyon Script","Great Vibes",cursive;color:var(--name);
    font-size:21cqw;line-height:1.25;white-space:nowrap;margin-top:1cqw;
    text-shadow:0 .2cqw 1.4cqw rgba(255,250,245,.7)}
  .reveal{display:inline-block;overflow:hidden;padding:0 14cqw 0 3cqw;margin:0 -14cqw 0 -3cqw;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14cqw),transparent);
            mask-image:linear-gradient(90deg,#000 calc(100% - 14cqw),transparent)}
  .reveal > span{display:inline-block}
  .frase{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:400;color:var(--serif);
    font-size:5.6cqw;line-height:1.3;opacity:0;white-space:nowrap;text-shadow:0 0 1.2cqw rgba(255,252,248,.9)}
  .fecha{font-family:"Cormorant Garamond",serif;font-weight:400;color:var(--serif);
    font-size:3.6cqw;letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;
    margin-top:2.4cqw;opacity:0;white-space:nowrap}
  .fecha:empty{display:none}
  #sparkles{position:absolute;inset:0}
  .spk{position:absolute;width:4cqw;height:4cqw;margin:-2cqw 0 0 -2cqw;opacity:0}
  .spk svg{width:100%;height:100%;overflow:visible}

  #butterflies{position:absolute;inset:0;z-index:6}
  .bfly{position:absolute;left:0;top:0;width:9cqw;height:7.2cqw;margin:-3.6cqw 0 0 -4.5cqw;opacity:0}
  .bfly img{width:100%;height:100%}

  /* ---------- ACABADOS ---------- */
  #paper{z-index:20;opacity:.08;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 1.2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size:240px 240px}
  #vignette{z-index:21;background:radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0,0,0,0) 58%, rgba(0,0,0,.36) 100%)}
  #black{z-index:30;background:#000}
  #watermark{position:absolute;z-index:25;left:0;right:0;
    bottom:calc(2.6cqh + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;
    font-family:"Cormorant Garamond",serif;font-size:2.6cqw;letter-spacing:.24em;
    color:rgba(255,255,255,.66);text-shadow:0 0 .8cqw rgba(0,0,0,.4);opacity:0}

  .ui{position:absolute;z-index:26}
  #hint{left:50%;bottom:calc(6.4cqh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    font-size:3.4cqw;letter-spacing:.18em;color:#fff;padding:1.4cqw 3.6cqw;border-radius:999px;
    background:rgba(0,0,0,.18);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.35);opacity:0;pointer-events:none;white-space:nowrap}
  #loader{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    color:rgba(230,232,207,.75);font-size:3.4cqw;letter-spacing:.3em}
  body.reel .ui{display:none!important}
  body.reel{cursor:none}

  /* Siguiente sección (contenedor preparado) */
  #invitacion{position:absolute;inset:0;z-index:50;background:#FBF5EE;overflow-y:auto;
    -webkit-overflow-scrolling:touch;visibility:hidden;opacity:0}
  #invitacion .seccion{min-height:100%;padding:12cqw 8cqw;color:var(--serif)}

  /* =================== INVITACIÓN (secciones tras tocar la portada) =================== */
  #invitacion{background:#F6F0E6;color:var(--serif);scroll-behavior:smooth}
  #invitacion::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 1.2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .inv{position:relative;text-align:center;font-family:"Cormorant Garamond",serif}
  .inv-hero{position:relative;height:100cqh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#EEF1EC 0%,#F6F0E6 60%)}
  .inv-hero .top{position:absolute;top:0;left:-2%;width:104%}
  .inv-hero .bot{position:absolute;bottom:0;left:-2%;width:104%}
  .inv-hero .lat{position:absolute;top:0;height:100%;width:18cqw;object-fit:cover;object-position:left}
  .inv-hero .lat.l{left:-3cqw}.inv-hero .lat.r{right:-3cqw;transform:scaleX(-1)}
  .inv-hero .tiara{width:22cqw;height:auto;margin-bottom:2cqw}
  .kick{font-size:5.2cqw;letter-spacing:.18em;padding-left:.18em}
  .script{font-family:"Pinyon Script",cursive;color:var(--name);font-weight:400;line-height:1.15}
  .inv-hero .script{font-size:21cqw;margin:1cqw 0}
  .inv-hero .date{font-size:3.5cqw;letter-spacing:.2em;padding-left:.2em;text-transform:uppercase;white-space:nowrap}
  .scrollcue{position:absolute;bottom:14cqh;left:50%;transform:translateX(-50%);font-size:3cqw;letter-spacing:.3em;
    display:flex;flex-direction:column;align-items:center;gap:1.5cqw;opacity:.8}
  .scrollcue i{display:block;width:1px;height:7cqw;background:linear-gradient(var(--serif),transparent)}
  .sec{padding:13cqw 9cqw;position:relative}
  .sec.tint{background:rgba(214,222,200,.28)}
  .sec h2{font-family:"Pinyon Script",cursive;font-weight:400;color:var(--name);font-size:12.5cqw;line-height:1.1}
  .sec .cap{font-size:3.3cqw;letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;margin-top:1.5cqw}
  .sec p{font-size:5cqw;line-height:1.5}
  .sec p.lead{font-style:italic;font-size:5.4cqw}
  .orn{display:flex;align-items:center;justify-content:center;gap:3cqw;margin:6cqw auto}
  .orn::before,.orn::after{content:"";height:1px;width:22cqw;background:linear-gradient(90deg,transparent,#A3A582)}
  .orn::after{transform:scaleX(-1)}
  .orn img{width:6cqw;height:6cqw;filter:sepia(.4) saturate(.8) brightness(.72)}
  .names2{display:grid;grid-template-columns:1fr 1fr;gap:4cqw;margin:5cqw -3cqw 0}
  .names2 h3{font-size:3.3cqw;letter-spacing:.3em;text-transform:uppercase;font-weight:400;margin-bottom:2cqw}
  .names2 div{font-size:5cqw;line-height:1.35}
  .count{display:grid;grid-template-columns:repeat(4,1fr);gap:2.6cqw;margin-top:6cqw}
  .count div{border:1px solid #B9B596;border-radius:12cqw 12cqw 1.5cqw 1.5cqw;padding:5cqw 0 3cqw;background:rgba(255,255,255,.55)}
  .count b{display:block;font-family:"Bodoni Moda",serif;font-weight:400;font-size:8.4cqw;color:#5E6B45;line-height:1}
  .count span{font-size:2.8cqw;letter-spacing:.2em;text-transform:uppercase}
  .card{position:relative;margin:7cqw auto 0;max-width:80cqw;padding:15cqw 7cqw 8cqw;background:rgba(255,255,255,.62);
    border:1px solid #B9B596;border-radius:40cqw 40cqw 2cqw 2cqw}
  .card::before{content:"";position:absolute;inset:1.6cqw;border:1px solid rgba(185,181,150,.55);border-radius:38cqw 38cqw 1.4cqw 1.4cqw;pointer-events:none}
  .card .ico{width:10cqw;height:10cqw;margin:0 auto 3cqw;color:#7B8A5C}
  .card h3{font-family:"Pinyon Script",cursive;font-weight:400;color:var(--name);font-size:9.6cqw;line-height:1.1}
  .card .place{font-size:5.4cqw;font-weight:400;margin-top:2cqw;color:#5C4A48}
  .card .addr{font-size:4.2cqw;font-style:italic;margin-top:1cqw}
  .card .time{font-family:"Bodoni Moda",serif;font-size:6cqw;color:#5E6B45;margin-top:3cqw}
  .btn{display:inline-block;margin-top:5cqw;padding:2.6cqw 7cqw;border-radius:999px;font-family:"Cormorant Garamond",serif;
    font-size:3.8cqw;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;color:#fff;background:#6E7B52;
    box-shadow:0 1cqw 3cqw rgba(80,90,60,.25)}
  .btn.wine{background:var(--name);box-shadow:0 1cqw 3cqw rgba(158,52,96,.28)}
  .timeline{position:relative;margin:7cqw auto 0;max-width:74cqw;text-align:left}
  .timeline::before{content:"";position:absolute;left:21cqw;top:1cqw;bottom:1cqw;width:1px;background:#B9B596}
  .timeline .it{display:grid;grid-template-columns:18cqw 1fr;gap:8cqw;align-items:center;padding:2.6cqw 0;position:relative}
  .timeline .it::after{content:"";position:absolute;left:calc(21cqw - 1.2cqw);top:50%;width:2.4cqw;height:2.4cqw;margin-top:-1.2cqw;
    border-radius:50%;background:#F6F0E6;border:1px solid var(--name)}
  .timeline .h{font-family:"Bodoni Moda",serif;font-size:4.6cqw;color:#5E6B45;text-align:right}
  .timeline .w{font-size:5.4cqw}
  .dress{display:flex;justify-content:center;gap:10cqw;margin-top:6cqw}
  .dress svg{width:14cqw;height:24cqw;color:#6E7B52}
  .closing{padding:14cqw 9cqw 62cqw;position:relative;overflow:hidden}
  .closing .bot{position:absolute;bottom:0;left:-2%;width:104%}
  .closing .tiara{width:22cqw;height:auto;margin-top:4cqw}
  .closing .script{font-size:17cqw}
  .inv-wm{position:absolute;bottom:3cqw;left:0;right:0;font-size:2.6cqw;letter-spacing:.24em;color:rgba(255,255,255,.85);text-shadow:0 0 1cqw rgba(0,0,0,.35)}
  .rv{opacity:0;transform:translateY(5cqw)}

  /* =================== EXTRAS INTERACTIVOS / 3D =================== */
  /* Puertas de palacio 3D (transición portada → invitación) */
  #doors{position:absolute;inset:0;z-index:58;perspective:150cqw;visibility:hidden;pointer-events:none}
  .door{position:absolute;top:0;width:50.2%;height:100%;transform-style:preserve-3d;backface-visibility:hidden;
    background:
      radial-gradient(ellipse 120% 60% at 50% 45%, rgba(255,255,255,.08), rgba(0,0,0,.25)),
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 .4cqw, rgba(255,255,255,.03) .4cqw 1.1cqw),
      #4C5A36;box-shadow:inset 0 0 6cqw rgba(0,0,0,.35)}
  .door.l{left:0;transform-origin:0 50%}
  .door.r{right:0;transform-origin:100% 50%}
  .door .dp{position:absolute;inset:9cqh 6cqw 7cqh;border:1px solid rgba(230,232,207,.6);border-radius:22cqw 22cqw 1cqw 1cqw}
  .door .dp::before{content:"";position:absolute;inset:1.6cqw;border:1px solid rgba(201,161,90,.55);border-radius:20cqw 20cqw .6cqw .6cqw}
  .door .dp::after{content:"";position:absolute;left:50%;top:38%;width:9cqw;height:9cqw;margin-left:-4.5cqw;opacity:.7;
    background:url("../../assets/estrella.svg") center/contain no-repeat}
  .door .knob{position:absolute;top:52%;width:3.4cqw;height:3.4cqw;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#F6E3A8,#C9A15A 55%,#7E6230);box-shadow:0 .4cqw .8cqw rgba(0,0,0,.4)}
  .door.l .knob{right:3cqw}.door.r .knob{left:3cqw}
  .door .shade{position:absolute;inset:0;background:#000;opacity:0}
  .seal{position:absolute;left:50%;top:50%;width:34cqw;height:34cqw;margin:-17cqw 0 0 -17cqw;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#FBF6EA,#EDE4CF);box-shadow:0 1.5cqw 5cqw rgba(0,0,0,.45),inset 0 0 0 1.2cqw #F6EEDC,inset 0 0 0 1.5cqw #C9A15A;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--name)}
  .seal svg{width:15cqw;height:auto}
  .seal b{font-family:"Bodoni Moda",serif;font-weight:400;font-size:10cqw;line-height:1;letter-spacing:.04em}
  .seal span{font-size:2.6cqw;letter-spacing:.3em;margin-top:1cqw;color:var(--serif)}

  /* Pétalos 3D y destellos al tocar */
  #petals,#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #petals{z-index:52;visibility:hidden;perspective:80cqw}
  #fx{z-index:53}
  .petal{position:absolute;left:0;top:0;width:4.2cqw;height:5.4cqw}
  .petal svg{width:100%;height:100%;display:block}
  .burst{position:absolute;width:3.4cqw;height:3.4cqw;margin:-1.7cqw 0 0 -1.7cqw}

  /* Música */
  #musicBtn{position:absolute;z-index:55;top:calc(3cqw + env(safe-area-inset-top,0px));right:3.5cqw;
    width:12cqw;height:12cqw;border-radius:50%;border:1px solid rgba(158,52,96,.35);cursor:pointer;
    background:rgba(255,252,246,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 1cqw 3cqw rgba(60,40,40,.18);display:flex;align-items:center;justify-content:center;
    visibility:hidden;opacity:0;padding:0}
  #musicBtn svg{width:7.4cqw;height:7.4cqw}
  #musicBtn .slash{opacity:0;transition:opacity .3s}
  #musicBtn.off .slash{opacity:1}
  #musicBtn .bars rect{transform-box:fill-box;transform-origin:50% 100%}
  #musicTip{position:absolute;z-index:55;top:calc(5.6cqw + env(safe-area-inset-top,0px));right:17.5cqw;
    font-size:3cqw;letter-spacing:.12em;color:var(--serif);background:rgba(255,252,246,.85);padding:1cqw 2.4cqw;border-radius:99px;
    opacity:0;visibility:hidden;white-space:nowrap}

  /* Foto de portada interna en arco con marco dorado (inclinación 3D) */
  .inv-hero > :not(img):not(.scrollcue){position:relative;z-index:2}
  .inv-hero .scrollcue{z-index:2}
  .hero-photo{width:46cqw;height:58cqw;border-radius:23cqw 23cqw 1.6cqw 1.6cqw;overflow:hidden;margin-bottom:4cqw;
    border:1.1cqw solid #FFFDF8;box-shadow:0 0 0 .5cqw #C9A15A,0 3cqw 7cqw rgba(70,50,40,.3)}
  .hero-photo img{width:100%;height:100%;object-fit:cover;transform:scale(1.08)}
  .tilt{transform-style:preserve-3d;will-change:transform}

  /* Galería 3D (carrusel en anillo) */
  .g3d{position:relative;height:96cqw;margin:4cqw -9cqw 0;perspective:170cqw;touch-action:pan-y;cursor:grab;user-select:none}
  .g3d:active{cursor:grabbing}
  .ring{position:absolute;left:50%;top:46%;width:46cqw;height:62cqw;margin:-31cqw 0 0 -23cqw;transform-style:preserve-3d}
  .gitem{position:absolute;inset:0;margin:0;border-radius:23cqw 23cqw 1.6cqw 1.6cqw;overflow:hidden;
    border:1cqw solid #FFFDF8;box-shadow:0 0 0 .4cqw #C9A15A,0 3cqw 6cqw rgba(60,45,35,.28);background:#ddd;
    -webkit-box-reflect:below 2cqw linear-gradient(transparent 72%, rgba(255,255,255,.28))}
  .gitem img{width:100%;height:100%;object-fit:cover;pointer-events:none}
  .ghint{font-size:3.3cqw;letter-spacing:.18em;opacity:.75;margin-top:1cqw}
  .gdots{display:flex;justify-content:center;gap:2.4cqw;margin-top:1cqw}
  .gdots i{width:2cqw;height:2cqw;border-radius:50%;border:1px solid var(--name);transition:background .3s}
  .gdots i.on{background:var(--name)}

  /* Visor de fotos */
  #lightbox{position:absolute;inset:0;z-index:60;background:rgba(24,20,16,.94);visibility:hidden;opacity:0;
    display:flex;align-items:center;justify-content:center;touch-action:none}
  #lightbox img{max-width:90cqw;max-height:78cqh;border-radius:1.6cqw;box-shadow:0 3cqw 8cqw rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none}
  #lightbox button{position:absolute;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;
    width:11cqw;height:11cqw;border-radius:50%;font-size:5.5cqw;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #lbClose{top:calc(4cqw + env(safe-area-inset-top,0px));right:4cqw}
  #lbPrev{left:3cqw;top:50%;margin-top:-5.5cqw}#lbNext{right:3cqw;top:50%;margin-top:-5.5cqw}
  #lbCount{position:absolute;bottom:calc(5cqw + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.8);
    font-size:3.4cqw;letter-spacing:.3em}

  /* Calendario, formulario RSVP */
  .cal{display:flex;flex-wrap:wrap;justify-content:center;gap:2.4cqw;margin-top:5cqw}
  .btn.small{margin-top:0;padding:2.2cqw 4.6cqw;font-size:3.1cqw}
  .btn.ghost{background:transparent;color:#5E6B45;border:1px solid #6E7B52;box-shadow:none}
  button.btn{border:0;cursor:pointer}
  .rsvp{display:flex;flex-direction:column;gap:3cqw;margin:6cqw auto 0;max-width:78cqw;text-align:left}
  .rsvp input,.rsvp textarea{font:inherit;font-size:4.6cqw;color:#5C4A48;background:rgba(255,255,255,.75);
    border:1px solid #C9C3A4;border-radius:2cqw;padding:3cqw 3.6cqw;outline:none;width:100%;resize:none}
  .rsvp input:focus,.rsvp textarea:focus{border-color:var(--name);box-shadow:0 0 0 .6cqw rgba(158,52,96,.12)}
  .stepper{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.75);
    border:1px solid #C9C3A4;border-radius:2cqw;padding:1.6cqw 2cqw 1.6cqw 3.6cqw;font-size:4.6cqw}
  .stepper div{display:flex;align-items:center;gap:3cqw}
  .stepper button{width:9cqw;height:9cqw;border-radius:50%;border:1px solid var(--name);background:#fff;color:var(--name);font-size:5cqw;cursor:pointer;line-height:1}
  .stepper b{font-family:"Bodoni Moda",serif;font-weight:400;font-size:6cqw;min-width:6cqw;text-align:center;color:var(--name)}
  .rsvp .btn{align-self:center}

  /* Cierre con foto */
  .closing{background:
    linear-gradient(180deg,#F6F0E6 0%,rgba(246,240,230,.82) 26%,rgba(246,240,230,.15) 52%,rgba(246,240,230,0) 70%),
    var(--closing-photo) center 30%/cover no-repeat}
  .count b{display:block;transform-style:preserve-3d}
</style>
</head>
<body>
<div id="stage" aria-label="Portada animada de invitación de XV años">

  <!-- ESCENA 1 · fondo -->
  <section id="s1" class="layer will">
    <div id="s1Zoom" class="will"><div id="s1Breath" class="will">
      <div class="bg will"><img data-src="e1_fondo.png" alt=""></div>
    </div></div>
  </section>

  <!-- VENTANA EN ARCO → ESCENA 2 -->
  <div id="win">
    <section id="s2" class="will">
      <div class="pl cielo will"    data-par="0.12"><img data-src="e2_cielo.png" alt=""></div>
      <div class="pl montanas will" data-par="0.35"><img data-src="e2_montanas.png" alt=""></div>
      <div class="pl cascadas will" data-par="0.55"><img data-src="e2_cascadas.png" alt=""></div>
      <div class="pl hacienda will" data-par="1"><img data-src="e2_hacienda.png" alt=""></div>
      <div id="haze" class="will"></div>
      <div id="particles"></div>
      <div class="frame2 lat l will"><img data-src="e2_marco_lat.png" alt=""></div>
      <div class="frame2 lat r will"><img data-src="e2_marco_lat.png" alt=""></div>
      <div class="frame2 inf will"><img data-src="e2_marco_inf.png" alt=""></div>
      <div class="frame2 sup will"><img data-src="e2_marco_sup.png" alt=""></div>

        <div class="fecha" id="fecha"></div>

    </section>
  </div>
  <div id="archRim" aria-hidden="true">
    <svg viewBox="0 0 100 140" preserveAspectRatio="none">
      <defs><filter id="rimBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
      <path id="rimPath" fill="none" stroke="rgba(28,34,18,.55)" stroke-width="2.4" filter="url(#rimBlur)"/>

  <!-- ESCENA 1 · frente -->
  <section id="s1Front" class="layer will">
    <div id="s1FrontBreath" class="will">
      <div id="stars"></div>
      <img class="cenefa l will" data-src="e1_cenefa.png" alt="">
      <img class="cenefa r will" data-src="e1_cenefa.png" alt="">
      <div class="marco1 l will"><img data-src="e1_marco_izq.png" alt=""></div>
      <div class="marco1 r will"><img data-src="e1_marco_der.png" alt=""></div>
    </div>
    <div id="monogram" class="will">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <!-- tiara -->
        <path class="tiara" d="M66 58 C 73 55, 78 48, 80 38 C 84 46, 87 50, 91 48 C 93 40, 97 32, 100 24 C 103 32, 107 40, 109 48 C 113 50, 116 46, 120 38 C 122 48, 127 55, 134 58 C 122 55, 111 54, 100 54 C 89 54, 78 55, 66 58 Z"/>
        <path class="tiara" d="M100 31 C 97 35, 97 39, 100 42 C 103 39, 103 35, 100 31 M70 61 C 86 57.5, 114 57.5, 130 61"/>
        <circle class="tiara" cx="80" cy="44" r="2"/>
        <circle class="tiara" cx="120" cy="44" r="2"/>
        <!-- letras entrelazadas: 1ª arriba-izquierda, 2ª abajo-derecha -->
        <text class="glyph g1" x="78" y="138" text-anchor="middle" font-size="112"></text>
        <text class="glyph under g2u" x="122" y="170" text-anchor="middle" font-size="112"></text>
        <text class="glyph g2" x="122" y="170" text-anchor="middle" font-size="112"></text>

    </div>
  </section>

  <div id="butterflies"></div>
  <div id="paper" class="layer"></div>
  <div id="vignette" class="layer"></div>
  <div id="watermark"></div>
  <div id="hint" class="ui">Toca para abrir</div>
  <div id="loader" class="ui">CARGANDO</div>
  <div id="black" class="layer"></div>

  <!-- SIGUIENTE SECCIÓN DE LA INVITACIÓN (vacía, lista para llenarse) -->
  <main id="invitacion" aria-hidden="true"><div class="inv" id="invContent"></div></main>

  <!-- Capas interactivas -->
  <div id="petals" aria-hidden="true"></div>
  <div id="fx" aria-hidden="true"></div>
  <button id="musicBtn" aria-label="Activar o pausar la música">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <g class="bars" fill="#9E3460"><rect x="9" y="12" width="3.2" height="16" rx="1.6"/><rect x="15.4" y="8" width="3.2" height="20" rx="1.6"/><rect x="21.8" y="14" width="3.2" height="14" rx="1.6"/><rect x="28.2" y="10" width="3.2" height="18" rx="1.6"/></g>
      <path d="M8 31h24" stroke="#C9A15A" stroke-width="1.4" stroke-linecap="round"/>
      <path class="slash" d="M7 7 L33 33" stroke="#8A5A5E" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  </button>
  <div id="musicTip">Toca para música ♪</div>
  <div id="lightbox" role="dialog" aria-label="Visor de fotos">
    <img id="lbImg" alt="">
    <button id="lbPrev" aria-label="Anterior">‹</button><button id="lbNext" aria-label="Siguiente">›</button>
    <button id="lbClose" aria-label="Cerrar">×</button>
    <div id="lbCount"></div>
  </div>
  <div id="doors" aria-hidden="true">
    <div class="door l"><div class="dp"></div><div class="knob"></div><div class="shade"></div></div>
    <div class="door r"><div class="dp"></div><div class="knob"></div><div class="shade"></div></div>
    <div class="seal">
      <svg viewBox="60 20 80 46"><g fill="none" stroke="#9E3460" stroke-width="1.2" stroke-linejoin="round"><path d="M66 58 C 73 55, 78 48, 80 38 C 84 46, 87 50, 91 48 C 93 40, 97 32, 100 24 C 103 32, 107 40, 109 48 C 113 50, 116 46, 120 38 C 122 48, 127 55, 134 58 C 122 55, 111 54, 100 54 C 89 54, 78 55, 66 58 Z"/><circle cx="80" cy="44" r="2"/><circle cx="120" cy="44" r="2"/></g></svg>
      <b id="sealText">XV</b><span id="sealName"></span>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>
<script>
const CONFIG = window.CONFIG;   // los datos viven en config.js

(() => {
  "use strict";
  const REEL = new URLSearchParams(location.search).get("reel") === "1";
  if (REEL) document.body.classList.add("reel");
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const stage = $("#stage");
  const rand = gsap.utils.random;
  gsap.registerPlugin(MotionPathPlugin);

  /* ---------- Arco de palacio: cúpula + cuello cóncavo + hombros redondeados (viewBox 100x140) ---------- */
  const ARCH = "M0 140 L0 47 C0 39 4 34 11 33 L19 33 C23 33 25 31 25 27 C25 11 36 0 50 0 C64 0 75 11 75 27 C75 31 77 33 81 33 L89 33 C96 34 100 39 100 47 L100 140 Z";
  const archSVG = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 140' preserveAspectRatio='none'><path d='${ARCH}' fill='black'/></svg>`;
  $("#win").style.setProperty("--arch", `url("data:image/svg+xml;utf8,${encodeURIComponent(archSVG)}")`);
  $("#rimPath").setAttribute("d", ARCH);

  /* ---------- Textos ---------- */
  const kicker = $("#kicker");
  kicker.setAttribute("aria-label", CONFIG.textoSuperior);
  kicker.innerHTML = [...CONFIG.textoSuperior].map(c =>
    `<span class="ch" aria-hidden="true">${c === " " ? "&nbsp;" : c}</span>`).join("");
  $("#name1").textContent = CONFIG.quinceanera;
  $("#frase").textContent = CONFIG.frase;
  $("#fecha").textContent = CONFIG.fecha;
  $(".g1").textContent = CONFIG.iniciales[0];
  $(".g2").textContent = CONFIG.iniciales[1];
  $(".g2u").textContent = CONFIG.iniciales[1];
  $("#watermark").textContent = CONFIG.marcaDeAgua;
  $("#sealName").textContent = CONFIG.quinceanera.toUpperCase();
  $("#sealText").textContent = CONFIG.iniciales.join("");
  document.title = `${CONFIG.textoSuperior} · ${CONFIG.quinceanera}`;


  /* ---------- Invitación: render desde CONFIG ---------- */
  function renderInvitacion() {
    const E = CONFIG.evento, A = CONFIG.assetsPath, esc = x => String(x).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const orn = `<div class="orn rv"><img src="${A}estrella.svg" alt=""></div>`;
    const tiara = `<svg class="tiara" viewBox="60 20 80 46" aria-hidden="true"><g fill="none" stroke="#9E3460" stroke-width="1" stroke-linejoin="round"><path d="M66 58 C 73 55, 78 48, 80 38 C 84 46, 87 50, 91 48 C 93 40, 97 32, 100 24 C 103 32, 107 40, 109 48 C 113 50, 116 46, 120 38 C 122 48, 127 55, 134 58 C 122 55, 111 54, 100 54 C 89 54, 78 55, 66 58 Z"/><path d="M100 31 C 97 35, 97 39, 100 42 C 103 39, 103 35, 100 31 M70 61 C 86 57.5, 114 57.5, 130 61"/><circle cx="80" cy="44" r="2"/><circle cx="120" cy="44" r="2"/></g></svg>`;
    const ico = {
      church: `<svg class="ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M24 4v8M20 8h8M14 44V22l10-8 10 8v22M6 44V30l8-5M42 44V30l-8-5M4 44h40"/><path d="M20 44v-8a4 4 0 0 1 8 0v8"/></svg>`,
      glass: `<svg class="ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 6h10l-1 12a4 4 0 0 1-8 0zM26 6h10l-1 12a4 4 0 0 1-8 0zM17 22v16M31 22v16M12 40h10M26 40h10M20 4l4-2 4 2"/></svg>`
    };
    const card = (c, icon) => `<div class="card rv tilt">${ico[icon]}<h3>${esc(c.titulo)}</h3>
        <div class="place">${esc(c.lugar)}</div><div class="addr">${esc(c.direccion)}</div>
        <div class="time">${esc(c.hora)}</div>
        <a class="btn" href="${esc(c.mapa)}" target="_blank" rel="noopener">Cómo llegar</a></div>`;
    const wa = `https://wa.me/${E.rsvpWhatsapp}?text=${encodeURIComponent(`Hola, confirmo mi asistencia a los XV años de ${CONFIG.quinceanera}.`)}`;
    $("#invContent").innerHTML = `
      <section class="inv-hero">
        <img class="lat l" src="${A}e2_marco_lat.png" alt=""><img class="lat r" src="${A}e2_marco_lat.png" alt="">
        <img class="top" src="${A}e2_marco_sup.png" alt=""><img class="bot" src="${A}e2_marco_inf.png" alt="">
        <div class="hero-photo tilt rv"><img src="${esc(CONFIG.fotos[CONFIG.fotoPortada] || "")}" alt="${esc(CONFIG.quinceanera)}"></div>
        <div class="kick rv">${esc(CONFIG.textoSuperior)}</div>
        <div class="script rv">${esc(CONFIG.quinceanera)}</div>
        <div class="date rv">${esc(E.fechaTexto)}</div>
        <div class="scrollcue">DESLIZA<i></i></div>
      </section>
      <section class="sec">
        <p class="lead rv">${esc(E.mensaje)}</p>
        ${orn}
        <div class="names2">
          <div class="rv"><h3>Mis padres</h3>${E.padres.map(esc).join("<br>")}</div>
          <div class="rv"><h3>Mis padrinos</h3>${E.padrinos.map(esc).join("<br>")}</div>
        </div>
      </section>
      <section class="sec tint" id="galeria">
        <h2 class="rv">Mis recuerdos</h2>
        <div class="ghint rv">DESLIZA PARA GIRAR · TOCA PARA VER</div>
        <div class="g3d rv" id="g3d"><div class="ring" id="ring">
          ${CONFIG.fotos.map((f, i) => `<figure class="gitem" data-i="${i}"><img src="${esc(f)}" alt="Foto ${i + 1}" loading="lazy" decoding="async"></figure>`).join("")}
        </div></div>
        <div class="gdots" id="gdots">${CONFIG.fotos.map(() => "<i></i>").join("")}</div>
      </section>
      <section class="sec tint">
        <h2 class="rv">Faltan</h2><div class="cap rv">${esc(E.fechaTexto)}</div>
        <div class="count rv tilt" id="count"><div><b>0</b><span>días</span></div><div><b>0</b><span>horas</span></div><div><b>0</b><span>min</span></div><div><b>0</b><span>seg</span></div></div>
        <div class="cal rv"><a class="btn small" id="gcal" target="_blank" rel="noopener">Google Calendar</a><a class="btn small ghost" id="ocal" target="_blank" rel="noopener">Outlook</a></div>
      </section>
      <section class="sec">
        <h2 class="rv">¿Dónde?</h2><div class="cap rv">Ceremonia y recepción</div>
        ${card(E.ceremonia, "church")}
        ${card(E.recepcion, "glass")}
      </section>
      <section class="sec tint">
        <h2 class="rv">Itinerario</h2>
        <div class="timeline">${E.itinerario.map(([h, w]) => `<div class="it rv"><div class="h">${esc(h)}</div><div class="w">${esc(w)}</div></div>`).join("")}</div>
      </section>
      <section class="sec">
        <h2 class="rv">Vestimenta</h2><div class="cap rv">${esc(E.vestimenta)}</div>
        <div class="dress rv">
          <svg viewBox="0 0 40 70" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M14 4h12l-2 8 6 6-4 20 8 30H6l8-30-4-20 6-6z"/></svg>
          <svg viewBox="0 0 40 70" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 4h16l6 10-4 4v48H10V18l-4-4zM20 4v20M17 8l3 4 3-4"/></svg>
        </div>
        <p class="rv" style="margin-top:4cqw;font-style:italic">${esc(E.vestimentaNota)}</p>
        ${orn}
        <h2 class="rv">Regalos</h2>
        <p class="rv" style="margin-top:3cqw">${esc(E.regalos)}</p>
      </section>
      <section class="sec tint">
        <h2 class="rv">Confirma</h2>
        <p class="rv" style="margin-top:3cqw">Por favor confirma tu asistencia antes del <b style="font-weight:500">${esc(E.rsvpFecha)}</b>.</p>
        <form class="rsvp rv" id="rsvp" autocomplete="on">
          <input name="nombre" placeholder="Tu nombre completo" required maxlength="80">
          <div class="stepper"><span>Personas</span><div><button type="button" data-d="-1" aria-label="Menos">−</button><b id="pax">1</b><button type="button" data-d="1" aria-label="Más">+</button></div></div>
          <textarea name="msg" rows="2" maxlength="300" placeholder="Un mensaje para ${esc(CONFIG.quinceanera)} (opcional)"></textarea>
          <a class="btn wine" id="rsvpLink" target="_blank" rel="noopener">Confirmar por WhatsApp</a>
        </form>
      </section>
      <section class="closing">
        <div class="kick rv">${esc(E.cierre)}</div>
        <div class="script rv">${esc(CONFIG.quinceanera)}</div>
        <img class="bot" src="${A}e2_marco_inf.png" alt="">
        <div class="inv-wm">${esc(CONFIG.marcaDeAgua)}</div>
      </section>`;

    // cuenta regresiva
    const target = new Date(E.fechaISO).getTime(), cells = $$("#count b");
    const tick = () => {
      let d = Math.max(0, target - Date.now()) / 1000;
      const v = [Math.floor(d / 86400), Math.floor(d % 86400 / 3600), Math.floor(d % 3600 / 60), Math.floor(d % 60)];
      cells.forEach((c, i) => {
        const txt = i ? String(v[i]).padStart(2, "0") : String(v[i]);
        if (c.textContent === txt) return;
        c.textContent = txt;
        if (c._ready) gsap.fromTo(c, { rotationX: -90, opacity: .2 }, { rotationX: 0, opacity: 1, duration: .55, ease: "back.out(1.6)", transformPerspective: 260 });
        c._ready = true;
      });
    };
    tick(); (function loop() { gsap.delayedCall(1, () => { tick(); loop(); }); })();   // reloj de GSAP (se puede grabar cuadro a cuadro)

    // foto del cierre
    $(".closing").style.setProperty("--closing-photo", `url("${CONFIG.fotos[CONFIG.fotoCierre] || ""}")`);

    // calendario
    const start = new Date(E.fechaISO), end = new Date(start.getTime() + 7 * 3600e3);
    const f = d => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}T${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}00`;
    const titulo = `XV años de ${CONFIG.quinceanera}`, lugar = `${E.recepcion.lugar}, ${E.recepcion.direccion}`;
    $("#gcal").href = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(titulo)}&dates=${f(start)}/${f(end)}&location=${encodeURIComponent(lugar)}&details=${encodeURIComponent(`${E.ceremonia.titulo}: ${E.ceremonia.lugar} · ${E.ceremonia.hora}`)}`;
    const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}T${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}:00`;
    $("#ocal").href = `https://outlook.live.com/calendar/0/deeplink/compose?path=/calendar/action/compose&rru=addevent&subject=${encodeURIComponent(titulo)}&startdt=${iso(start)}&enddt=${iso(end)}&location=${encodeURIComponent(lugar)}`;

    // formulario RSVP → WhatsApp
    let pax = 1;
    $$(".stepper button").forEach(b => b.addEventListener("click", () => {
      pax = Math.min(10, Math.max(1, pax + +b.dataset.d));
      $("#pax").textContent = pax;
      gsap.fromTo("#pax", { scale: 1.5 }, { scale: 1, duration: .4, ease: "back.out(2)" });
    }));
    const form = $("#rsvp"), link = $("#rsvpLink");
    const updateLink = () => {
      const fd = new FormData(form), nombre = String(fd.get("nombre") || "").trim(), msg = String(fd.get("msg") || "").trim();
      const texto = `Hola${nombre ? `, soy ${nombre}` : ""}. Confirmo mi asistencia a los XV años de ${CONFIG.quinceanera} (${pax} ${pax === 1 ? "persona" : "personas"}).${msg ? `\n\nMensaje: ${msg}` : ""}`;
      link.href = `https://wa.me/${E.rsvpWhatsapp}?text=${encodeURIComponent(texto)}`;

  /* ---------- Galería 3D en anillo ---------- */
  function initGallery() {
    const g = $("#g3d"), ring = $("#ring"), items = $$(".gitem", ring), dots = $$("#gdots i");
    const N = items.length, step = 360 / N, st = { a: 0 };
    let R = 0, auto, dragging = false, moved = 0, lastX = 0, vel = 0;
    const layout = () => {
      R = (ring.offsetWidth / 2) / Math.tan(Math.PI / N) * 1.35;
      items.forEach((it, i) => { it.style.transform = `rotateY(${i * step}deg) translateZ(${R}px)`; });   // orden: girar y luego alejar
      render();
    };
    const front = () => ((Math.round(-st.a / step) % N) + N) % N;
    function render() {
      gsap.set(ring, { z: -R, rotationY: st.a });
      items.forEach((it, i) => {
        const ang = ((i * step + st.a) % 360 + 540) % 360 - 180;          // -180..180, 0 = al frente
        const k = Math.cos(ang * Math.PI / 180);
        it.style.opacity = (.35 + .65 * Math.max(0, (k + 1) / 2)).toFixed(3);
        it.style.filter = `brightness(${(.55 + .45 * Math.max(0, k)).toFixed(3)})`;
      });
      const fi = front(); dots.forEach((d, i) => d.classList.toggle("on", i === fi));
    }
    const goTo = (a, d = 1) => gsap.to(st, { a, duration: d, ease: "power3.out", onUpdate: render, overwrite: true });
    const snap = a => Math.round(a / step) * step;
    const startAuto = () => {
      if (auto) auto.kill();
      auto = gsap.delayedCall(3.6, () => { if (!dragging && !$("#lightbox").classList.contains("on")) goTo(snap(st.a) - step, 1.3); startAuto(); });
    };
    g.addEventListener("pointerdown", e => { dragging = true; moved = 0; lastX = e.clientX; vel = 0; gsap.killTweensOf(st); g.setPointerCapture(e.pointerId); });
    g.addEventListener("pointermove", e => {
      if (!dragging) return;
      const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
      vel = dx; st.a += dx * .32; render();
    });
    const end = e => {
      if (!dragging) return; dragging = false;
      if (moved < 6) {                                   // toque → abrir foto
        const el = document.elementFromPoint(e.clientX, e.clientY)?.closest(".gitem");
        const i = el ? +el.dataset.i : front();
        if (i === front()) openLightbox(i); else goTo(snap(-i * step + Math.round((st.a + i * step) / 360) * 360));
      } else goTo(snap(st.a + vel * 4), 1.1);
      startAuto();
    };
    g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
    dots.forEach((d, i) => d.addEventListener("click", () => goTo(snap(-i * step))));
    addEventListener("resize", layout);
    layout(); startAuto();
    gsap.to(ring, { y: "-=8", duration: 3, yoyo: true, repeat: -1, ease: "sine.inOut" });
  }

  /* ---------- Inclinación 3D (dedo/ratón y giroscopio) ---------- */
  function initTilt() {
    const els = $$(".tilt");
    const qs = els.map(el => ({ el, rx: gsap.quickTo(el, "rotationX", { duration: .6, ease: "power3.out" }), ry: gsap.quickTo(el, "rotationY", { duration: .6, ease: "power3.out" }) }));
    els.forEach(el => gsap.set(el, { transformPerspective: 700 }));
    qs.forEach(({ el, rx, ry }) => {
      el.addEventListener("pointermove", e => {
        const r = el.getBoundingClientRect();
        ry(((e.clientX - r.left) / r.width - .5) * 16); rx(-((e.clientY - r.top) / r.height - .5) * 12);
      });
      el.addEventListener("pointerleave", () => { rx(0); ry(0); });

    addEventListener("deviceorientation", e => {
      if (e.beta == null) return;
      const ry = gsap.utils.clamp(-12, 12, e.gamma * .5), rx = gsap.utils.clamp(-10, 10, (e.beta - 45) * -.3);
      qs.forEach(q => { q.rx(rx); q.ry(ry); });
    });
  }

  /* ---------- Música: canción propia o vals de caja musical generado (composición original) ---------- */
  const Musica = (() => {
    let ctx, master, timer, audio, on = false, nextT = 0, beat = 0;
    const BPM = 88, SPB = 60 / BPM;
    const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
    // Re mayor, 3/4 — progresión de 8 compases y melodía original
    const chords = [[50, 62, 66, 69], [47, 62, 66, 71], [43, 62, 67, 71], [45, 61, 64, 69], [50, 62, 66, 69], [42, 61, 66, 69], [43, 62, 67, 71], [45, 61, 64, 67]];
    const melody = [[78, 76, 74], [74, 78, 83], [81, 79, 78], [76, 0, 73], [78, 81, 86], [85, 81, 78], [79, 78, 76], [76, 73, 69]];
    function reverb() {
      const len = ctx.sampleRate * 2.6, buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
      const cv = ctx.createConvolver(); cv.buffer = buf; return cv;
    }
    function bell(note, t, vel, dur = 1.8) {
      const g = ctx.createGain(); g.connect(master);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      [[1, 1], [2, .28], [3.01, .08]].forEach(([m, a]) => {
        const o = ctx.createOscillator(), og = ctx.createGain();
        o.type = "sine"; o.frequency.value = mtof(note) * m; og.gain.value = a;
        o.connect(og).connect(g); o.start(t); o.stop(t + dur + .05);
      });
    }
    function schedule() {
      while (nextT < ctx.currentTime + .25) {
        const bar = Math.floor(beat / 3) % 8, b = beat % 3, pass = Math.floor(beat / 24);
        const ch = chords[bar];
        if (b === 0) bell(ch[0], nextT, .22, 2.4); else bell(ch[b], nextT, .07, 1.2), bell(ch[b + 1] || ch[1], nextT + .01, .05, 1.2);
        const m = melody[bar][b];
        if (m) bell(m + (pass % 2 ? 12 : 0), nextT, pass % 2 ? .1 : .14, 2);
        if (pass % 2 && b === 2 && m) bell(m + 7, nextT + SPB / 2, .06, 1.2);   // adorno en la segunda vuelta
        nextT += SPB; beat++;
      }
    }
    function startSynth() {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (!master) {
        master = ctx.createGain(); master.gain.value = 0;
        const dry = ctx.createGain(), wet = ctx.createGain(), rv = reverb();
        dry.gain.value = .8; wet.gain.value = .45;
        master.connect(dry).connect(ctx.destination); master.connect(rv).connect(wet).connect(ctx.destination);
      }
      ctx.resume();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(.55, ctx.currentTime, .6);
      nextT = ctx.currentTime + .1; clearInterval(timer); timer = setInterval(schedule, 60);
    }
    function stopSynth() {
      if (!ctx) return;
      master.gain.setTargetAtTime(0, ctx.currentTime, .25);
      setTimeout(() => clearInterval(timer), 900);
    }
    function play() {
      on = true;
      if (CONFIG.musica) {
        audio = audio || Object.assign(new Audio(CONFIG.musica), { loop: true, volume: 0 });
        audio.play().then(() => gsap.to(audio, { volume: .8, duration: 2 })).catch(() => { CONFIG.musica = ""; startSynth(); });
      } else startSynth();
      ui();
    }
    function pause() {
      on = false;
      if (audio && CONFIG.musica) gsap.to(audio, { volume: 0, duration: .6, onComplete: () => audio.pause() }); else stopSynth();
      ui();
    }
    let barsTl;
    function ui() {
      const btn = $("#musicBtn"); btn.classList.toggle("off", !on);
      if (!barsTl) barsTl = gsap.timeline({ repeat: -1 }).to("#musicBtn .bars rect", { scaleY: .35, duration: .35, stagger: { each: .12, yoyo: true, repeat: 1 }, ease: "sine.inOut" });
      on ? barsTl.play() : (barsTl.pause(), gsap.to("#musicBtn .bars rect", { scaleY: .5, duration: .3 }));
    }
    document.addEventListener("visibilitychange", () => {
      if (!ctx && !audio) return;
      if (document.hidden) { if (audio) audio.pause(); if (ctx) ctx.suspend(); }
      else if (on) { if (audio && CONFIG.musica) audio.play(); if (ctx) ctx.resume(); }
    });
    return { play, pause, toggle: () => (on ? pause() : play()), get on() { return on; } };
  })();

  const BLANK = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

  /* =====================================================================
     ANIMACIÓN — línea de tiempo base de 20 s
     0.0–2.4  monograma se dibuja y rellena sobre la escena 1
     2.4–3.4  respiración / estrellas
     3.4–7.4  la ventana en arco abre desde el centro y crece; el monograma sigue encima
              y se disuelve con blur; las flores de la escena 1 se abren hacia los lados
     7.4–9.4  escena 2 completa: bruma blanca que aclara + ligero zoom out
     9.4–11   marco floral entra (arriba baja, abajo sube, laterales)
     10.4–13.6 "Mis XV Años" letra a letra → nombre a mano → frase
     13.6–17.6 hold con mariposas y destellos
     17.6–20  textos se van; la escena 1 sube como cortina y reinicia el loop
     ===================================================================== */
  function start() {
    $("#loader").remove();
    const W = () => stage.clientWidth, H = () => stage.clientHeight;
    const SC = CONFIG.duracion / 20, t = s => s * SC;

    const glyphs = $$("#monogram .glyph:not(.under)");
    const tiara = $$("#monogram .tiara");
    const GLEN = 700;
    tiara.forEach(p => { p._len = p.getTotalLength ? p.getTotalLength() : 300; });

    /* ---- Ambientes (independientes del loop) ---- */
    gsap.fromTo("#s1Breath", { scale: 1 }, { scale: 1.03, duration: 4.5, ease: "sine.inOut", yoyo: true, repeat: -1 });
    gsap.fromTo("#s1FrontBreath", { scale: 1.005 }, { scale: 1.035, duration: 5.2, ease: "sine.inOut", yoyo: true, repeat: -1 });
    gsap.to("#s1 .bg", { xPercent: -1.2, yPercent: -.8, duration: 7, ease: "sine.inOut", yoyo: true, repeat: -1 });
    gsap.to(".marco1.l", { x: () => W() * .012, y: () => -H() * .006, duration: 5.5, ease: "sine.inOut", yoyo: true, repeat: -1 });
    gsap.to(".marco1.r", { x: () => -W() * .012, y: () => H() * .006, duration: 6.2, ease: "sine.inOut", yoyo: true, repeat: -1 });
    $$(".star").forEach((s, i) => {
      gsap.set(s, { scale: rand(.55, 1.05), rotation: rand(0, 45), opacity: rand(.45, .95) });
      gsap.to(s, { y: () => rand(-1, 1) * H() * .014, x: () => rand(-1, 1) * W() * .012,
        duration: rand(4, 7), ease: "sine.inOut", yoyo: true, repeat: -1, delay: -rand(0, 6) });
      gsap.to(s, { rotation: `+=${rand(25, 50) * (i % 2 ? 1 : -1)}`, duration: rand(10, 16), ease: "none", repeat: -1 });
      gsap.to(s, { opacity: rand(.25, .5), duration: rand(1.8, 3.2), ease: "sine.inOut", yoyo: true, repeat: -1, delay: -rand(0, 3) });
    });
    $$("#s2 .pl").forEach(pl => {
      const k = +pl.dataset.par;
      gsap.to(pl, { x: () => -W() * .03 * k, y: () => -H() * .008 * k, duration: 9, ease: "sine.inOut", yoyo: true, repeat: -1 });
    });
    $$(".p").forEach(p => {
      gsap.set(p, { scale: rand(.4, 1.3), opacity: 0 });
      const loop = () => gsap.fromTo(p, { y: 0, x: 0, opacity: 0 },
        { y: () => -H() * rand(.05, .14), x: () => W() * rand(-.03, .03), duration: rand(5, 9), ease: "sine.inOut",
          keyframes: { opacity: [0, rand(.45, .9), 0] }, onComplete: loop });
      gsap.delayedCall(rand(0, 6), loop);
    });
    $$(".spk").forEach(s => {
      gsap.timeline({ repeat: -1, delay: rand(0, 2.5), repeatDelay: rand(.4, 1.6) })
        .fromTo(s, { opacity: 0, scale: .2, rotation: 0 }, { opacity: 1, scale: rand(.6, 1.1), rotation: 45, duration: .7, ease: "sine.out" })
        .to(s, { opacity: 0, scale: .2, rotation: 90, duration: .8, ease: "sine.in" });
    });
    gsap.to("#texts", { y: () => -H() * .006, duration: 3.2, ease: "sine.inOut", yoyo: true, repeat: -1 });

    /* ---- Ventana: escala + contraescala (sólo transform) ---- */
    const winSet = s => {
      gsap.set("#win", { scale: s }); gsap.set("#s2", { scale: 1 / s }); gsap.set("#archRim", { scale: s });
    };
    const syncWin = () => winSet(gsap.getProperty("#win", "scale"));
    const COVER = () => {
      const w = $("#win").offsetWidth, h = $("#win").offsetHeight;
      // el rectángulo bajo los hombros empieza al 23.6% de la altura de la ventana
      return Math.max(W() / w, H() / (h * (1 - .236 * 2))) * 1.12;
    };

    function resetLoop() {
      gsap.set(["#s1", "#s1Front"], { yPercent: 0 });
      gsap.set("#s1", { zIndex: 1 }); gsap.set("#s1Front", { zIndex: 3 });
      gsap.set("#s1Zoom", { scale: 1 });
      gsap.set(".marco1.l, .cenefa.l", { xPercent: 0, opacity: 1 });
      gsap.set(".marco1.r", { xPercent: 0, opacity: 1 });
      gsap.set(".cenefa.r", { xPercent: 0, opacity: .9, scaleX: -1 });
      gsap.set("#stars", { opacity: 1 });
      gsap.set("#monogram", { opacity: 0, y: 0, scale: 1, filter: "blur(0px)" });
      glyphs.forEach(g => gsap.set(g, { strokeDasharray: GLEN, strokeDashoffset: GLEN, fillOpacity: 0 }));
      gsap.set(".glyph.under", { strokeOpacity: 0 });
      tiara.forEach(p => gsap.set(p, { strokeDasharray: p._len, strokeDashoffset: p._len }));
      $("#win").classList.remove("open");
      gsap.set("#win", { visibility: "hidden" });
      gsap.set("#archRim", { visibility: "hidden", opacity: 0 });
      winSet(.05);
      gsap.set("#s2 .pl", { scale: 1.12 });
      gsap.set("#haze", { opacity: 1 });
      gsap.set(".frame2.sup", { yPercent: -105 });
      gsap.set(".frame2.inf", { yPercent: 105 });
      gsap.set(".frame2.lat.l", { xPercent: -110 });
      gsap.set(".frame2.lat.r", { xPercent: 110 });
      gsap.set("#kicker .ch", { opacity: 0, y: 8 });
      gsap.set(".reveal", { xPercent: -100 });
      gsap.set(".reveal > span", { x: (i, el) => el.parentNode.offsetWidth });
      gsap.set([".frase", ".fecha"], { opacity: 0, y: 10 });
      gsap.set(["#texts", "#sparkles"], { opacity: 1 });
      gsap.set("#sparkles", { opacity: 0 });
      gsap.set(".bfly", { opacity: 0 });
      gsap.set("#s2", { opacity: 1 });
    }
    resetLoop();

    function butterflyTween(el, i) {
      const img = el.querySelector("img"), w = W(), h = H();
      const paths = [
        [{ x: -.12, y: .78 }, { x: .25, y: .55 }, { x: .55, y: .66 }, { x: .82, y: .40 }, { x: 1.14, y: .30 }],
        [{ x: 1.12, y: .62 }, { x: .78, y: .74 }, { x: .5, y: .6 }, { x: .2, y: .7 }, { x: -.14, y: .52 }],
        [{ x: .2, y: 1.08 }, { x: .32, y: .82 }, { x: .12, y: .64 }, { x: .4, y: .5 }, { x: .7, y: .3 }, { x: 1.15, y: .2 }]
      ];
      const path = paths[i % 3].map(p => ({ x: p.x * w, y: p.y * h }));
      const dur = [3.8, 3.4, 3.2][i % 3] * SC;
      return gsap.timeline()
        .set(el, { opacity: 1, scale: [1, .8, .65][i % 3] })
        .to(el, { duration: dur, ease: "sine.inOut", motionPath: { path, curviness: 1.4, autoRotate: 90 } }, 0)
        .fromTo(img, { scaleX: 1 }, { scaleX: .18, duration: .13, ease: "sine.inOut", yoyo: true, repeat: Math.round(dur / .13) | 1 }, 0)
        .to(el, { opacity: 0, duration: .3 }, dur - .3);
    }

    const tl = gsap.timeline({ repeat: -1, paused: true, onRepeat: resetLoop });

    // 0–2.4: monograma (tiara + letras) se traza y se rellena
    tl.set("#monogram", { opacity: 1 }, 0)
      .fromTo("#monogram", { scale: .97 }, { scale: 1, duration: t(3.4), ease: "sine.out" }, 0);
    tiara.forEach((p, i) => tl.to(p, { strokeDashoffset: 0, duration: t(1.1), ease: "power2.inOut" }, t(.15 + i * .08)));
    tl.to(glyphs[0], { strokeDashoffset: 0, duration: t(1.3), ease: "power1.inOut" }, t(.3))
      .to(".glyph.under", { strokeOpacity: 1, duration: t(.4) }, t(.9))
      .to(glyphs[1], { strokeDashoffset: 0, duration: t(1.3), ease: "power1.inOut" }, t(.75))
      .to(glyphs, { fillOpacity: 1, duration: t(.8), ease: "sine.inOut", stagger: t(.15) }, t(1.6));

    // 3.4–7.4: ventana en arco
    tl.set(["#win", "#archRim"], { visibility: "visible" }, t(3.4))
      .fromTo("#win", { scale: .05 }, { scale: 1, duration: t(1.6), ease: "power2.out", onUpdate: syncWin }, t(3.4))
      .to("#archRim", { opacity: 1, duration: t(.5) }, t(3.4))
      .to(".glyph.under", { strokeOpacity: 0, duration: t(.6) }, t(3.4))
      .to("#win", { scale: () => COVER(), duration: t(2.4), ease: "power2.inOut", onUpdate: syncWin }, t(5))
      .to("#archRim", { opacity: 0, duration: t(1), ease: "power1.in" }, t(6.2))
      .to("#s1Zoom", { scale: 1.1, duration: t(4), ease: "power1.inOut" }, t(3.4))
      // monograma encima de la ventana, luego se disuelve
      .to("#monogram", { y: () => -H() * .05, opacity: 0, filter: "blur(10px)", scale: 1.04, duration: t(1.4), ease: "power2.in" }, t(5.3))
      // flores / cenefa / estrellas de la escena 1 se abren hacia fuera (profundidad)
      .to(".marco1.l, .cenefa.l", { xPercent: -120, duration: t(2), ease: "power2.in" }, t(5.6))
      .to(".marco1.r", { xPercent: 120, duration: t(2), ease: "power2.in" }, t(5.6))
      .to(".cenefa.r", { xPercent: 120, duration: t(2), ease: "power2.in" }, t(5.6))
      .to("#stars", { opacity: 0, duration: t(1.2) }, t(5.8))
      .add(() => { if (!tl.reversed()) { $("#win").classList.add("open"); winSet(1); } }, t(7.45))
      // escena 2: ligero zoom out + la bruma aclara
      .to("#s2 .pl", { scale: 1, duration: t(5), ease: "power2.out" }, t(4.6))
      .to("#haze", { opacity: .45, duration: t(3), ease: "sine.inOut" }, t(6.6));

    // 9.4–11: marco floral
    tl.to(".frame2.sup", { yPercent: 0, duration: t(1.6), ease: "power3.out" }, t(9.4))
      .to(".frame2.inf", { yPercent: 0, duration: t(1.6), ease: "power3.out" }, t(9.5))
      .to(".frame2.lat.l", { xPercent: 0, duration: t(1.5), ease: "power3.out" }, t(9.6))
      .to(".frame2.lat.r", { xPercent: 0, duration: t(1.5), ease: "power3.out" }, t(9.6))
      .to("#haze", { opacity: .7, duration: t(1.4), ease: "sine.inOut" }, t(9.8));

    // 10.4–13.6: textos
    tl.to("#kicker .ch", { opacity: 1, y: 0, duration: t(.5), ease: "power2.out", stagger: t(.06) }, t(10.4))
      .to(".r1", { xPercent: 0, duration: t(1.8), ease: "power1.inOut" }, t(11.1))
      .to(".r1 > span", { x: 0, duration: t(1.8), ease: "power1.inOut" }, t(11.1))
      .to("#sparkles", { opacity: 1, duration: t(.8) }, t(12.2))
      .to(".frase", { opacity: 1, y: 0, duration: t(.8), ease: "power2.out" }, t(12.7))
      .to(".fecha", { opacity: 1, y: 0, duration: t(.8), ease: "power2.out" }, t(13.0));

    // 13.6–17.6: hold con mariposas
    $$(".bfly").forEach((b, i) => tl.add(() => butterflyTween(b, i), t([13.7, 14.3, 14.6][i % 3])));

    // 17.6–20: salida y cortina de la escena 1
    tl.to(["#texts", "#sparkles"], { opacity: 0, duration: t(1), ease: "power1.in" }, t(17.6))
      .to("#s2", { opacity: .6, duration: t(2.2), ease: "power1.in" }, t(17.7))
      .add(() => { // prepara la escena 1 en su estado inicial, fuera de cuadro abajo
        gsap.set("#s1Zoom", { scale: 1 });
        gsap.set(".marco1.l, .cenefa.l, .marco1.r, .cenefa.r", { xPercent: 0 });
        gsap.set("#stars", { opacity: 1 });
      }, t(17.6))
      .set(["#s1", "#s1Front"], { yPercent: 100 }, t(17.6))
      .set("#s1", { zIndex: 4 }, t(17.6)).set("#s1Front", { zIndex: 5 }, t(17.6))
      .to(["#s1", "#s1Front"], { yPercent: 0, duration: t(2.2), ease: "power3.inOut" }, t(17.8))
      .set({}, {}, t(20));

    /* ---- Intro desde negro (sólo la primera vez) ---- */
    gsap.timeline()
      .to("#black", { opacity: 0, duration: 1.6, ease: "power1.inOut" }, 0)
      .to("#watermark", { opacity: 1, duration: 1.5 }, .8)
      .add(() => tl.play(0), 0)
      .set("#black", { display: "none" });
    if (!REEL) {
      gsap.to("#hint", { opacity: .9, duration: 1, delay: 3 });
      gsap.to("#hint", { opacity: .45, duration: 1.6, delay: 4, yoyo: true, repeat: -1, ease: "sine.inOut" });
    }

    /* ---- Tocar = siguiente sección ---- */
    let opened = false;
    const openInv = () => {
      if (opened) return;
      opened = true;
      const inv = $("#invitacion");
      inv.setAttribute("aria-hidden", "false");
      // gesto del usuario: arranca la música y pide permiso de giroscopio (iOS)
      if (!REEL) Musica.play();
      try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {}); } catch (e) {}
      gsap.timeline()
        .to("#hint", { opacity: 0, duration: .3 }, 0)
        .set("#doors", { visibility: "visible" }, 0)
        .fromTo(".door", { opacity: 0 }, { opacity: 1, duration: .5, ease: "power1.out" }, 0)
        .fromTo(".seal", { scale: .4, opacity: 0, rotationY: -90, transformPerspective: 600 }, { scale: 1, opacity: 1, rotationY: 0, duration: .9, ease: "back.out(1.5)" }, .25)
        .set(inv, { visibility: "visible", opacity: 1 }, .8)
        .add(() => tl.pause(), .8)
        .to(".seal", { scale: 1.25, opacity: 0, duration: .5, ease: "power2.in" }, 1.5)
        .to(".door.l", { rotationY: -108, duration: 1.9, ease: "power3.inOut" }, 1.7)
        .to(".door.r", { rotationY: 108, duration: 1.9, ease: "power3.inOut" }, 1.7)
        .to(".door .shade", { opacity: .55, duration: 1.9, ease: "power2.in" }, 1.7)
        .fromTo(inv, { scale: .92 }, { scale: 1, duration: 2.2, ease: "power2.out" }, 1.6)
        .add(revealInvitacion, 2)
        .set("#doors", { visibility: "hidden" }, 3.7);
      document.dispatchEvent(new CustomEvent("invitacion:abrir"));
    };
    if (!REEL) stage.addEventListener("click", e => { if (!e.target.closest("#invitacion")) openInv(); });

    let rz;
    addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => {
      if (!$("#win").classList.contains("open")) tl.invalidate();
    }, 150); });

    window.abrirInvitacion = openInv;
    window.portada = { tl, seek: s => tl.seek(t(s), false), play: () => tl.play(), pause: () => tl.pause() };
  }
})();
</script>
</body>
</html>
