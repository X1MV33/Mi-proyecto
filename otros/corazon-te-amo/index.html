<meta charset="utf-8">
<title>Te amo en todos los idiomas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Un solo lienzo negro a pantalla completa: el corazón se escribe palabra por palabra */
:root{--bg:#000;--txt:#fff;--muted:#bbb;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);margin:0;overflow:hidden;font-family:system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
button{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:#E0102F;color:#fff;border:0;border-radius:99px;padding:12px 22px;font:600 15px system-ui,sans-serif;cursor:pointer;box-shadow:0 6px 20px rgba(224,16,47,.45)}
button:focus-visible{outline:2px solid #fff;outline-offset:3px}
</style>
<canvas id="c" aria-label="Corazón formado con la frase te amo en muchos idiomas"></canvas>
<button id="again">Volver a dibujar ❤</button>
<script>
const FRASES = ["Te amo","I love you","Je t'aime","Ti amo","Eu te amo","Ich liebe dich","Ik hou van jou","Jag älskar dig","Jeg elsker deg","Kocham cię","Miluji tě","Я тебя люблю","Σ' αγαπώ","Seni seviyorum","أحبك","אני אוהב אותך","मैं तुमसे प्यार करता हूँ","我爱你","愛してる","사랑해","Anh yêu em","Aku cinta kamu","Mahal kita","ฉันรักคุณ","Nakupenda","Te iubesc","Szeretlek","Volim te","T'estimo","Maite zaitut","Mi amas vin","دوستت دارم","Ngiyakuthanda","Nimitztlazohtla","Minä rakastan sinua"];
const ROJOS = ["#FF1F3D","#E0102F","#FF4D6A","#C8102E","#FF6B81"];
const cv = document.getElementById("c"), g = cv.getContext("2d");
let W, H, S, cx, cy, items = [], start = 0, raf;
const heart = t => [16 * Math.sin(t) ** 3, -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))];
function inside(x, y, poly) { let ok = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const [xi, yi] = poly[i], [xj, yj] = poly[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) ok = !ok; } return ok; }
const pick = a => a[Math.floor(Math.random() * a.length)];
function setup() {
  const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W / 36, H / 34); cx = W / 2; cy = H / 2 - S * 1.5;
  const base = Math.max(8, S * .5);
  items = [];
  const NB = 70;
  for (let i = 0; i < NB; i++) { const [x, y] = heart(Math.PI * 2 * i / NB); items.push({ x: cx + x * S, y: cy + y * S, t: FRASES[i % FRASES.length], f: base * (1 + Math.random() * .25), c: pick(ROJOS) }); }
  const poly = Array.from({ length: 200 }, (_, k) => heart(Math.PI * 2 * k / 200).map(v => v * .88));
  let n = 0, tries = 0; const NF = Math.round(220 * Math.min(1, (W * H) / (900 * 800)) + 40);
  while (n < NF && tries++ < 20000) { const x = (Math.random() * 2 - 1) * 16, y = Math.random() * 30 - 17; if (inside(x, y, poly)) { items.push({ x: cx + x * S, y: cy + y * S, t: pick(FRASES), f: base * (.75 + Math.random() * .35), c: pick(ROJOS) }); n++; } }
  start = performance.now(); cancelAnimationFrame(raf); draw();
}
function draw(now = performance.now()) {
  const k = (now - start) / 1000, shown = Math.min(items.length, Math.floor(70 * Math.min(1, k / 2.4) + Math.max(0, k - 2.4) * 140));
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.textBaseline = "middle";
  for (let i = 0; i < shown; i++) { const it = items[i]; g.fillStyle = it.c; g.font = `700 ${it.f}px system-ui,"Noto Sans",sans-serif`; g.fillText(it.t, it.x, it.y); }
  if (shown >= items.length) {
    const a = Math.min(1, (k - items.length / 140) * .8), pulse = 1 + Math.sin(k * 3) * .04;
    g.save(); g.globalAlpha = Math.max(0, a); g.translate(cx, cy - S * 1.5); g.scale(pulse, pulse);
    g.fillStyle = "#fff"; g.shadowColor = "#FF1F3D"; g.shadowBlur = 18; g.font = `800 ${S * 2}px system-ui,sans-serif`; g.fillText("Te amo ❤", 0, 0); g.restore();
  }
  raf = requestAnimationFrame(draw);
}
addEventListener("resize", setup); document.getElementById("again").onclick = setup; setup();
</script>
