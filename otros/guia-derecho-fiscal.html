<style>
/* Layout: cuaderno de estudio con pestañas arriba (Aprende · Tarjetas · Examen · Chuleta); resaltador amarillo como acento */
:root{
  --bg:#F3F5F4; --card:#FFFFFF; --ink:#16302B; --muted:#5B6E69; --line:#D9E1DE;
  --accent:#0F766E; --accent-soft:#D5EFEA; --mark:#FFE477; --ok:#1F8A4C; --ok-soft:#DDF3E5; --bad:#C0392B; --bad-soft:#FBE3E0;
  --display:"Sora",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1B19; --card:#16262A; --ink:#E6EFEC; --muted:#9DB2AC; --line:#2A3D3B;
  --accent:#4FD1C0; --accent-soft:#163E3A; --mark:#7A6716; --ok:#5ED08F; --ok-soft:#173A27; --bad:#FF8A7A; --bad-soft:#40201C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1B19; --card:#16262A; --ink:#E6EFEC; --muted:#9DB2AC; --line:#2A3D3B;
  --accent:#4FD1C0; --accent-soft:#163E3A; --mark:#7A6716; --ok:#5ED08F; --ok-soft:#173A27; --bad:#FF8A7A; --bad-soft:#40201C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6vw,40px);font-weight:800;letter-spacing:-.02em}
mark{background:var(--mark);color:inherit;padding:0 .15em;border-radius:3px}
.top{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.top p{margin:0;color:var(--muted)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding-block:10px;overflow-x:auto}
nav button{flex:1;min-width:max-content;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 14px var(--body);padding:10px 14px;border-radius:12px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
button:focus-visible,summary:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.tip{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px;margin:10px 0}
.tip b{color:var(--accent)}
/* Aprende */
details.unit{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.unit>summary{list-style:none;cursor:pointer;padding:16px;display:flex;gap:12px;align-items:center}
details.unit>summary::-webkit-details-marker{display:none}
.num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:800 15px var(--display)}
.done .num{background:var(--ok);color:var(--card)}
summary h2{font-size:17px;flex:1}
summary .chev{color:var(--muted);transition:transform .2s}
details[open] .chev{transform:rotate(90deg)}
.ub{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ub h3{font-size:15px;margin-top:6px}
.ub p{margin:0}
.ub ul{margin:0;padding-left:20px}
.ub table{width:100%;border-collapse:collapse;font-size:14px}
.ub td,.ub th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.tbl{overflow-x:auto}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:14px;background:var(--bg)}
.pill b{color:var(--accent)}
.eq{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600}
.eq span{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.check{border:1.5px dashed var(--line);border-radius:12px;padding:12px}
.check p{font-weight:600;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:500 15px var(--body);padding:11px 13px;border-radius:10px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.why{font-size:14px;color:var(--muted);margin-top:8px}
/* Tarjetas */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flash{perspective:1200px;height:270px;cursor:pointer;margin-bottom:12px}
.fi{position:relative;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.flip .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;border:1px solid var(--line);background:var(--card)}
.face.back{transform:rotateY(180deg);background:var(--accent-soft)}
.face small{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.face .q{font:700 clamp(19px,4.5vw,24px)/1.3 var(--display)}
.face .a{font-size:16px;max-width:52ch}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--accent);color:var(--card);font:600 15px var(--body);padding:12px 16px;border-radius:12px;cursor:pointer;flex:1}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--ok)}
.btn.warn{background:var(--bad)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;margin-top:8px}
/* Examen */
.qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.qcard .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qcard h3{font-size:19px;line-height:1.35}
.score{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.big{font:800 64px var(--display);color:var(--accent);font-variant-numeric:tabular-nums}
.miss{width:100%;text-align:left;background:var(--bad-soft);border-radius:10px;padding:10px 12px;font-size:14px}
/* Chuleta */
.cheat{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.cg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.cg h3{font-size:14px;color:var(--accent);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.cg dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:14px}
.cg dt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cg dd{margin:0;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- TEMAS ---------- */
const UNITS=[
{t:"Consecuencias por incumplir",html:`
<p>Una <mark>infracción fiscal</mark> es no cumplir una obligación de la ley fiscal. <b>Todavía no es delito</b>, es una falta administrativa (se castiga con multa, no con cárcel).</p>
<p>Las más comunes: no presentar <b>declaraciones, solicitudes, documentación, avisos o información</b>.</p>
<div class="tip"><b>Ejemplo de examen:</b> presentar tu declaración fuera de plazo = infracción + multa.</div>
<h3>Si no pagas a tiempo, pagas 4 cosas</h3>
<div class="eq"><span>Contribución omitida</span>+<span>Actualización</span>+<span>Recargos</span>+<span>Multa</span></div>
<div class="tip"><b>Truco:</b> "pagar tarde trae <b>CARMa</b>": <b>C</b>ontribución, <b>A</b>ctualización, <b>R</b>ecargos, <b>M</b>ulta.</div>
<div class="tbl"><table>
<tr><th>Concepto</th><th>Artículo</th><th>En palabras simples</th></tr>
<tr><td><b>Actualización</b></td><td>17-A CFF</td><td>Ajuste por <mark>inflación</mark>. Factor = INPC del mes anterior al más reciente ÷ INPC del mes anterior al más antiguo.</td></tr>
<tr><td><b>Recargos</b></td><td>21 CFF</td><td><mark>Indemnización</mark> al fisco por pagar tarde (como interés moratorio). Por cada mes o fracción. Se calcula sobre la contribución <b>ya actualizada</b>.</td></tr>
<tr><td><b>Multa</b></td><td>70 CFF</td><td><mark>Sanción</mark> por la infracción. Se paga aunque pagues el impuesto, y sin perjuicio de la pena si hay delito.</td></tr>
</table></div>
<div class="tip"><b>Clave:</b> pagar la multa no te quita el impuesto, y pagar el impuesto no te quita la multa. Pagas todo.</div>`,
check:{q:"Los recargos se calculan sobre…",o:["La contribución original","La contribución ya actualizada","La multa"],a:1,w:"Primero se actualiza por inflación y sobre ese monto se calculan los recargos (Art. 21 CFF)."}},

{t:"Delitos fiscales",html:`
<p>Arts. <b>92 a 115 Bis CFF</b>. Aquí ya no es multa: <mark>es cárcel</mark>. Son conductas graves que dañan al fisco.</p>
<h3>Defraudación fiscal · Art. 108 CFF</h3>
<p>Con <b>engaños o aprovechando errores</b>, dejas de pagar total o parcialmente una contribución u obtienes un beneficio indebido, perjudicando al fisco federal.</p>
<div class="tbl"><table>
<tr><th>Monto defraudado</th><th>Pena</th></tr>
<tr><td>Hasta $2,531,920</td><td>3 meses a 2 años</td></tr>
<tr><td>Más de $2,531,920 hasta $3,797,870</td><td>2 a 5 años</td></tr>
<tr><td>Más de $3,797,870</td><td>3 a 9 años</td></tr>
<tr><td>No se puede determinar</td><td>3 meses a 6 años</td></tr>
</table></div>
<div class="tip"><b>Truco:</b> aprende los cortes como "<b>2.5 millones</b>" y "<b>3.8 millones</b>". Penas: <b>2 → 5 → 9</b> años máximos (y 6 si no se sabe el monto).</div>
<h3>Contrabando · Art. 102 CFF</h3>
<p>Meter o sacar mercancía del país <b>sin pagar impuestos</b>, <b>sin permisos</b> o mercancía <b>prohibida</b>.</p>
<h3>Delitos equiparables</h3>
<p>No son exactamente el delito base, pero se castigan igual porque dañan igual.</p>
<div class="pills"><span class="pill">Equiparable a defraudación: <b>Art. 109</b></span><span class="pill">Equiparable a contrabando: <b>Art. 105</b></span></div>
<div class="tip"><b>Truco:</b> defraudación <b>108 → 109</b> (el que sigue). Contrabando <b>102 → 105</b>.</div>`,
check:{q:"Alguien defrauda $3,000,000 al fisco. ¿Qué pena le toca?",o:["3 meses a 2 años","2 a 5 años","3 a 9 años"],a:1,w:"$3,000,000 está entre $2,531,920 y $3,797,870 → de 2 a 5 años."}},

{t:"Los 3 tipos de responsabilidad",html:`
<div class="tip"><b>Esto siempre lo preguntan.</b> Administrativa = dinero · Penal = cárcel · Solidaria = otras personas también responden.</div>
<h3>1. Administrativa</h3>
<p>La aplica el <b>SAT sin ir a lo penal</b>. Solo consecuencias económicas y administrativas.</p>
<ul><li><b>Contribuyente:</b> omitir pago, no declarar, no emitir CFDI, no estar localizable en su domicilio fiscal.</li>
<li><b>Servidor público:</b> no cobrar impuestos, gestionar mal recursos, condonar deudas ilegalmente. Se regula en la <mark>Ley General de Responsabilidades Administrativas</mark>.</li></ul>
<h3>2. Penal</h3>
<p>Ya hay <b>delito fiscal</b>: procedimiento penal y prisión.</p>
<ul><li><b>Art. 92 CFF:</b> cómo se procede y la intervención de la <b>SHCP</b>. Sin <mark>querella de la SHCP</mark> casi nunca hay proceso penal fiscal.</li>
<li><b>Art. 95 CFF:</b> quiénes son responsables: quienes <b>cometen, participan, inducen o ayudan</b>.</li></ul>
<h3>3. Solidaria · Art. 26 CFF</h3>
<p>Otras personas además del contribuyente responden ante el SAT: <b>retenedores, representantes legales, liquidadores, socios y accionistas</b> (en ciertos casos).</p>
<ul><li>Incluye los <b>accesorios</b>, pero <mark>NO las multas</mark>.</li><li>Solo existe si hay un supuesto del Art. 26: <b>no es automática</b>.</li><li>Puede tener límites.</li></ul>
<h3>Facultades de comprobación · Art. 42 CFF</h3>
<p>Las herramientas del SAT para revisar que cumplas: revisar declaraciones, contabilidad y documentos; pedir datos a ti y a terceros; <b>visitas domiciliarias</b>; <b>revisiones electrónicas</b>; verificar bienes y mercancías. Sirven para detectar omisiones, determinar créditos fiscales y comprobar delitos.</p>`,
check:{q:"¿Qué NO comprende la responsabilidad solidaria?",o:["Las contribuciones","Los accesorios","Las multas"],a:2,w:"Art. 26 CFF: comprende los accesorios, pero no las multas."}},

{t:"Principales leyes e impuestos",html:`
<div class="tbl"><table>
<tr><th>Ley</th><th>¿Qué hace?</th></tr>
<tr><td><b>CFF</b></td><td>La <mark>ley marco</mark> del sistema tributario: quién paga, cómo se calcula, cómo se declara, derechos y obligaciones.</td></tr>
<tr><td><b>LISR</b></td><td>Grava los <b>ingresos</b> de físicas y morales. Tiene estímulos (p. ej. contratar personas con discapacidad o adultos mayores).</td></tr>
<tr><td><b>LIVA</b></td><td>Impuesto al <mark>consumo</mark>: venta de bienes, servicios, uso o goce temporal e importación.</td></tr>
<tr><td><b>LIEPS</b> (Art. 1)</td><td>Bienes específicos: <b>alcohol, tabaco, bebidas azucaradas y combustibles</b>.</td></tr>
<tr><td><b>Ley Federal de Derechos</b></td><td>Pagos por <b>servicios del Estado</b> o uso de bienes públicos: pasaporte, trámites migratorios, agua nacional.</td></tr>
</table></div>
<h3>Los 7 Títulos de la LISR</h3>
<p>I. Disposiciones Generales · II. Personas Morales · III. Morales con Fines no Lucrativos · IV. Personas Físicas · V. Residentes en el Extranjero · VI. Entidades Extranjeras y Partes Relacionadas · VII. Estímulos Fiscales.</p>
<div class="tip"><b>Truco:</b> va de lo general a lo particular: <b>General → Morales → No lucrativas → Físicas → Extranjero → Partes relacionadas → Estímulos</b>.</div>
<h3>Persona moral vs. física</h3>
<div class="tbl"><table>
<tr><th></th><th>Moral</th><th>Física</th></tr>
<tr><td>Qué es</td><td>Empresa, entidad jurídica</td><td>Ser humano</td></tr>
<tr><td>Identidad</td><td>Denominación o razón social</td><td>Nombre y apellidos</td></tr>
<tr><td>RFC</td><td>Propio, distinto al de los socios</td><td>Individual</td></tr>
<tr><td>Responsabilidad</td><td><mark>Limitada</mark> al capital aportado</td><td><mark>Ilimitada</mark>: responde con su patrimonio</td></tr>
<tr><td>Ejemplo</td><td>S.A. de C.V., S. de R.L., A.C.</td><td>Médico, freelance, empleado</td></tr>
<tr><td>Fundamento</td><td>CCF 25-28, LGSM, LISR 76-78</td><td>CCF, CFF y LISR</td></tr>
</table></div>
<h3>RESICO · Art. 113-E LISR</h3>
<p>Personas físicas con actividad empresarial o profesional con ingresos de <mark>hasta $3.5 millones</mark> al año. Pagan ISR con tasas reducidas.</p>
<h3>ISAN (autos nuevos)</h3>
<p>Se paga <b>una sola vez</b> al comprar o importar un auto nuevo.</p>
<div class="pills"><span class="pill"><b>Art. 1</b> quién paga</span><span class="pill"><b>Art. 2</b> cómo se calcula (tabla: más caro, más %)</span><span class="pill"><b>Art. 3</b> quién NO paga: eléctricos, híbridos, gama baja</span><span class="pill"><b>Art. 7</b> la agencia retiene y desglosa</span></div>
<h3>Comercio exterior</h3>
<p>Se paga en <b>aduana</b>. La exportación casi no paga (para incentivar ventas al extranjero).</p>
<ul><li><b>IGI:</b> arancel según la fracción arancelaria (<mark>8 dígitos</mark>). De 0% a 35% o más.</li>
<li><b>DTA:</b> <mark>8 al millar = 0.8%</mark> del valor, por usar la aduana.</li>
<li>Con tratado + certificado de origen, el IGI puede bajar a <b>0%</b>. Con programas de fomento importas temporalmente sin pagar si luego exportas.</li></ul>
<h3>Contribuciones ambientales</h3>
<p>Se cobran a quien contamina o explota recursos, para empujar tecnologías limpias. Casi no hay federales; los estados sí las tienen. Se cobran por 4 cosas:</p>
<ul><li>Emisiones a la atmósfera</li><li>Contaminación de agua, suelo y subsuelo</li><li>Generación y depósito de residuos</li><li>Extracción de materiales pétreos (piedra, arena, grava)</li></ul>
<div class="tip"><b>Truco:</b> <b>Aire, Agua/suelo, Basura, Piedras</b>.</div>`,
check:{q:"El DTA equivale a…",o:["8 al millar (0.8%)","8%","16%"],a:0,w:"Derecho de Trámite Aduanero: 8 al millar, o sea 0.8% del valor de la mercancía."}},

{t:"Digitalización, datos y transparencia",html:`
<p><b>Digitalización tributaria:</b> el SAT usa tecnología con 2 objetivos: que sea <mark>más fácil cumplir</mark> y <mark>más difícil evadir</mark>.</p>
<p><b>Economía digital:</b> usar tecnología para producir, vender y consumir (banca digital, e-commerce, clases en línea, apps, plataformas).</p>
<p><b>SAT:</b> <mark>órgano desconcentrado de la SHCP</mark>. Recauda ISR, IVA e IEPS y vigila que físicas y morales cumplan.</p>
<h3>Datos que se deben proteger</h3>
<div class="pills"><span class="pill"><b>Identificación:</b> nombre, CURP, teléfono</span><span class="pill"><b>Fiscales:</b> RFC, e.firma</span><span class="pill"><b>Biométricos:</b> huella</span><span class="pill"><b>Económicos:</b> ingresos, declaraciones</span><span class="pill"><b>Actividad económica</b></span></div>
<h3>Secreto fiscal · Art. 69 CFF</h3>
<p>Autoridades y servidores públicos deben guardar <mark>absoluta reserva</mark> de declaraciones y datos del contribuyente, y de lo que obtengan en sus revisiones.</p>
<h3>Derechos ARCO · Art. 16 Constitucional y Art. 43 LGPD</h3>
<div class="pills"><span class="pill"><b>A</b>cceso: ver tus datos</span><span class="pill"><b>R</b>ectificación: corregirlos</span><span class="pill"><b>C</b>ancelación: que los borren</span><span class="pill"><b>O</b>posición: que no los usen</span></div>
<p><b>Transparencia fiscal:</b> las autoridades deben informar de forma clara, completa y oportuna cómo recaudan y gastan. Da confianza y rendición de cuentas.</p>
<h3>Tendencias internacionales</h3>
<ul><li>Impuesto mínimo global del <mark>15%</mark> a multinacionales</li><li>Gravar la economía digital</li><li>Digitalizar las administraciones (factura electrónica, análisis de datos)</li></ul>`,

{t:"Sistema tributario: federal, estatal y municipal",html:`
<div class="tbl"><table>
<tr><th>Nivel</th><th>Fundamento</th><th>Quién crea / recauda</th><th>Ejemplos</th></tr>
<tr><td><b>Federal</b></td><td>Art. 73 fr. VII y XXIX CPEUM</td><td>Congreso de la Unión. Autoridades: SHCP, IMSS, INFONAVIT, CONAGUA, TESOFE</td><td>ISR, IVA, IEPS, comercio exterior</td></tr>
<tr><td><b>Estatal</b></td><td>Art. 124, 117 y 118 CPEUM</td><td>Congreso local; recauda la Secretaría de Finanzas</td><td>Nóminas, hospedaje, derechos estatales</td></tr>
<tr><td><b>Municipal</b></td><td>Art. 115 fr. III y IV CPEUM</td><td>Ayuntamiento <b>propone</b>, Congreso del Estado <b>aprueba</b>; recauda la Tesorería Municipal</td><td>Predial, adquisición de inmuebles, derechos por servicios, contribuciones de mejoras</td></tr>
</table></div>
<div class="tip"><b>Clave:</b> lo que no es federal es de los estados (Art. 124: facultades residuales). El <mark>municipio NO tiene Congreso</mark>: no puede crear impuestos solo.</div>
<div class="tip"><b>Truco:</b> <b>73</b> Federación · <b>124</b> Estados · <b>115</b> Municipio.</div>
<h3>Coordinación fiscal</h3>
<p>Nació por la <b>duplicidad de impuestos</b> entre los tres niveles. La <b>Ley de Coordinación Fiscal</b> se publicó el <mark>27 de diciembre de 1978</mark> y entró en vigor el <mark>1 de enero de 1980</mark>. Creó el Sistema Nacional de Coordinación Fiscal.</p>
<div class="tbl"><table>
<tr><th>Participaciones</th><th>Aportaciones</th></tr>
<tr><td><mark>NO condicionadas</mark>. Se reparten por población, recaudación local y crecimiento. Fondos: General de Participaciones, Fomento Municipal, Fiscalización y Recaudación, Participación por IEPS.</td><td><mark>Condicionadas</mark> a fines específicos: educación, salud, seguridad, infraestructura. Son <b>8 fondos</b>.</td></tr>
</table></div>
<div class="tip"><b>Truco:</b> <b>A</b>portaciones = <b>A</b>marradas a un fin. <b>P</b>articipaciones = <b>P</b>ara lo que quieras.</div>
<p><b>Convenios de coordinación:</b> el estado colabora con la Federación en recaudar y fiscalizar.</p>
<p><b>Federalismo fiscal:</b> cómo se reparten responsabilidades y recursos entre Federación, estados y municipios.</p>`,

function mcq(box,q,opts,ans,why,onDone){
  box.innerHTML=`<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="why" hidden></div>`;
  const w=box.querySelector('.why');
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(box.dataset.locked)return; box.dataset.locked=1; const i=+b.dataset.i;
    box.querySelectorAll('.opt')[ans].classList.add('ok'); if(i!==ans)b.classList.add('bad');
    w.hidden=false; w.innerHTML=(i===ans?'<b style="color:var(--ok)">¡Correcto!</b> ':'<b style="color:var(--bad)">Casi.</b> ')+why; onDone&&onDone(i===ans);
  });
}
const A=document.getElementById('aprende');

  A.appendChild(d);

function build(){deck=CARDS.map((c,i)=>i).filter(i=>(filt<0||CARDS[i][0]===filt)&&!known.includes(i));deck.sort(()=>Math.random()-.5);ci=0;draw()}
const fl=document.getElementById('flash');
function draw(){
  fl.classList.remove('flip');
  const tot=CARDS.filter(c=>filt<0||c[0]===filt).length;
  if(!deck.length){document.getElementById('fTema').textContent='';document.getElementById('fQ').textContent='🎉 ¡Te sabes todas!';document.getElementById('fA').textContent='Toca "Repasar otra vez" para reiniciar este grupo.';document.getElementById('cCount').textContent=`${tot} de ${tot} dominadas`;return}
  const c=CARDS[deck[ci%deck.length]];
  setTimeout(()=>{document.getElementById('fTema').textContent=SHORT[c[0]];document.getElementById('fQ').textContent=c[1];document.getElementById('fA').textContent=c[2]},150);
  document.getElementById('cCount').textContent=`Dominadas: ${tot-deck.length} de ${tot} · quedan ${deck.length}`;
}
fl.onclick=()=>fl.classList.toggle('flip');
fl.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();fl.classList.toggle('flip')}};
document.getElementById('cOk').onclick=()=>{if(!deck.length)return;known.push(deck[ci%deck.length]);store.set('known',known);deck.splice(ci%deck.length,1);draw()};
document.getElementById('cRep').onclick=()=>{if(!deck.length){known=known.filter(i=>!(filt<0||CARDS[i][0]===filt));store.set('known',known);build();return}ci++;draw()};

function startMenu(){
  const best=store.get('best',null);
  QZ.innerHTML=`<div class="qcard"><h3>Simulacro de examen</h3><p style="margin:0;color:var(--muted)">Preguntas al azar con la respuesta explicada al momento. ${best!==null?`Tu mejor resultado: <b>${best}%</b>.`:''}</p>
  <div class="row"><button class="btn" data-n="15">Rápido · 15</button><button class="btn ghost" data-n="30">Medio · 30</button><button class="btn ghost" data-n="${Q.length}">Todas · ${Q.length}</button></div></div>`;
  QZ.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>start(+b.dataset.n));
}
function start(n){qs=[...Q].sort(()=>Math.random()-.5).slice(0,n);qi=0;ok=0;miss=[];next()}
function next(){
  if(qi>=qs.length)return end();
  const [u,q,o,a,w]=qs[qi];
  const ord=o.map((x,i)=>i).sort(()=>Math.random()-.5);
  QZ.innerHTML=`<div class="qcard"><div class="meta"><span>${SHORT[u]}</span><span>${qi+1} / ${qs.length} · ✓ ${ok}</span></div><div class="bar"><i style="width:${qi/qs.length*100}%"></i></div><h3>${q}</h3><div class="cb"></div><button class="btn" id="nx" hidden>Siguiente →</button></div>`;
  mcq(QZ.querySelector('.cb'),q,ord.map(i=>o[i]),ord.indexOf(a),w,good=>{if(good)ok++;else miss.push(qs[qi]);const nx=document.getElementById('nx');nx.hidden=false;nx.focus();nx.onclick=()=>{qi++;next()}});
}
function end(){
  const p=Math.round(ok/qs.length*100); const best=store.get('best',0); if(p>best)store.set('best',p);
  const msg=p>=90?'¡Vas lista para el examen! 🔥':p>=70?'¡Muy bien! Repasa las que fallaste y quedas.':'Vuelve a leer los temas marcados abajo y repite el simulacro.';
  QZ.innerHTML=`<div class="qcard score"><div class="big">${p}%</div><h3>${ok} de ${qs.length} correctas</h3><p style="margin:0">${msg}</p>
  ${miss.map(m=>`<div class="miss"><b>${m[1]}</b><br>✔ ${m[2][m[3]]}. ${m[4]}</div>`).join('')}
  <div class="row" style="width:100%"><button class="btn" id="again">Otro simulacro</button>${miss.length?'<button class="btn ghost" id="retry">Repetir solo las falladas</button>':''}</div></div>`;
  document.getElementById('again').onclick=startMenu;
  const r=document.getElementById('retry'); if(r)r.onclick=()=>{qs=[...miss].sort(()=>Math.random()-.5);qi=0;ok=0;miss=[];next()};
}
startMenu();
