<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>XV de Valentina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Pinyon+Script&display=block" rel="stylesheet">
<style>
  :root{
    --olive-cream:#E6E8CF;
    --serif:#6E6A4E;
    --name:#5E6B32;
    --gold:#C9A15A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center;
       font-family:"Cormorant Garamond",Georgia,serif;
       -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}

  /* Stage 9:16 — en móvil llena la pantalla; en pantallas anchas se encaja 9:16.
     Todo se mide en cqw/cqh (unidades del stage). */
  #stage{position:relative;
    width:min(100vw,56.25vh);width:min(100vw,56.25dvh);
    height:100%;
    overflow:hidden;container-type:size;background:#000;isolation:isolate;
    user-select:none;-webkit-user-select:none}
  .layer{position:absolute;inset:0;pointer-events:none}
  img{display:block;-webkit-user-drag:none}
  .will{will-change:transform,opacity}

  /* ---------- ESCENA 1 · fondo (detrás de la ventana) ---------- */
  #s1{z-index:1;background:#3A4428}
  #s1Zoom,#s1Breath{position:absolute;inset:0;transform-origin:50% 50%}
  #s1 .bg{position:absolute;inset:-3%}
  #s1 .bg img{width:100%;height:100%;object-fit:cover}

  /* ---------- ESCENA 1 · frente (marcos, cenefa, estrellas, monograma) ----------
     Va POR ENCIMA de la ventana: las flores tapan el borde del arco (profundidad). */
  #s1Front{z-index:3}
  #s1FrontBreath{position:absolute;inset:0;transform-origin:50% 50%}
  .cenefa{position:absolute;top:-2%;height:104%;width:9cqw;object-fit:cover;object-position:top;opacity:.9}
  .cenefa.l{left:0}
  .cenefa.r{right:0;transform:scaleX(-1)}
  .marco1{position:absolute;top:-2%;height:104%;width:36cqw}
  .marco1 img{width:100%;height:100%;object-fit:cover}
  .marco1.l{left:-3cqw}
  .marco1.l img{object-position:left center}
  .marco1.r{right:-3cqw}
  .marco1.r img{object-position:right center}
  #stars{position:absolute;inset:0}
  .star{position:absolute;width:6.4cqw;height:6.4cqw;margin:-3.2cqw 0 0 -3.2cqw}
  .star img{width:100%;height:100%}

  /* Monograma serif alto contraste (estilo didone) + tiara */
  #monogram{position:absolute;z-index:4;left:50%;top:46%;
    width:72cqw;height:72cqw;margin:-36cqw 0 0 -36cqw;opacity:0}
  #monogram svg{width:100%;height:100%;overflow:visible}
  #monogram .glyph{font-family:"Bodoni Moda","Playfair Display",serif;font-weight:400;
    fill:var(--olive-cream);fill-opacity:0;stroke:var(--olive-cream);stroke-width:.6;
    stroke-linejoin:round;filter:drop-shadow(0 0 1.6px rgba(28,34,18,.55)) drop-shadow(0 .6px 1px rgba(28,34,18,.35))}
  #monogram .glyph.under{fill:none;stroke:#3A4428;stroke-width:2.2;stroke-opacity:0;filter:none}
  #monogram .tiara{fill:none;stroke:var(--olive-cream);stroke-width:.9;stroke-linejoin:round;stroke-linecap:round}

  /* ---------- VENTANA EN ARCO (contiene ESCENA 2) ---------- */
  #win{position:absolute;z-index:2;left:50%;top:50%;
    width:62cqw;height:86.8cqw;                /* proporción 100 x 140 */
    margin:-43.4cqw 0 0 -31cqw;
    transform-origin:50% 50%;
    -webkit-mask:var(--arch) center/100% 100% no-repeat;mask:var(--arch) center/100% 100% no-repeat;
    visibility:hidden}
  #win.open{-webkit-mask:none;mask:none}
  #s2{position:absolute;width:100cqw;height:100cqh;left:50%;top:50%;
    margin:-50cqh 0 0 -50cqw;transform-origin:50% 50%;overflow:hidden;background:#EEF0EA}
  #s2 .pl{position:absolute;inset:-4% -6%}
  #s2 .pl img{width:100%;height:100%;object-fit:cover}
  #s2 .pl.cielo{inset:-2% -3%}
  /* bruma blanca: al abrir la ventana la escena 2 se ve "lavada" y luego aclara */
  #haze{position:absolute;inset:0;
    background:
      radial-gradient(ellipse 80% 42% at 50% 30%, rgba(255,255,255,.95), rgba(255,255,255,.55) 55%, rgba(255,255,255,0) 100%),
      linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 60%)}
  /* borde sombreado del arco (como corte en papel) */
  #archRim{position:absolute;z-index:2;left:50%;top:50%;
    width:62cqw;height:86.8cqw;margin:-43.4cqw 0 0 -31cqw;transform-origin:50% 50%;
    visibility:hidden;opacity:0}
  #archRim svg{width:100%;height:100%;overflow:visible}

  #particles{position:absolute;inset:0}
  .p{position:absolute;width:1.5cqw;height:1.5cqw;border-radius:50%;
     background:radial-gradient(circle, rgba(255,248,230,.95) 0%, rgba(240,210,170,.45) 40%, rgba(240,210,170,0) 70%)}

  /* marco floral escena 2 */
  .frame2{position:absolute}
  .frame2 img{width:100%;height:auto}
  .frame2.sup{top:0;left:-2%;width:104%}
  .frame2.inf{bottom:0;left:-2%;width:104%}
  .frame2.lat{top:0;height:100%;width:22cqw}
  .frame2.lat img{height:100%;width:100%;object-fit:cover;object-position:left}
  .frame2.lat.l{left:-3cqw}
  .frame2.lat.r{right:-3cqw}
  .frame2.lat.r img{transform:scaleX(-1)}

  /* textos */
  #texts{position:absolute;left:0;right:0;top:29%;display:flex;flex-direction:column;align-items:center;text-align:center}
  #kicker{font-family:"Cormorant Garamond",serif;font-weight:400;color:var(--serif);
    font-size:5.6cqw;letter-spacing:.16em;padding-left:.16em;white-space:nowrap}
  #kicker .ch{display:inline-block;opacity:0}
  .name{font-family:"Pinyon Script","Great Vibes",cursive;color:var(--name);
    font-size:21cqw;line-height:1.25;white-space:nowrap;margin-top:1cqw;
    text-shadow:0 .2cqw 1.4cqw rgba(255,250,245,.7)}
  .reveal{display:inline-block;overflow:hidden;padding:0 14cqw 0 3cqw;margin:0 -14cqw 0 -3cqw;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 14cqw),transparent);
            mask-image:linear-gradient(90deg,#000 calc(100% - 14cqw),transparent)}
  .reveal > span{display:inline-block}
  .frase{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:400;color:var(--serif);
    font-size:5.6cqw;line-height:1.3;opacity:0;white-space:nowrap;text-shadow:0 0 1.2cqw rgba(255,252,248,.9)}
  .fecha{font-family:"Cormorant Garamond",serif;font-weight:400;color:var(--serif);
    font-size:3.6cqw;letter-spacing:.32em;padding-left:.32em;text-transform:uppercase;
    margin-top:2.4cqw;opacity:0;white-space:nowrap}
  .fecha:empty{display:none}
  #sparkles{position:absolute;inset:0}
  .spk{position:absolute;width:4cqw;height:4cqw;margin:-2cqw 0 0 -2cqw;opacity:0}
  .spk svg{width:100%;height:100%;overflow:visible}

  #butterflies{position:absolute;inset:0;z-index:6}
  .bfly{position:absolute;left:0;top:0;width:9cqw;height:7.2cqw;margin:-3.6cqw 0 0 -4.5cqw;opacity:0}
  .bfly img{width:100%;height:100%}

  /* ---------- ACABADOS ---------- */
  #paper{z-index:20;opacity:.08;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 1.2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size:240px 240px}
  #vignette{z-index:21;background:radial-gradient(ellipse 85% 70% at 50% 48%, rgba(0,0,0,0) 58%, rgba(0,0,0,.36) 100%)}
  #black{z-index:30;background:#000}
  #watermark{position:absolute;z-index:25;left:0;right:0;
    bottom:calc(2.6cqh + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;
    font-family:"Cormorant Garamond",serif;font-size:2.6cqw;letter-spacing:.24em;
    color:rgba(255,255,255,.66);text-shadow:0 0 .8cqw rgba(0,0,0,.4);opacity:0}

  .ui{position:absolute;z-index:26}
  #hint{left:50%;bottom:calc(6.4cqh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    font-size:3.4cqw;letter-spacing:.18em;color:#fff;padding:1.4cqw 3.6cqw;border-radius:999px;
    background:rgba(0,0,0,.18);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    border:1px solid rgba(255,255,255,.35);opacity:0;pointer-events:none;white-space:nowrap}
  #loader{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    color:rgba(230,232,207,.75);font-size:3.4cqw;letter-spacing:.3em}
  body.reel .ui{display:none!important}
  body.reel{cursor:none}

  /* Siguiente sección (contenedor preparado) */
  #invitacion{position:absolute;inset:0;z-index:50;background:#FBF5EE;overflow-y:auto;
    -webkit-overflow-scrolling:touch;visibility:hidden;opacity:0}
  #invitacion .seccion{min-height:100%;padding:12cqw 8cqw;color:var(--serif)}

  /* =================== INVITACIÓN · estilo jardín olivo (papel festoneado, sobres, sellos de corazón) =================== */
  #invitacion{--ol:#7B8A4B;--ol-d:#66753B;--ol-l:#93A163;--paper:#F8F5EE;--bg2:#F3F0EB;--ink:#6F7A40;--txt:#77745C;--pink:#D9779A;
    background:var(--bg2);color:var(--txt);scroll-behavior:smooth}
  #invitacion::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .3  0 0 0 1.2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
  .inv{position:relative;text-align:center;font-family:"Cormorant Garamond",serif}
  .sec{padding:14cqw 9cqw;position:relative}
  .sec h2,.script{font-family:"Pinyon Script",cursive;font-weight:400;color:var(--ink);line-height:1.15}
  .sec h2{font-size:11.5cqw}
  .sec .cap{font-size:4.6cqw;color:var(--ink);margin-top:.6cqw}
  .sec p{font-size:4.5cqw;line-height:1.55;color:var(--txt)}
  .green{background:var(--ol);background-image:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.08),transparent 60%)}
  .green h2,.green .script{color:#F8F5E8}
  .green p{color:#EEEDE0}
  .divider{display:block;width:44cqw;height:5cqw;margin:2.4cqw auto 5cqw;color:currentColor;opacity:.85}
  .green .divider{color:#EDEBDC}
  .btn-o{display:inline-block;padding:1.6cqw 6cqw;border:1px solid var(--ink);border-radius:99px;color:var(--ink);text-decoration:none;
    font-size:3.6cqw;letter-spacing:.06em;background:transparent;font-family:"Cormorant Garamond",serif;cursor:pointer}
  .btn-o:hover,.btn-o:focus-visible{background:var(--ink);color:#fff;outline:none}

  /* papel con orilla festoneada (scallop) */
  .scal{--d:3.2cqw;--c:var(--paper);position:relative;padding:calc(var(--d) / 2);
    background:
      radial-gradient(circle closest-side,var(--c) 97%,transparent) top left/var(--d) var(--d) round no-repeat,
      radial-gradient(circle closest-side,var(--c) 97%,transparent) bottom left/var(--d) var(--d) round no-repeat,
      radial-gradient(circle closest-side,var(--c) 97%,transparent) top left/var(--d) var(--d) no-repeat round,
      radial-gradient(circle closest-side,var(--c) 97%,transparent) top right/var(--d) var(--d) no-repeat round,
      linear-gradient(var(--c),var(--c)) center/calc(100% - var(--d)) calc(100% - var(--d)) no-repeat;
    filter:drop-shadow(0 1.4cqw 1.6cqw rgba(70,60,30,.2))}
  .scal .in{position:relative;background:var(--c);padding:9cqw 7cqw;outline:1px solid rgba(160,150,110,.35);outline-offset:-2.2cqw}
  .scal .in::before{content:"";position:absolute;inset:3.4cqw;border:.5cqw dotted rgba(170,160,120,.35);pointer-events:none}
  .scal.greenp{--c:var(--ol)} .scal.greenp .in{color:#F3F1E4;outline-color:rgba(255,255,255,.25)} .scal.greenp .in::before{border-color:rgba(255,255,255,.2)}

  /* portada interna: sobre con foto */
  .inv-hero{padding:22cqw 8cqw 12cqw;background:linear-gradient(#F5F2ED,#F1EEE8)}
  .envl{position:relative;width:66cqw;height:46cqw;margin:20cqw auto 0}
  .envl .fl{position:absolute;left:0;right:0;bottom:62%;height:44%;background:var(--ol-d);clip-path:polygon(0 100%,50% 0,100% 100%)}
  .envl .fl::after{content:"";position:absolute;inset:14% 12% 0;background:linear-gradient(#E9A8BB,#D98BA3);clip-path:polygon(0 100%,50% 0,100% 100%)}
  .envl .bk{position:absolute;inset:0;background:var(--ol-d);border-radius:.8cqw}
  .envl .ph{position:absolute;left:9%;right:9%;bottom:28%;height:120%;background:#fff;padding:1.8cqw;box-shadow:0 1cqw 2.4cqw rgba(0,0,0,.18);transform:rotate(-1.5deg);cursor:zoom-in}
  .envl .ph img{width:100%;height:100%;object-fit:cover}
  .envl .fr{position:absolute;inset:0;border-radius:.8cqw;background:linear-gradient(170deg,var(--ol-l),var(--ol));
    clip-path:polygon(0 0,50% 46%,100% 0,100% 100%,0 100%);box-shadow:inset 0 -1cqw 2cqw rgba(0,0,0,.12)}
  .envl .fr::after{content:"";position:absolute;inset:0;background:
    linear-gradient(to top right,transparent 49.5%,rgba(0,0,0,.12) 50%,transparent 50.6%) left/50% 100% no-repeat,
    linear-gradient(to top left,transparent 49.5%,rgba(0,0,0,.12) 50%,transparent 50.6%) right/50% 100% no-repeat}
  .hseal{position:absolute;left:50%;width:15cqw;margin-left:-7.5cqw;z-index:3;cursor:pointer;filter:drop-shadow(0 .6cqw .8cqw rgba(60,50,20,.35))}
  .envl .hseal{top:34%}
  .bq{position:absolute;pointer-events:none;z-index:4}
  .envl .bq.r{right:-13cqw;top:-14cqw;width:34cqw}
  .envl .bq.l{left:-9cqw;top:-24cqw;width:20cqw}
  .pearls{position:absolute;left:4cqw;top:-30cqw;width:26cqw;z-index:4;pointer-events:none}
  .namecard{width:70cqw;margin:12cqw auto 0}
  .namecard .script{font-size:15cqw;line-height:1.05}
  .namecard .kick{font-size:4.2cqw;letter-spacing:.3em;text-transform:uppercase;color:var(--ink);margin-bottom:2cqw;padding-left:.3em}
  .namecard .dt{font-size:6.4cqw;letter-spacing:.12em;color:var(--ink);margin:3cqw 0 2cqw}
  .namecard p{font-size:4.3cqw;line-height:1.45}

  /* óvalo repujado */
  .oval{position:relative;width:66cqw;height:86cqw;margin:0 auto;border-radius:50%;padding:4.6cqw;background:var(--ol);
    box-shadow:inset .7cqw .9cqw 1.4cqw rgba(0,0,0,.22),inset -.7cqw -.9cqw 1.4cqw rgba(255,255,255,.12),0 0 0 .5cqw rgba(255,255,255,.06)}
  .oval::before{content:"";position:absolute;inset:1.8cqw;border-radius:50%;border:.55cqw dotted rgba(255,255,255,.3);pointer-events:none}
  .oval::after{content:"";position:absolute;inset:-2.6cqw;border-radius:50%;border:.4cqw dotted rgba(255,255,255,.18);pointer-events:none}
  .oval img{width:100%;height:100%;object-fit:cover;border-radius:50%;box-shadow:0 0 0 .6cqw var(--ol-l),0 .8cqw 1.6cqw rgba(0,0,0,.25);cursor:zoom-in}
  .green .story{margin-top:9cqw}
  .green .story p + p{margin-top:4cqw}
  .fam{display:flex;flex-wrap:wrap;justify-content:center;gap:5cqw 8cqw;margin:8cqw 0 2cqw}
  .fam > div{flex:0 0 40%;font-size:4.6cqw;line-height:1.4;color:#F3F1E4}
  .fam h3{font-size:3.2cqw;letter-spacing:.26em;text-transform:uppercase;font-weight:500;margin-bottom:1.6cqw;opacity:.85}
  .place{width:76cqw;margin:9cqw auto 0}
  .place .in{padding:8cqw 6cqw}
  .place h3{font-family:"Pinyon Script",cursive;font-weight:400;font-size:9cqw;color:var(--ink);line-height:1.1}
  .place .t{font-size:4.2cqw;color:var(--ink);margin-top:1cqw}
  .place .l{font-size:4.4cqw;color:var(--txt)}
  .place .a{font-size:4cqw;color:var(--txt);opacity:.85;margin-bottom:3.6cqw}
  .place .bq{right:-12cqw;bottom:-6cqw;width:26cqw}

  /* galería y vestimenta en papel claro */
  .ghint{font-size:3.3cqw;letter-spacing:.16em;color:var(--ink);opacity:.75;margin-top:1.4cqw}
  .dots{display:flex;justify-content:center;gap:2.4cqw;margin:5cqw 0 1cqw}
  .dress{display:flex;justify-content:center;gap:10cqw;margin-top:5cqw}
  .dress svg{width:11cqw;height:19cqw;color:var(--ink)}

  /* itinerario dentro de sobre */
  .envt{position:relative;width:80cqw;margin:6cqw auto 0;padding-top:14cqw}
  .envt .bk{position:absolute;left:0;right:0;top:0;height:46cqw;background:var(--ol-d);border-radius:.8cqw;box-shadow:0 1.6cqw 3cqw rgba(60,60,30,.25)}
  .envt .bk::after{content:"";position:absolute;inset:0;background:var(--ol);clip-path:polygon(0 0,100% 0,50% 70%);border-radius:.8cqw}
  .envt .bk::before{content:"";position:absolute;left:0;right:0;top:0;height:2.2cqw;background:radial-gradient(circle at 50% 0,rgba(0,0,0,.18) 40%,transparent 42%) 0 0/2.4cqw 2.2cqw repeat-x;z-index:2}
  .envt .tcard{position:relative;width:66cqw;margin:0 auto;z-index:2}
  .envt .tcard .in{padding:13cqw 6cqw 8cqw}
  .envt .hseal{top:-5cqw}
  .tl{display:grid;grid-template-columns:12cqw 4cqw 1fr;align-items:center;gap:1cqw 2cqw;margin-top:5cqw;text-align:left;position:relative}
  .tl::before{content:"";position:absolute;left:calc(12cqw + 2cqw + 2cqw - .5px);top:3cqw;bottom:3cqw;width:1px;background:rgba(111,122,64,.45)}
  .tl .ic{width:10cqw;height:10cqw;color:var(--ink);justify-self:end}
  .tl .dt{width:1.8cqw;height:1.8cqw;border-radius:50%;background:var(--ink);justify-self:center;position:relative;z-index:1}
  .tl .tx{padding:2cqw 0;font-size:3.9cqw;line-height:1.25;color:var(--txt)}
  .tl .tx b{display:block;font-weight:500;color:var(--ink);font-size:3.6cqw;letter-spacing:.04em}

  /* cuenta regresiva */
  .count{display:flex;justify-content:center;align-items:flex-start;gap:1.4cqw;margin-top:3cqw;color:var(--ink)}
  .count > div{display:flex;flex-direction:column;align-items:center;min-width:13cqw}
  .count b{display:block;font-family:"Cormorant Garamond",serif;font-weight:400;font-size:12cqw;line-height:1;font-variant-numeric:tabular-nums;transform-style:preserve-3d}
  .count span{font-size:2.4cqw;letter-spacing:.24em;text-transform:uppercase;margin-top:1cqw}
  .count i{font-style:normal;font-size:10cqw;line-height:1.05}
  .cal{display:flex;flex-wrap:wrap;justify-content:center;gap:2.4cqw;margin-top:5cqw}

  /* confirmación */
  .envc{position:relative;width:70cqw;height:48cqw;margin:30cqw auto 6cqw}
  .envc .bk{position:absolute;inset:0;background:var(--ol-d);border-radius:.8cqw}
  .envc .fl{position:absolute;left:0;right:0;bottom:64%;height:42%;background:var(--ol-d);clip-path:polygon(0 100%,50% 0,100% 100%)}
  .envc .fl::after{content:"";position:absolute;inset:14% 12% 0;background:linear-gradient(#E9A8BB,#D98BA3);clip-path:polygon(0 100%,50% 0,100% 100%)}
  .envc .cd{position:absolute;left:8%;right:8%;bottom:36%;height:104%;background:var(--paper);box-shadow:0 1cqw 2cqw rgba(0,0,0,.15);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5cqw;gap:2.4cqw;outline:1px solid rgba(160,150,110,.35);outline-offset:-1.6cqw}
  .envc .cd strong{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:5.4cqw;letter-spacing:.14em;color:var(--ink);line-height:1.15;text-transform:uppercase}
  .envc .fr{position:absolute;inset:0;border-radius:.8cqw;background:linear-gradient(170deg,var(--ol-l),var(--ol));clip-path:polygon(0 0,50% 46%,100% 0,100% 100%,0 100%)}
  .envc .hseal{top:40%}
  .envc .bq.r{right:-14cqw;top:-8cqw;width:32cqw}
  .rsvp-intro{width:74cqw;margin:0 auto}
  .rsvp-intro .in{padding:8cqw 7cqw;font-size:4.4cqw;line-height:1.5}
  .rsvp-intro .bq{right:-10cqw;bottom:-12cqw;width:24cqw}
  .rsvp{display:flex;flex-direction:column;gap:3.2cqw;margin:10cqw auto 0;max-width:80cqw;text-align:left;background:#FFFDF9;
    padding:7cqw 6cqw;border-radius:2cqw;box-shadow:0 1.6cqw 4cqw rgba(70,60,30,.12)}
  .rsvp label.q{font-size:3.8cqw;font-weight:500;color:var(--ink);margin-top:1.4cqw}
  .rsvp input[type=text],.rsvp textarea{font:inherit;font-size:4.4cqw;color:#5C5A44;background:#fff;border:1px solid #CFCBB2;border-radius:1.6cqw;
    padding:2.6cqw 3.2cqw;outline:none;width:100%;resize:none}
  .rsvp input:focus,.rsvp textarea:focus{border-color:var(--ink);box-shadow:0 0 0 .6cqw rgba(111,122,64,.14)}
  .opt{display:block;position:relative;cursor:pointer}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt span{display:block;padding:2.4cqw 3.4cqw;border-radius:1.4cqw;background:#ECEEE2;font-size:4.2cqw;color:#5E6440;transition:background .25s,color .25s}
  .opt input:checked + span{background:var(--ol);color:#fff}
  .opt input:focus-visible + span{outline:2px solid var(--ink)}
  .stepper{display:flex;align-items:center;justify-content:space-between;background:#ECEEE2;border-radius:1.4cqw;padding:1.4cqw 2cqw 1.4cqw 3.4cqw;font-size:4.2cqw;color:#5E6440}
  .stepper div{display:flex;align-items:center;gap:3cqw}
  .stepper button{width:8.4cqw;height:8.4cqw;border-radius:50%;border:1px solid var(--ink);background:#fff;color:var(--ink);font-size:4.6cqw;cursor:pointer;line-height:1}
  .stepper b{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:5.6cqw;min-width:6cqw;text-align:center;color:var(--ink)}
  .btn-wa{display:block;text-align:center;margin-top:2cqw;padding:3cqw;border-radius:99px;background:var(--ol);color:#fff;text-decoration:none;
    font-size:4cqw;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 1cqw 2.4cqw rgba(90,100,50,.3)}

  /* cierre con paisaje */
  .closing{position:relative;height:84cqw;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFFDF6}
  .closing{background:linear-gradient(rgba(40,48,18,.22),rgba(40,48,18,.38)),var(--papel) center/cover}
  .closing > :not(img){position:relative;z-index:1}
  .cl-ramo{position:absolute;top:-6cqw;width:22cqw;height:auto;filter:drop-shadow(0 1cqw 1.4cqw rgba(0,0,0,.3))}
  .cl-ramo.l{left:-4cqw;transform:rotate(-8deg)}
  .cl-ramo.r{right:-4cqw;transform:scaleX(-1) rotate(-8deg)}
  .cl-seal{position:relative;width:13cqw;margin-top:5cqw;filter:drop-shadow(0 .6cqw .8cqw rgba(0,0,0,.35))}
  .closing small{font-size:3.6cqw;letter-spacing:.2em;text-shadow:0 0 2cqw rgba(60,60,40,.5)}
  .closing .nm{font-family:"Cormorant Garamond",serif;font-size:8cqw;letter-spacing:.2em;padding-left:.2em;text-shadow:0 0 2cqw rgba(60,60,40,.5);position:relative}
  .closing .nm i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:"Pinyon Script",cursive;font-style:normal;font-size:15cqw;letter-spacing:0;opacity:.55}
  .inv-wm{position:absolute;bottom:3cqw;left:0;right:0;font-size:2.6cqw;letter-spacing:.24em;color:rgba(255,255,255,.85);text-shadow:0 0 1cqw rgba(0,0,0,.35)}
  .rv{opacity:0;transform:translateY(5cqw)}
  /* cierre: monograma XV que se dibuja + despedida */
  .closing2{position:relative;padding:18cqw 9cqw 16cqw;text-align:center;overflow:hidden;
    background:radial-gradient(ellipse 80% 60% at 50% 40%,#FBF9F3,#F1EEE6)}
  .c2-mono{width:46cqw;height:46cqw;margin:0 auto;display:block;overflow:visible}
  .c2-mono path,.c2-mono text{fill:none;stroke:#6F7A40;stroke-width:.9;stroke-linejoin:round}
  .c2-mono text{font-family:"Bodoni Moda",serif;font-weight:400;fill:#6F7A40;fill-opacity:0;stroke-width:.6}
  .c2-script{font-family:"Pinyon Script",cursive;font-size:14cqw;color:#6F7A40;line-height:1.1;margin-top:4cqw}
  .c2-sub{font-size:4.6cqw;font-style:italic;color:#77745C;margin-top:1cqw}
  .c2-name{margin-top:7cqw;font-size:4cqw;letter-spacing:.42em;padding-left:.42em;color:#6F7A40;display:flex;flex-direction:column;align-items:center;gap:1.6cqw}
  .c2-name span{font-size:3.4cqw;letter-spacing:.2em;color:#8B8A6E}
  .c2-name::before{content:"";width:22cqw;height:1px;background:rgba(111,122,64,.5);margin-bottom:4cqw}
  .c2-ramo{position:absolute;top:8cqw;width:24cqw;height:auto;pointer-events:none;filter:drop-shadow(0 1cqw 1.4cqw rgba(50,50,30,.18))}
  .c2-ramo.l{left:-7cqw;transform:scaleX(-1) rotate(-6deg)}
  .c2-ramo.r{right:-7cqw;transform:rotate(-6deg)}
  .c2-wm{margin-top:12cqw;font-size:2.6cqw;letter-spacing:.24em;color:#9A987F}

  /* =================== EXTRAS INTERACTIVOS / 3D =================== */
  /* Puertas de palacio 3D (transición portada → invitación) */
  #doors{position:absolute;inset:0;z-index:58;perspective:150cqw;visibility:hidden;pointer-events:none}
  .door{position:absolute;top:0;width:50.2%;height:100%;transform-style:preserve-3d;backface-visibility:hidden;
    background:
      radial-gradient(ellipse 120% 60% at 50% 45%, rgba(255,255,255,.08), rgba(0,0,0,.25)),
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 .4cqw, rgba(255,255,255,.03) .4cqw 1.1cqw),
      #4C5A36;box-shadow:inset 0 0 6cqw rgba(0,0,0,.35)}
  .door.l{left:0;transform-origin:0 50%}
  .door.r{right:0;transform-origin:100% 50%}
  .door .dp{position:absolute;inset:9cqh 6cqw 7cqh;border:1px solid rgba(230,232,207,.6);border-radius:22cqw 22cqw 1cqw 1cqw}
  .door .dp::before{content:"";position:absolute;inset:1.6cqw;border:1px solid rgba(201,161,90,.55);border-radius:20cqw 20cqw .6cqw .6cqw}
  .door .dp::after{content:"";position:absolute;left:50%;top:38%;width:9cqw;height:9cqw;margin-left:-4.5cqw;opacity:.7;
    background:url("../../assets/estrella.svg") center/contain no-repeat}
  .door .knob{position:absolute;top:52%;width:3.4cqw;height:3.4cqw;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#F6E3A8,#C9A15A 55%,#7E6230);box-shadow:0 .4cqw .8cqw rgba(0,0,0,.4)}
  .door.l .knob{right:3cqw}.door.r .knob{left:3cqw}
  .door .shade{position:absolute;inset:0;background:#000;opacity:0}
  .seal{position:absolute;left:50%;top:50%;width:34cqw;height:34cqw;margin:-17cqw 0 0 -17cqw;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#FBF6EA,#EDE4CF);box-shadow:0 1.5cqw 5cqw rgba(0,0,0,.45),inset 0 0 0 1.2cqw #F6EEDC,inset 0 0 0 1.5cqw #C9A15A;
    display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--name)}
  .seal svg{width:15cqw;height:auto}
  .seal b{font-family:"Bodoni Moda",serif;font-weight:400;font-size:10cqw;line-height:1;letter-spacing:.04em}
  .seal span{font-size:2.6cqw;letter-spacing:.3em;margin-top:1cqw;color:var(--serif)}

  /* Pétalos 3D y destellos al tocar */
  #petals,#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #petals{z-index:52;visibility:hidden;perspective:80cqw}
  #fx{z-index:53}
  .petal{position:absolute;left:0;top:0;width:4.2cqw;height:5.4cqw}
  .petal svg{width:100%;height:100%;display:block}
  .burst{position:absolute;width:3.4cqw;height:3.4cqw;margin:-1.7cqw 0 0 -1.7cqw}

  /* Música */
  #musicBtn{position:absolute;z-index:55;top:calc(3cqw + env(safe-area-inset-top,0px));right:3.5cqw;
    width:12cqw;height:12cqw;border-radius:50%;border:1px solid rgba(158,52,96,.35);cursor:pointer;
    background:rgba(255,252,246,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    box-shadow:0 1cqw 3cqw rgba(60,40,40,.18);display:flex;align-items:center;justify-content:center;
    visibility:hidden;opacity:0;padding:0}
  #musicBtn svg{width:7.4cqw;height:7.4cqw}
  #musicBtn .slash{opacity:0;transition:opacity .3s}
  #musicBtn.off .slash{opacity:1}
  #musicBtn .bars rect{transform-box:fill-box;transform-origin:50% 100%}
  #musicTip{position:absolute;z-index:55;top:calc(5.6cqw + env(safe-area-inset-top,0px));right:17.5cqw;
    font-size:3cqw;letter-spacing:.12em;color:var(--serif);background:rgba(255,252,246,.85);padding:1cqw 2.4cqw;border-radius:99px;
    opacity:0;visibility:hidden;white-space:nowrap}

  .tilt{transform-style:preserve-3d;will-change:transform}

  /* Galería 3D (carrusel en anillo) */
  .g3d{position:relative;height:96cqw;margin:4cqw -9cqw 0;perspective:170cqw;touch-action:pan-y;cursor:grab;user-select:none}
  .g3d:active{cursor:grabbing}
  .ring{position:absolute;left:50%;top:46%;width:46cqw;height:62cqw;margin:-31cqw 0 0 -23cqw;transform-style:preserve-3d}
  .gitem{position:absolute;inset:0;margin:0;border-radius:23cqw 23cqw 1.6cqw 1.6cqw;overflow:hidden;
    border:1cqw solid #FFFDF8;box-shadow:0 0 0 .4cqw #C9A15A,0 3cqw 6cqw rgba(60,45,35,.28);background:#ddd;
    -webkit-box-reflect:below 2cqw linear-gradient(transparent 72%, rgba(255,255,255,.28))}
  .gitem img{width:100%;height:100%;object-fit:cover;pointer-events:none}
  .ghint{font-size:3.3cqw;letter-spacing:.18em;opacity:.75;margin-top:1cqw}
  .gdots{display:flex;justify-content:center;gap:2.4cqw;margin-top:1cqw}
  .gdots i{width:2cqw;height:2cqw;border-radius:50%;border:1px solid var(--name);transition:background .3s}
  .gdots i.on{background:var(--name)}

  /* Visor de fotos */
  #lightbox{position:absolute;inset:0;z-index:60;background:rgba(24,20,16,.94);visibility:hidden;opacity:0;
    display:flex;align-items:center;justify-content:center;touch-action:none}
  #lightbox img{max-width:90cqw;max-height:78cqh;border-radius:1.6cqw;box-shadow:0 3cqw 8cqw rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none}
  #lightbox button{position:absolute;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;
    width:11cqw;height:11cqw;border-radius:50%;font-size:5.5cqw;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  #lbClose{top:calc(4cqw + env(safe-area-inset-top,0px));right:4cqw}
  #lbPrev{left:3cqw;top:50%;margin-top:-5.5cqw}#lbNext{right:3cqw;top:50%;margin-top:-5.5cqw}
  #lbCount{position:absolute;bottom:calc(5cqw + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:rgba(255,255,255,.8);
    font-size:3.4cqw;letter-spacing:.3em}

  /* =================== SOBRE CON SELLO DE CERA (antes de las puertas) =================== */
  #envelope{position:absolute;inset:0;z-index:57;visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 45%, rgba(30,36,20,.35), rgba(16,20,10,.78));touch-action:none}
  .env{position:relative;width:80cqw;height:54cqw;perspective:320cqw;transform-style:preserve-3d}
  .env-back{position:absolute;inset:0;border-radius:1.4cqw;background:linear-gradient(160deg,#E9DFC8,#DCCFB2);
    box-shadow:0 4cqw 9cqw rgba(0,0,0,.45)}
  .env-card{position:absolute;left:5cqw;right:5cqw;top:3cqw;height:48cqw;border-radius:1cqw;background:#FFFDF8;
    box-shadow:0 .5cqw 2cqw rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    border:1px solid #E5DCC6}
  .env-card::before{content:"";position:absolute;inset:1.8cqw;border:1px solid rgba(201,161,90,.6);border-radius:.6cqw;pointer-events:none}
  .env-card small{font-size:3.2cqw;letter-spacing:.3em;color:var(--serif);text-transform:uppercase}
  .env-card b{font-family:"Pinyon Script",cursive;font-weight:400;font-size:12cqw;color:var(--name);line-height:1.15}
  .env-card span{font-size:3.4cqw;color:var(--serif);font-style:italic}
  .env-front{position:absolute;inset:0;border-radius:1.4cqw;pointer-events:none;
    background:linear-gradient(170deg,#EFE6D0,#E2D6BB);
    clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);
    box-shadow:inset 0 -1cqw 3cqw rgba(0,0,0,.08)}
  .env-front::after{content:"";position:absolute;inset:0;background:
    linear-gradient(to top right, transparent 49.6%, rgba(150,130,95,.25) 50%, transparent 50.4%) left/50% 100% no-repeat,
    linear-gradient(to top left, transparent 49.6%, rgba(150,130,95,.25) 50%, transparent 50.4%) right/50% 100% no-repeat}
  .env-flap{position:absolute;left:0;right:0;top:0;height:62%;transform-origin:50% 0;transform-style:preserve-3d;z-index:3}
  .env-flap i{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);backface-visibility:hidden}
  .env-flap .out{background:linear-gradient(180deg,#E6DBC1,#D8CAA9)}
  .env-flap .in{background:linear-gradient(180deg,#F3ECDC,#E9DFC8);transform:rotateX(180deg)}
  .wax{position:absolute;left:50%;top:62%;width:17cqw;height:17cqw;margin:-8.5cqw 0 0 -8.5cqw;z-index:4;border-radius:50%;cursor:pointer;
    background:radial-gradient(circle at 38% 32%,#C8577E,#9E3460 48%,#6E1F40);
    box-shadow:0 .8cqw 2cqw rgba(60,10,30,.45),inset 0 0 0 1.1cqw rgba(255,255,255,.08),inset 0 -.6cqw 1.2cqw rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;font-family:"Bodoni Moda",serif;color:#F7D7E2;font-size:6.4cqw;
    text-shadow:0 -.15cqw 0 rgba(0,0,0,.35),0 .15cqw 0 rgba(255,255,255,.25);border:0}
  .wax::before{content:"";position:absolute;inset:1.6cqw;border-radius:50%;border:1px dashed rgba(255,220,235,.45)}
  .env-hint{margin-top:9cqw;color:#F4EEDC;font-size:3.6cqw;letter-spacing:.24em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2cqw}
  .env-hint svg{width:6cqw;height:6cqw}

  /* =================== PALETA DE VESTIMENTA =================== */
  .dress svg{transition:color .6s}
  .dress svg path{transition:fill .6s}
  .swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:3.4cqw;margin-top:6cqw;perspective:90cqw}
  .sw{position:relative;width:15cqw;height:15cqw;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d}
  .sw .f,.sw .b{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;display:flex;align-items:center;justify-content:center}
  .sw .f{background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.14) 0 .5cqw, rgba(0,0,0,.05) .5cqw 1cqw),
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.45), transparent 55%), var(--c);
    box-shadow:0 1.2cqw 2.4cqw rgba(60,45,35,.28), inset 0 0 0 .5cqw rgba(255,255,255,.55)}
  .sw .b{background:#FFFDF8;transform:rotateY(180deg);font-size:2.7cqw;line-height:1.1;color:var(--serif);padding:1cqw;text-align:center;
    box-shadow:0 1.2cqw 2.4cqw rgba(60,45,35,.2), inset 0 0 0 .5cqw var(--c)}
  .sw.on .f{box-shadow:0 1.2cqw 2.4cqw rgba(60,45,35,.28), inset 0 0 0 .5cqw rgba(255,255,255,.55), 0 0 0 .7cqw #FFFDF8, 0 0 0 1cqw var(--name)}
  .swname{margin-top:4cqw;font-size:4.6cqw;font-style:italic;min-height:6cqw}
  .reserved{display:inline-flex;align-items:center;gap:2.4cqw;margin-top:3cqw;font-size:4.2cqw;padding:1.6cqw 3.6cqw 1.6cqw 1.6cqw;
    border:1px dashed #C9C3A4;border-radius:99px;background:rgba(255,255,255,.5)}
  .reserved i{position:relative;width:7cqw;height:7cqw;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 .4cqw rgba(255,255,255,.6)}
  .reserved i::after{content:"";position:absolute;left:-10%;right:-10%;top:50%;height:.5cqw;margin-top:-.25cqw;background:var(--name);transform:rotate(-40deg);border-radius:1cqw}

  /* ---- ajustes de estilo olivo para piezas interactivas ---- */
  .gitem{box-shadow:0 0 0 .4cqw var(--ol),0 3cqw 6cqw rgba(60,60,30,.25)}
  .gdots i{border-color:var(--ink)} .gdots i.on{background:var(--ink)}
  .sw{width:11cqw;height:11cqw}
  .sw.on .f{box-shadow:0 1cqw 2cqw rgba(60,45,35,.28), inset 0 0 0 .4cqw rgba(255,255,255,.55), 0 0 0 .6cqw #FFFDF8, 0 0 0 .9cqw var(--ink)}
  .swatches{gap:2.6cqw;margin-top:4cqw}
  .swname{color:var(--ink)}
  .reserved i::after{background:var(--ink)}
  #musicBtn{top:0;right:4cqw;width:13cqw;height:14cqw;border-radius:0 0 3cqw 3cqw;background:#7B8A4B;border:0;box-shadow:0 1cqw 2.4cqw rgba(60,60,30,.25)}
  #musicBtn .bars rect{fill:#FFFDF6}
  #musicBtn path{stroke:#E8E2C8}
  #musicTip{color:#6F7A40;right:19cqw;top:4cqw}
  /* sobre de apertura en olivo con sello de corazón */
  .env-back{background:linear-gradient(160deg,#6E7D41,#5F6D36)}
  .env-front{background:linear-gradient(170deg,#8E9C5E,#7B8A4B)}
  .env-front::after{opacity:.6}
  .env-flap .out{background:linear-gradient(180deg,#7B8A4B,#6A783D)}
  .env-flap .in{background:linear-gradient(180deg,#E9A8BB,#D98BA3)}
  .env-card b{color:#6F7A40}
  .wax{width:19cqw;height:17cqw;margin:-8.5cqw 0 0 -9.5cqw;border-radius:0;background:radial-gradient(circle at 40% 35%,#FBF6EA,#E7DCC4 65%,#CDBE9C);
    color:#A8976E;font-family:"Pinyon Script",cursive;font-size:6cqw;text-shadow:0 .15cqw 0 rgba(255,255,255,.7),0 -.1cqw 0 rgba(0,0,0,.15);box-shadow:none;
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 54'><path d='M30 53 C 8 37 0 25 4 13 C 8 2 22 0 30 11 C 38 0 52 2 56 13 C 60 25 52 37 30 53Z'/></svg>") center/contain no-repeat;
            mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 54'><path d='M30 53 C 8 37 0 25 4 13 C 8 2 22 0 30 11 C 38 0 52 2 56 13 C 60 25 52 37 30 53Z'/></svg>") center/contain no-repeat}
  .wax::before{display:none}

  /* =================== SOBRE DE APERTURA (imagen real: sobre olivo + ramo blanco + sello dorado) =================== */
  #envelope{background:radial-gradient(ellipse 90% 70% at 50% 42%,#FCFAF5,#EEE9DF)!important;flex-direction:column}
  #envelope::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.06;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

<script>
const CONFIG = window.CONFIG;   // los datos viven en config.js

(() => {
  "use strict";
  const REEL = new URLSearchParams(location.search).get("reel") === "1";
  if (REEL) document.body.classList.add("reel");
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const stage = $("#stage");
  const rand = gsap.utils.random;
  gsap.registerPlugin(MotionPathPlugin);

  /* ---------- Arco de palacio: cúpula + cuello cóncavo + hombros redondeados (viewBox 100x140) ---------- */
  const ARCH = "M0 140 L0 47 C0 39 4 34 11 33 L19 33 C23 33 25 31 25 27 C25 11 36 0 50 0 C64 0 75 11 75 27 C75 31 77 33 81 33 L89 33 C96 34 100 39 100 47 L100 140 Z";
  const archSVG = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 140' preserveAspectRatio='none'><path d='${ARCH}' fill='black'/></svg>`;
  $("#win").style.setProperty("--arch", `url("data:image/svg+xml;utf8,${encodeURIComponent(archSVG)}")`);
  $("#rimPath").setAttribute("d", ARCH);

  /* ---------- Textos ---------- */
  const kicker = $("#kicker");
  kicker.setAttribute("aria-label", CONFIG.textoSuperior);
  kicker.innerHTML = [...CONFIG.textoSuperior].map(c =>
    `<span class="ch" aria-hidden="true">${c === " " ? "&nbsp;" : c}</span>`).join("");
  $("#name1").textContent = CONFIG.quinceanera;
  $("#frase").textContent = CONFIG.frase;
  $("#fecha").textContent = CONFIG.fecha;
  $(".g1").textContent = CONFIG.iniciales[0];
  $(".g2").textContent = CONFIG.iniciales[1];
  $(".g2u").textContent = CONFIG.iniciales[1];
  $("#watermark").textContent = CONFIG.marcaDeAgua;
  $("#sealName").textContent = CONFIG.quinceanera.toUpperCase();
  $("#envKick").textContent = CONFIG.textoSuperior;
  $("#envName").textContent = CONFIG.quinceanera;
  $("#sealText").textContent = CONFIG.iniciales.join("");
  document.title = `${CONFIG.textoSuperior} · ${CONFIG.quinceanera}`;


  /* ---------- Invitación: render desde CONFIG ---------- */
  function renderInvitacion() {
    const E = CONFIG.evento, A = CONFIG.assetsPath, esc = x => String(x).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    const paleta = E.paleta || [{ color: "#5E6B32", nombre: "Verde olivo" }, { color: "#7B8A4B", nombre: "Oliva" }, { color: "#9DA77A", nombre: "Salvia" }, { color: "#B8BC8E", nombre: "Pistache" }, { color: "#DCD8C2", nombre: "Marfil" }];
    const reservado = E.reservado === undefined ? null : E.reservado;
    // ---------- piezas gráficas (SVG generado: alcatraces, sello de corazón, perlas, íconos) ----------
    let uid = 0;
    const heart = () => `<img class="hseal gold" src="${A}sello_oro.png" alt="">`;
    const calla = (x, y, rot, sc, k) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})"><path d="M0 0 C -15 -10 -17 -40 2 -64 C 12 -48 20 -32 15 -13 C 11 -4 6 -1 0 0Z" fill="url(#cp${k})"/><path d="M2 -60 C -6 -46 -8 -26 0 -6" stroke="rgba(255,255,255,.55)" stroke-width="1.6" fill="none"/><path d="M1 -3 C 0 -16 2 -30 6 -40" stroke="#E7C34E" stroke-width="3" stroke-linecap="round" fill="none"/></g>`;
    const bouquet = cls => `<img class="bq ${cls}" src="${A}ramo_blanco.png" alt="">`;
    const pearls = () => { let g = `<svg class="pearls" viewBox="0 0 110 120" aria-hidden="true"><defs><radialGradient id="pr"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#DCD6CA"/></radialGradient></defs><path d="M8 8 C 40 50 70 30 104 8" stroke="#D8CFC0" stroke-width=".6" fill="none"/>`;
      for (let i = 0; i <= 22; i++) { const t = i / 22, x = 8 + 96 * t, y = 8 + Math.sin(t * Math.PI) * 30; g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="url(#pr)"/>`; }
      for (let i = 0; i < 14; i++) g += `<circle cx="56" cy="${40 + i * 5.4}" r="${i === 13 ? 4 : 2.4}" fill="url(#pr)"/>`;
      g += `<path d="M48 36 C 42 26 54 24 56 34 C 58 24 70 26 64 36 C 60 40 52 40 48 36Z" fill="#F4EEE4" stroke="#D8CFC0" stroke-width=".6"/>`;
      return g + `</svg>`; };
    const divider = `<svg class="divider" viewBox="0 0 200 20" aria-hidden="true"><path d="M4 10 H80 M120 10 H196" stroke="currentColor" stroke-width=".8"/><path d="M100 3 C 94 8 94 12 100 17 C 106 12 106 8 100 3Z M86 10 C 90 6 95 7 97 10 C 95 13 90 14 86 10Z M114 10 C 110 6 105 7 103 10 C 105 13 110 14 114 10Z" fill="none" stroke="currentColor" stroke-width=".8"/></svg>`;
    const icons = {
      misa: `<path d="M24 4v7M20.5 7.5h7M13 44V24l11-9 11 9v20M5 44V31l8-5M43 44V31l-8-5M3 44h42M20 44v-7a4 4 0 0 1 8 0v7"/>`,
      copa: `<path d="M13 6h9l-1 11a3.5 3.5 0 0 1-7 0zM26 6h9l-1 11a3.5 3.5 0 0 1-7 0zM17.5 21v15M30.5 21v15M13 40h9M26 40h9M21 3l3-2 3 2"/>`,
      vals: `<circle cx="19" cy="9" r="3.4"/><circle cx="30" cy="10" r="3.2"/><path d="M19 13 C 14 22 12 32 8 44 H 30 C 26 32 24 22 21 13M30 14 V 30 M27 30 h6 M26 44 L 30 30 L 34 44M21 18 C 25 19 27 18 30 16"/>`,
      cena: `<circle cx="24" cy="26" r="11"/><circle cx="24" cy="26" r="6.5"/><path d="M6 14v8a3 3 0 0 0 3 3v14M9 14v8M12 14v8M40 14c-3 2-4 6-4 11h4v14"/>`,
      baile: `<path d="M24 4 L26.5 13 L36 13 L28.5 18.5 L31.5 28 L24 22 L16.5 28 L19.5 18.5 L12 13 L21.5 13Z"/><path d="M10 34 l2 4 4 1-4 2-1 4-2-4-4-1 4-2zM38 32 l1.5 3 3 .8-3 1.5-.8 3-1.5-3-3-.8 3-1.5z"/>`,
      otro: `<path d="M24 8 C 18 18 18 30 24 40 C 30 30 30 18 24 8Z M10 24 H 38"/>`
    };
    const iconFor = w => { const t = w.toLowerCase(); const k = /misa|ceremon|iglesia/.test(t) ? "misa" : /recep|brindis|cóctel|coctel/.test(t) ? "copa" : /vals|primer baile/.test(t) ? "vals" : /cena|banquete/.test(t) ? "cena" : /bail|fiesta|fin/.test(t) ? "baile" : "otro";
      return `<svg class="ic" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">${icons[k]}</svg>`; };
    const fd = new Date(E.fechaISO), dd = `${String(fd.getDate()).padStart(2, "0")} . ${String(fd.getMonth() + 1).padStart(2, "0")} . ${String(fd.getFullYear()).slice(2)}`;
    const historia = E.historia && E.historia.length ? E.historia : [E.mensaje];
    const place = c => `<div class="scal place rv tilt"><div class="in">
        <h3>${esc(c.titulo)}</h3><div class="t">Hora: ${esc(c.hora)}</div><div class="l">${esc(c.lugar)}</div><div class="a">${esc(c.direccion)}</div>

  /* ---------- Galería 3D en anillo ---------- */
  function initGallery() {
    const g = $("#g3d"), ring = $("#ring"), items = $$(".gitem", ring), dots = $$("#gdots i");
    const N = items.length, step = 360 / N, st = { a: 0 };
    let R = 0, auto, dragging = false, moved = 0, lastX = 0, vel = 0;
    const layout = () => {
      R = (ring.offsetWidth / 2) / Math.tan(Math.PI / N) * 1.35;
      items.forEach((it, i) => { it.style.transform = `rotateY(${i * step}deg) translateZ(${R}px)`; });   // orden: girar y luego alejar
      render();
    };
    const front = () => ((Math.round(-st.a / step) % N) + N) % N;
    function render() {
      gsap.set(ring, { z: -R, rotationY: st.a });
      items.forEach((it, i) => {
        const ang = ((i * step + st.a) % 360 + 540) % 360 - 180;          // -180..180, 0 = al frente
        const k = Math.cos(ang * Math.PI / 180);
        it.style.opacity = (.35 + .65 * Math.max(0, (k + 1) / 2)).toFixed(3);
        it.style.filter = `brightness(${(.55 + .45 * Math.max(0, k)).toFixed(3)})`;
      });
      const fi = front(); dots.forEach((d, i) => d.classList.toggle("on", i === fi));
    }
    const goTo = (a, d = 1) => gsap.to(st, { a, duration: d, ease: "power3.out", onUpdate: render, overwrite: true });
    const snap = a => Math.round(a / step) * step;
    const startAuto = () => {
      if (auto) auto.kill();
      auto = gsap.delayedCall(3.6, () => { if (!dragging && !$("#lightbox").classList.contains("on")) goTo(snap(st.a) - step, 1.3); startAuto(); });
    };
    g.addEventListener("pointerdown", e => { dragging = true; moved = 0; lastX = e.clientX; vel = 0; gsap.killTweensOf(st); g.setPointerCapture(e.pointerId); });
    g.addEventListener("pointermove", e => {
      if (!dragging) return;
      const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
      vel = dx; st.a += dx * .32; render();
    });
    const end = e => {
      if (!dragging) return; dragging = false;
      if (moved < 6) {                                   // toque → abrir foto
        const el = document.elementFromPoint(e.clientX, e.clientY)?.closest(".gitem");
        const i = el ? +el.dataset.i : front();
        if (i === front()) openLightbox(i); else goTo(snap(-i * step + Math.round((st.a + i * step) / 360) * 360));
      } else goTo(snap(st.a + vel * 4), 1.1);
      startAuto();
    };
    g.addEventListener("pointerup", end); g.addEventListener("pointercancel", end);
    dots.forEach((d, i) => d.addEventListener("click", () => goTo(snap(-i * step))));
    addEventListener("resize", layout);
    layout(); startAuto();
    gsap.to(ring, { y: "-=8", duration: 3, yoyo: true, repeat: -1, ease: "sine.inOut" });
  }

  /* ---------- Visor de fotos ---------- */
  let lbIndex = 0;
  function openLightbox(i) {
    const lb = $("#lightbox"); lbIndex = i; showLb(0);
    lb.classList.add("on");
    gsap.set(lb, { visibility: "visible" });
    gsap.to(lb, { opacity: 1, duration: .35 });
    gsap.fromTo("#lbImg", { scale: .86, rotationY: -12, transformPerspective: 900 }, { scale: 1, rotationY: 0, duration: .6, ease: "power3.out" });
  }
  function closeLightbox() {
    const lb = $("#lightbox"); lb.classList.remove("on");
    gsap.to(lb, { opacity: 0, duration: .3, onComplete: () => gsap.set(lb, { visibility: "hidden" }) });
  }
  function showLb(dir) {
    const n = CONFIG.fotos.length; lbIndex = (lbIndex + dir + n) % n;
    const img = $("#lbImg");
    const swap = () => { img.src = CONFIG.fotos[lbIndex]; $("#lbCount").textContent = `${lbIndex + 1} / ${n}`; };
    if (!dir) return swap();
    gsap.timeline().to(img, { x: -dir * 60, opacity: 0, duration: .2, onComplete: swap })
      .fromTo(img, { x: dir * 60, opacity: 0 }, { x: 0, opacity: 1, duration: .3, ease: "power2.out" });
  }
  function initLightbox() {
    const lb = $("#lightbox");
    $("#lbPrev").addEventListener("click", e => { e.stopPropagation(); showLb(-1); });
    $("#lbNext").addEventListener("click", e => { e.stopPropagation(); showLb(1); });
    $("#lbClose").addEventListener("click", e => { e.stopPropagation(); closeLightbox(); });
    lb.addEventListener("click", e => { if (e.target === lb) closeLightbox(); });
    let sx = null;
    lb.addEventListener("pointerdown", e => { sx = e.clientX; });
    lb.addEventListener("pointerup", e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 40) showLb(dx < 0 ? 1 : -1); });
    addEventListener("keydown", e => {
      if (!lb.classList.contains("on")) return;
      if (e.key === "Escape") closeLightbox(); if (e.key === "ArrowRight") showLb(1); if (e.key === "ArrowLeft") showLb(-1);
    });
  }

  /* ---------- Inclinación 3D (dedo/ratón y giroscopio) ---------- */
  function initTilt() {
    const els = $$(".tilt");
    const qs = els.map(el => ({ el, rx: gsap.quickTo(el, "rotationX", { duration: .6, ease: "power3.out" }), ry: gsap.quickTo(el, "rotationY", { duration: .6, ease: "power3.out" }) }));
    els.forEach(el => gsap.set(el, { transformPerspective: 700 }));
    qs.forEach(({ el, rx, ry }) => {
      el.addEventListener("pointermove", e => {
        const r = el.getBoundingClientRect();
        ry(((e.clientX - r.left) / r.width - .5) * 16); rx(-((e.clientY - r.top) / r.height - .5) * 12);
      });
      el.addEventListener("pointerleave", () => { rx(0); ry(0); });
    });
    addEventListener("deviceorientation", e => {
      if (e.beta == null) return;
      const ry = gsap.utils.clamp(-12, 12, e.gamma * .5), rx = gsap.utils.clamp(-10, 10, (e.beta - 45) * -.3);
      qs.forEach(q => { q.rx(rx); q.ry(ry); });
    });
  }

  /* ---------- Pétalos que caen en 3D ---------- */
  function initPetals() {
    const box = $("#petals"), cols = [["#FFFFFF", "#E9E6DA"], ["#F4F6EA", "#D6DFB8"], ["#FBF8EE", "#E8E1C8"]];
    for (let i = 0; i < 16; i++) {
      const [a, b] = cols[i % 3], el = document.createElement("div");
      el.className = "petal";
      el.innerHTML = `<svg viewBox="0 0 20 26"><defs><linearGradient id="pg${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><path d="M10 1 C 17 6, 19 15, 10 25 C 1 15, 3 6, 10 1Z" fill="url(#pg${i})"/><path d="M10 4 C 10 12, 10 18, 10 23" stroke="${b}" stroke-width=".6" fill="none" opacity=".7"/></svg>`;
      box.appendChild(el);
      const W = () => box.clientWidth, H = () => box.clientHeight;
      gsap.set(el, { x: () => gsap.utils.random(0, W()), y: () => gsap.utils.random(-H() * .2, H()), scale: gsap.utils.random(.55, 1.1) });
      gsap.to(el, { y: () => H() + 60, x: () => `+=${gsap.utils.random(-W() * .25, W() * .25)}`, duration: () => gsap.utils.random(8, 14),
        ease: "none", repeat: -1, repeatRefresh: true, delay: -gsap.utils.random(0, 10),
        onRepeat() { gsap.set(el, { y: -40, x: gsap.utils.random(0, W()) }); } });
      gsap.to(el, { rotationX: () => gsap.utils.random(180, 540), rotationY: () => gsap.utils.random(-360, 360), rotationZ: () => gsap.utils.random(-180, 180),
        duration: () => gsap.utils.random(4, 8), ease: "sine.inOut", repeat: -1, yoyo: true, repeatRefresh: true });
    }
  }

  /* ---------- Destellos al tocar ---------- */
  function burst(x, y) {
    const fx = $("#fx");
    for (let i = 0; i < 9; i++) {
      const el = document.createElement("div");
      el.className = "burst";
      el.innerHTML = `<svg viewBox="-10 -10 20 20"><path d="M0 -10 C1 -2 2 -1 10 0 C2 1 1 2 0 10 C-1 2 -2 1 -10 0 C-2 -1 -1 -2 0 -10Z" fill="${i % 3 ? "#C9A15A" : "#B9C78A"}"/></svg>`;
      el.style.left = x + "px"; el.style.top = y + "px"; fx.appendChild(el);
      const a = i / 9 * Math.PI * 2 + Math.random() * .5, d = 30 + Math.random() * 45;
      gsap.fromTo(el, { scale: 0, rotation: 0 }, { x: Math.cos(a) * d, y: Math.sin(a) * d, scale: gsap.utils.random(.5, 1.1), rotation: 180,
        duration: .8, ease: "power2.out" });

  /* ---------- Música: canción propia o vals de caja musical generado (composición original) ---------- */
  const Musica = (() => {
    let ctx, master, timer, audio, intro, enIntro = false, on = false, nextT = 0, beat = 0;
    const BPM = 88, SPB = 60 / BPM;
    const mtof = n => 440 * Math.pow(2, (n - 69) / 12);
    // Re mayor, 3/4 — progresión de 8 compases y melodía original
    const chords = [[50, 62, 66, 69], [47, 62, 66, 71], [43, 62, 67, 71], [45, 61, 64, 69], [50, 62, 66, 69], [42, 61, 66, 69], [43, 62, 67, 71], [45, 61, 64, 67]];
    const melody = [[78, 76, 74], [74, 78, 83], [81, 79, 78], [76, 0, 73], [78, 81, 86], [85, 81, 78], [79, 78, 76], [76, 73, 69]];
    function reverb() {
      const len = ctx.sampleRate * 2.6, buf = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
      const cv = ctx.createConvolver(); cv.buffer = buf; return cv;
    }
    function bell(note, t, vel, dur = 1.8) {
      const g = ctx.createGain(); g.connect(master);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vel, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      [[1, 1], [2, .28], [3.01, .08]].forEach(([m, a]) => {
        const o = ctx.createOscillator(), og = ctx.createGain();
        o.type = "sine"; o.frequency.value = mtof(note) * m; og.gain.value = a;
        o.connect(og).connect(g); o.start(t); o.stop(t + dur + .05);
      });
    }
    function schedule() {
      while (nextT < ctx.currentTime + .25) {
        const bar = Math.floor(beat / 3) % 8, b = beat % 3, pass = Math.floor(beat / 24);
        const ch = chords[bar];
        if (b === 0) bell(ch[0], nextT, .22, 2.4); else bell(ch[b], nextT, .07, 1.2), bell(ch[b + 1] || ch[1], nextT + .01, .05, 1.2);
        const m = melody[bar][b];
        if (m) bell(m + (pass % 2 ? 12 : 0), nextT, pass % 2 ? .1 : .14, 2);
        if (pass % 2 && b === 2 && m) bell(m + 7, nextT + SPB / 2, .06, 1.2);   // adorno en la segunda vuelta
        nextT += SPB; beat++;
      }
    }
    function startSynth() {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (!master) {
        master = ctx.createGain(); master.gain.value = 0;
        const dry = ctx.createGain(), wet = ctx.createGain(), rv = reverb();
        dry.gain.value = .8; wet.gain.value = .45;
        master.connect(dry).connect(ctx.destination); master.connect(rv).connect(wet).connect(ctx.destination);
      }
      ctx.resume();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(.55, ctx.currentTime, .6);
      nextT = ctx.currentTime + .1; clearInterval(timer); timer = setInterval(schedule, 60);
    }
    function stopSynth() {
      if (!ctx) return;
      master.gain.setTargetAtTime(0, ctx.currentTime, .25);
      setTimeout(() => clearInterval(timer), 900);
    }
    // pedazo de la portada: suena desde el primer toque hasta que se abre la invitación
    function playIntro() {
      if (!CONFIG.musicaPortada) return play();
      enIntro = true; on = true;
      intro = intro || Object.assign(new Audio(CONFIG.musicaPortada), { loop: true, volume: 0 });
      intro.play().then(() => gsap.to(intro, { volume: .8, duration: 1.5 })).catch(() => {});
      if (CONFIG.musica) { audio = audio || Object.assign(new Audio(CONFIG.musica), { loop: true, volume: 0 }); audio.load(); }
      ui();
    }
    // al abrirse la invitación: el pedazo de la portada se desvanece y entra el coro
    function toMain() {
      if (!enIntro) return;
      enIntro = false;
      if (intro) { const a = intro; gsap.killTweensOf(a); gsap.to(a, { volume: 0, duration: 1.8, onComplete: () => a.pause() }); }
      if (on) play();
    }
    function play() {
      on = true;
      if (enIntro && intro) { intro.play().then(() => gsap.to(intro, { volume: .8, duration: 1 })).catch(() => {}); ui(); return; }
      if (CONFIG.musica) {
        audio = audio || Object.assign(new Audio(CONFIG.musica), { loop: true, volume: 0 });
        audio.play().then(() => gsap.to(audio, { volume: .8, duration: 2 })).catch(() => { CONFIG.musica = ""; startSynth(); });
      } else startSynth();
      ui();
    }
    function pause() {
      on = false;
      if (enIntro && intro) gsap.to(intro, { volume: 0, duration: .6, onComplete: () => intro.pause() });
      else if (audio && CONFIG.musica) gsap.to(audio, { volume: 0, duration: .6, onComplete: () => audio.pause() }); else stopSynth();
      ui();
    }
    let barsTl;
    function ui() {
      const btn = $("#musicBtn"); btn.classList.toggle("off", !on);
      if (!barsTl) barsTl = gsap.timeline({ repeat: -1 }).to("#musicBtn .bars rect", { scaleY: .35, duration: .35, stagger: { each: .12, yoyo: true, repeat: 1 }, ease: "sine.inOut" });
      on ? barsTl.play() : (barsTl.pause(), gsap.to("#musicBtn .bars rect", { scaleY: .5, duration: .3 }));
    }
    document.addEventListener("visibilitychange", () => {
      if (!ctx && !audio && !intro) return;
      if (document.hidden) { if (audio) audio.pause(); if (intro) intro.pause(); if (ctx) ctx.suspend(); }
      else if (on) { if (enIntro && intro) intro.play(); else if (audio && CONFIG.musica) audio.play(); if (ctx) ctx.resume(); }
    });
    return { play, playIntro, toMain, pause, toggle: () => (on ? pause() : play()), get on() { return on; } };
  })();

  function revealInvitacion() {
    Musica.toMain();
    const root = $("#invitacion");
    const io = new IntersectionObserver(entries => entries.forEach(e => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      gsap.to(e.target, { opacity: 1, y: 0, rotationX: 0, duration: 1.1, ease: "power3.out" });
      if (e.target.hasAttribute("data-draw")) {
        const parts = [...e.target.querySelectorAll("path,text")];
        parts.forEach(el => { const L = el.getTotalLength ? (el.getTotalLength() || 600) : 600; gsap.set(el, { strokeDasharray: L, strokeDashoffset: L }); });
        gsap.to(parts, { strokeDashoffset: 0, duration: 2.2, stagger: .25, ease: "power2.inOut" });
        gsap.to(e.target.querySelectorAll("text"), { fillOpacity: 1, duration: 1, delay: 2, stagger: .2 });
      }
      const sl = e.target.hasAttribute("data-rise") && e.target.querySelector(".slide");      // la tarjeta sale del sobre
      if (sl) gsap.fromTo(sl, { yPercent: 38 }, { yPercent: 0, duration: 1.5, delay: .35, ease: "power3.out" });
    }), { root, threshold: .15 });
    gsap.set($$(".rv", root).filter(el => !el.closest(".inv-hero") && !el.classList.contains("g3d") && !el.hasAttribute("data-rise") && !el.hasAttribute("data-draw")), { rotationX: 16, transformPerspective: 800, transformOrigin: "50% 100%" });
    $$(".rv", root).forEach((el, i) => io.observe(el));
    // la portada interna aparece en cascada
    gsap.to(".inv-hero .rv", { opacity: 1, y: 0, duration: 1.1, ease: "power2.out", stagger: .18, delay: .3 });
    // la foto sale del sobre y el ramo se mece
    gsap.fromTo("#heroEnv .sk-item", { yPercent: 38, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 1.5, stagger: .2, delay: .45, ease: "power3.out" });
    gsap.fromTo("#heroEnv .sk-seal", { scale: 0, rotation: -30 }, { scale: 1, rotation: 0, duration: .7, delay: 1.3, ease: "back.out(2.2)" });
    gsap.fromTo("#heroEnv .sk-ramo", { x: -40, opacity: 0, rotation: -6 }, { x: 0, opacity: 1, rotation: 0, duration: 1.5, delay: .6, ease: "power3.out" });
    gsap.to("#heroEnv .sk-ramo", { rotation: 2, duration: 3, yoyo: true, repeat: -1, ease: "sine.inOut", delay: 2.2 });
    // parallax: al bajar, las piezas se separan del sobre a distinta velocidad
    const parItems = $$("#heroEnv [data-par]").map(el => ({ el, k: +el.dataset.par, set: gsap.quickSetter(el, "y", "px") }));
    const ramoSet = gsap.quickSetter("#heroEnv .sk-ramo", "y", "px");
    root.addEventListener("scroll", () => { const y = root.scrollTop; if (y > 1400) return; parItems.forEach(q => q.set(-y * q.k)); ramoSet(y * .05); }, { passive: true });
    $$(".bq").forEach((q, i) => gsap.to(q, { rotation: i % 2 ? -2.5 : 2.5, transformOrigin: "50% 100%", duration: 3 + i % 3, yoyo: true, repeat: -1, ease: "sine.inOut" }));
    initGallery(); initLightbox(); initTilt();
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) initPetals();
    gsap.set("#petals", { visibility: "visible" });
    root.addEventListener("click", e => {
      if (e.target.closest("a,button,input,textarea,form,.g3d,.gdots")) return;
      const r = stage.getBoundingClientRect(); burst(e.clientX - r.left, e.clientY - r.top);
    });
    // botón de música
    gsap.set("#musicBtn", { visibility: "visible" });
    gsap.to("#musicBtn", { opacity: 1, duration: .6, delay: .6 });
    $("#musicBtn").addEventListener("click", e => { e.stopPropagation(); Musica.toggle(); gsap.to("#musicTip", { opacity: 0, duration: .3 }); });
    if (!Musica.on) gsap.timeline({ delay: 1.2 }).set("#musicTip", { visibility: "visible" }).to("#musicTip", { opacity: 1, duration: .5 }).to("#musicTip", { opacity: 0, duration: .5 }, "+=3.5");
  }
  renderInvitacion();

  /* ---------- Construcción de elementos ---------- */
  function buildStars() {

  /* ---------- Precarga (imágenes + fuentes) ---------- */
  const BLANK = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";
  function loadImg(img) {
    return new Promise(res => {
      const src = CONFIG.assetsPath + img.dataset.src, probe = new Image();
      probe.onload = () => { img.src = src; (probe.decode ? probe.decode() : Promise.resolve()).catch(() => {}).then(res); };
      probe.onerror = () => { console.warn("Falta asset:", src); img.src = BLANK; res(); };
      probe.src = src;
    });
  }
  const fontsReady = Promise.race([
    Promise.all([
      document.fonts.load('400 100px "Bodoni Moda"', CONFIG.iniciales.join("")),
      document.fonts.load('400 100px "Pinyon Script"', CONFIG.quinceanera),
      document.fonts.load('400 40px "Cormorant Garamond"', CONFIG.textoSuperior),
      document.fonts.load('italic 400 40px "Cormorant Garamond"', CONFIG.frase)
    ]).then(() => document.fonts.ready),
    new Promise(r => setTimeout(r, 4000))
  ]);
  Promise.all([...$$("img[data-src]").map(loadImg), fontsReady]).then(start);

  /* =====================================================================
     ANIMACIÓN — línea de tiempo base de 20 s
     0.0–2.4  monograma se dibuja y rellena sobre la escena 1
     2.4–3.4  respiración / estrellas
     3.4–7.4  la ventana en arco abre desde el centro y crece; el monograma sigue encima
              y se disuelve con blur; las flores de la escena 1 se abren hacia los lados
     7.4–9.4  escena 2 completa: bruma blanca que aclara + ligero zoom out
     9.4–11   marco floral entra (arriba baja, abajo sube, laterales)
     10.4–13.6 "Mis XV Años" letra a letra → nombre a mano → frase
     13.6–17.6 hold con mariposas y destellos
     17.6–20  textos se van; la escena 1 sube como cortina y reinicia el loop
     ===================================================================== */
  function start() {
    $("#loader").remove();
    const W = () => stage.clientWidth, H = () => stage.clientHeight;
    const SC = CONFIG.duracion / 20, t = s => s * SC;

    const glyphs = $$("#monogram .glyph:not(.under)");
    const tiara = $$("#monogram .tiara");
    const GLEN = 700;
    tiara.forEach(p => { p._len = p.getTotalLength ? p.getTotalLength() : 300; });

    /* ---- Ambientes (independientes del loop) ---- */
    gsap.fromTo("#s1Breath", { scale: 1 }, { scale: 1.03, duration: 4.5, ease: "sine.inOut", yoyo: true, repeat: -1 });
    gsap.fromTo("#s1FrontBreath", { scale: 1.005 }, { scale: 1.035, duration: 5.2, ease: "sine.inOut", yoyo: true, repeat: -1 });
    gsap.to("#s1 .bg", { xPercent: -1.2, yPercent: -.8, duration: 7, ease: "sine.inOut", yoyo: true, repeat: -1 });
    gsap.to(".marco1.l", { x: () => W() * .012, y: () => -H() * .006, duration: 5.5, ease: "sine.inOut", yoyo: true, repeat: -1 });
    gsap.to(".marco1.r", { x: () => -W() * .012, y: () => H() * .006, duration: 6.2, ease: "sine.inOut", yoyo: true, repeat: -1 });
    $$(".star").forEach((s, i) => {
      gsap.set(s, { scale: rand(.55, 1.05), rotation: rand(0, 45), opacity: rand(.45, .95) });
      gsap.to(s, { y: () => rand(-1, 1) * H() * .014, x: () => rand(-1, 1) * W() * .012,
        duration: rand(4, 7), ease: "sine.inOut", yoyo: true, repeat: -1, delay: -rand(0, 6) });
      gsap.to(s, { rotation: `+=${rand(25, 50) * (i % 2 ? 1 : -1)}`, duration: rand(10, 16), ease: "none", repeat: -1 });
      gsap.to(s, { opacity: rand(.25, .5), duration: rand(1.8, 3.2), ease: "sine.inOut", yoyo: true, repeat: -1, delay: -rand(0, 3) });
    });
    $$("#s2 .pl").forEach(pl => {
      const k = +pl.dataset.par;
      gsap.to(pl, { x: () => -W() * .03 * k, y: () => -H() * .008 * k, duration: 9, ease: "sine.inOut", yoyo: true, repeat: -1 });
    });
    $$(".p").forEach(p => {
      gsap.set(p, { scale: rand(.4, 1.3), opacity: 0 });
      const loop = () => gsap.fromTo(p, { y: 0, x: 0, opacity: 0 },
        { y: () => -H() * rand(.05, .14), x: () => W() * rand(-.03, .03), duration: rand(5, 9), ease: "sine.inOut",
          keyframes: { opacity: [0, rand(.45, .9), 0] }, onComplete: loop });
      gsap.delayedCall(rand(0, 6), loop);
    });
    $$(".spk").forEach(s => {
      gsap.timeline({ repeat: -1, delay: rand(0, 2.5), repeatDelay: rand(.4, 1.6) })
        .fromTo(s, { opacity: 0, scale: .2, rotation: 0 }, { opacity: 1, scale: rand(.6, 1.1), rotation: 45, duration: .7, ease: "sine.out" })
        .to(s, { opacity: 0, scale: .2, rotation: 90, duration: .8, ease: "sine.in" });
    });
    gsap.to("#texts", { y: () => -H() * .006, duration: 3.2, ease: "sine.inOut", yoyo: true, repeat: -1 });

    /* ---- Ventana: escala + contraescala (sólo transform) ---- */
    const winSet = s => {
      gsap.set("#win", { scale: s }); gsap.set("#s2", { scale: 1 / s }); gsap.set("#archRim", { scale: s });
    };
    const syncWin = () => winSet(gsap.getProperty("#win", "scale"));
    const COVER = () => {
      const w = $("#win").offsetWidth, h = $("#win").offsetHeight;
      // el rectángulo bajo los hombros empieza al 23.6% de la altura de la ventana
      return Math.max(W() / w, H() / (h * (1 - .236 * 2))) * 1.12;
    };

    function resetLoop() {
      gsap.set(["#s1", "#s1Front"], { yPercent: 0 });
      gsap.set("#s1", { zIndex: 1 }); gsap.set("#s1Front", { zIndex: 3 });
      gsap.set("#s1Zoom", { scale: 1 });
      gsap.set(".marco1.l, .cenefa.l", { xPercent: 0, opacity: 1 });
      gsap.set(".marco1.r", { xPercent: 0, opacity: 1 });
      gsap.set(".cenefa.r", { xPercent: 0, opacity: .9, scaleX: -1 });
      gsap.set("#stars", { opacity: 1 });
      gsap.set("#monogram", { opacity: 0, y: 0, scale: 1, filter: "blur(0px)" });
      glyphs.forEach(g => gsap.set(g, { strokeDasharray: GLEN, strokeDashoffset: GLEN, fillOpacity: 0 }));
      gsap.set(".glyph.under", { strokeOpacity: 0 });
      tiara.forEach(p => gsap.set(p, { strokeDasharray: p._len, strokeDashoffset: p._len }));
      $("#win").classList.remove("open");
      gsap.set("#win", { visibility: "hidden" });
      gsap.set("#archRim", { visibility: "hidden", opacity: 0 });
      winSet(.05);
      gsap.set("#s2 .pl", { scale: 1.12 });
      gsap.set("#haze", { opacity: 1 });
      gsap.set(".frame2.sup", { yPercent: -105 });
      gsap.set(".frame2.inf", { yPercent: 105 });
      gsap.set(".frame2.lat.l", { xPercent: -110 });
      gsap.set(".frame2.lat.r", { xPercent: 110 });
      gsap.set("#kicker .ch", { opacity: 0, y: 8 });
      gsap.set(".reveal", { xPercent: -100 });
      gsap.set(".reveal > span", { x: (i, el) => el.parentNode.offsetWidth });
      gsap.set([".frase", ".fecha"], { opacity: 0, y: 10 });
      gsap.set(["#texts", "#sparkles"], { opacity: 1 });
      gsap.set("#sparkles", { opacity: 0 });
      gsap.set(".bfly", { opacity: 0 });
      gsap.set("#s2", { opacity: 1 });
    }
    resetLoop();

    function butterflyTween(el, i) {
      const img = el.querySelector("img"), w = W(), h = H();
      const paths = [
        [{ x: -.12, y: .78 }, { x: .25, y: .55 }, { x: .55, y: .66 }, { x: .82, y: .40 }, { x: 1.14, y: .30 }],
        [{ x: 1.12, y: .62 }, { x: .78, y: .74 }, { x: .5, y: .6 }, { x: .2, y: .7 }, { x: -.14, y: .52 }],
        [{ x: .2, y: 1.08 }, { x: .32, y: .82 }, { x: .12, y: .64 }, { x: .4, y: .5 }, { x: .7, y: .3 }, { x: 1.15, y: .2 }]
      ];
      const path = paths[i % 3].map(p => ({ x: p.x * w, y: p.y * h }));
      const dur = [3.8, 3.4, 3.2][i % 3] * SC;
      return gsap.timeline()
        .set(el, { opacity: 1, scale: [1, .8, .65][i % 3] })
        .to(el, { duration: dur, ease: "sine.inOut", motionPath: { path, curviness: 1.4, autoRotate: 90 } }, 0)
        .fromTo(img, { scaleX: 1 }, { scaleX: .18, duration: .13, ease: "sine.inOut", yoyo: true, repeat: Math.round(dur / .13) | 1 }, 0)
        .to(el, { opacity: 0, duration: .3 }, dur - .3);
    }

    const tl = gsap.timeline({ repeat: -1, paused: true, onRepeat: resetLoop });

    // 0–2.4: monograma (tiara + letras) se traza y se rellena
    tl.set("#monogram", { opacity: 1 }, 0)
      .fromTo("#monogram", { scale: .97 }, { scale: 1, duration: t(3.4), ease: "sine.out" }, 0);
    tiara.forEach((p, i) => tl.to(p, { strokeDashoffset: 0, duration: t(1.1), ease: "power2.inOut" }, t(.15 + i * .08)));
    tl.to(glyphs[0], { strokeDashoffset: 0, duration: t(1.3), ease: "power1.inOut" }, t(.3))
      .to(".glyph.under", { strokeOpacity: 1, duration: t(.4) }, t(.9))
      .to(glyphs[1], { strokeDashoffset: 0, duration: t(1.3), ease: "power1.inOut" }, t(.75))
      .to(glyphs, { fillOpacity: 1, duration: t(.8), ease: "sine.inOut", stagger: t(.15) }, t(1.6));

    // 3.4–7.4: ventana en arco
    tl.set(["#win", "#archRim"], { visibility: "visible" }, t(3.4))
      .fromTo("#win", { scale: .05 }, { scale: 1, duration: t(1.6), ease: "power2.out", onUpdate: syncWin }, t(3.4))
      .to("#archRim", { opacity: 1, duration: t(.5) }, t(3.4))
      .to(".glyph.under", { strokeOpacity: 0, duration: t(.6) }, t(3.4))
      .to("#win", { scale: () => COVER(), duration: t(2.4), ease: "power2.inOut", onUpdate: syncWin }, t(5))
      .to("#archRim", { opacity: 0, duration: t(1), ease: "power1.in" }, t(6.2))
      .to("#s1Zoom", { scale: 1.1, duration: t(4), ease: "power1.inOut" }, t(3.4))
      // monograma encima de la ventana, luego se disuelve
      .to("#monogram", { y: () => -H() * .05, opacity: 0, filter: "blur(10px)", scale: 1.04, duration: t(1.4), ease: "power2.in" }, t(5.3))
      // flores / cenefa / estrellas de la escena 1 se abren hacia fuera (profundidad)
      .to(".marco1.l, .cenefa.l", { xPercent: -120, duration: t(2), ease: "power2.in" }, t(5.6))
      .to(".marco1.r", { xPercent: 120, duration: t(2), ease: "power2.in" }, t(5.6))
      .to(".cenefa.r", { xPercent: 120, duration: t(2), ease: "power2.in" }, t(5.6))
      .to("#stars", { opacity: 0, duration: t(1.2) }, t(5.8))
      .add(() => { if (!tl.reversed()) { $("#win").classList.add("open"); winSet(1); } }, t(7.45))
      // escena 2: ligero zoom out + la bruma aclara
      .to("#s2 .pl", { scale: 1, duration: t(5), ease: "power2.out" }, t(4.6))
      .to("#haze", { opacity: .45, duration: t(3), ease: "sine.inOut" }, t(6.6));

    // 9.4–11: marco floral
    tl.to(".frame2.sup", { yPercent: 0, duration: t(1.6), ease: "power3.out" }, t(9.4))
      .to(".frame2.inf", { yPercent: 0, duration: t(1.6), ease: "power3.out" }, t(9.5))
      .to(".frame2.lat.l", { xPercent: 0, duration: t(1.5), ease: "power3.out" }, t(9.6))
      .to(".frame2.lat.r", { xPercent: 0, duration: t(1.5), ease: "power3.out" }, t(9.6))
      .to("#haze", { opacity: .7, duration: t(1.4), ease: "sine.inOut" }, t(9.8));

    // 10.4–13.6: textos
    tl.to("#kicker .ch", { opacity: 1, y: 0, duration: t(.5), ease: "power2.out", stagger: t(.06) }, t(10.4))
      .to(".r1", { xPercent: 0, duration: t(1.8), ease: "power1.inOut" }, t(11.1))
      .to(".r1 > span", { x: 0, duration: t(1.8), ease: "power1.inOut" }, t(11.1))
      .to("#sparkles", { opacity: 1, duration: t(.8) }, t(12.2))
      .to(".frase", { opacity: 1, y: 0, duration: t(.8), ease: "power2.out" }, t(12.7))
      .to(".fecha", { opacity: 1, y: 0, duration: t(.8), ease: "power2.out" }, t(13.0));

    // 13.6–17.6: hold con mariposas
    $$(".bfly").forEach((b, i) => tl.add(() => butterflyTween(b, i), t([13.7, 14.3, 14.6][i % 3])));

    // 17.6–20: salida y cortina de la escena 1
    tl.to(["#texts", "#sparkles"], { opacity: 0, duration: t(1), ease: "power1.in" }, t(17.6))
      .to("#s2", { opacity: .6, duration: t(2.2), ease: "power1.in" }, t(17.7))
      .add(() => { // prepara la escena 1 en su estado inicial, fuera de cuadro abajo
        gsap.set("#s1Zoom", { scale: 1 });
        gsap.set(".marco1.l, .cenefa.l, .marco1.r, .cenefa.r", { xPercent: 0 });
        gsap.set("#stars", { opacity: 1 });
      }, t(17.6))
      .set(["#s1", "#s1Front"], { yPercent: 100 }, t(17.6))
      .set("#s1", { zIndex: 4 }, t(17.6)).set("#s1Front", { zIndex: 5 }, t(17.6))
      .to(["#s1", "#s1Front"], { yPercent: 0, duration: t(2.2), ease: "power3.inOut" }, t(17.8))
      .set({}, {}, t(20));

    /* ---- Intro desde negro (sólo la primera vez) ---- */
    gsap.timeline()
      .to("#black", { opacity: 0, duration: 1.6, ease: "power1.inOut" }, 0)
      .to("#watermark", { opacity: 1, duration: 1.5 }, .8)
      .add(() => tl.play(0), 0)
      .set("#black", { display: "none" });
    if (!REEL) {
      gsap.to("#hint", { opacity: .9, duration: 1, delay: 3 });
      gsap.to("#hint", { opacity: .45, duration: 1.6, delay: 4, yoyo: true, repeat: -1, ease: "sine.inOut" });
    }

    /* ---- Tocar = siguiente sección ---- */
    let opened = false;
    const openInv = () => {
      if (opened) return;
      opened = true;
      const inv = $("#invitacion");
      inv.setAttribute("aria-hidden", "false");
      // gesto del usuario: arranca la música y pide permiso de giroscopio (iOS)
      if (!REEL) Musica.playIntro();
      try { if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {}); } catch (e) {}
      showEnvelope();
      document.dispatchEvent(new CustomEvent("invitacion:abrir"));
    };
    // El sobre: se abre tocando el sello o deslizando hacia arriba; la "cámara" entra al sello y aparece la invitación
    const showEnvelope = () => {
      const env = $("#envelope");
      gsap.set(env, { visibility: "visible" });
      gsap.timeline()
        .to("#hint", { opacity: 0, duration: .3 }, 0)
        .fromTo(env, { opacity: 0 }, { opacity: 1, duration: .6 }, 0)
        .fromTo("#env", { y: 60, scale: 1.12, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 1.3, ease: "power3.out" }, .15)
        .fromTo(".env2-ramo", { x: -50, rotation: -8, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 1.3, ease: "power3.out" }, .45)
        .fromTo("#opKick", { y: -14, opacity: 0 }, { y: 0, opacity: 1, duration: .9 }, .5)
        .fromTo("#envHint", { opacity: 0 }, { opacity: 1, duration: .8 }, 1);
      gsap.to(".env2-ramo", { rotation: 2.5, duration: 2.6, yoyo: true, repeat: -1, ease: "sine.inOut", delay: 1.6 });
      gsap.fromTo("#wax .pulse", { scale: .8, opacity: .9 }, { scale: 1.35, opacity: 0, duration: 1.6, repeat: -1, ease: "power1.out", delay: 1.2 });
      gsap.to("#wax .shine", { backgroundPosition: "150% 0", duration: 1.6, repeat: -1, repeatDelay: 1.4, ease: "power1.inOut", delay: 1.5 });
      let y0 = null, done = false;
      const finish = () => {
        if (done) return; done = true;
        const inv = $("#invitacion");
        gsap.timeline()
          .to(["#envHint", "#opKick"], { opacity: 0, duration: .3 }, 0)
          .to("#wax", { scale: 1.2, duration: .22, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0)
          .to(".env2-ramo", { x: -160, rotation: -14, opacity: 0, duration: .9, ease: "power2.in" }, .35)
          .to("#env", { scale: 7, duration: 1.25, ease: "power2.in" }, .4)
          .add(() => {
            if (CONFIG.puertas) return doorsSequence();
            gsap.set(inv, { visibility: "visible", opacity: 1 }); tl.pause();
            gsap.fromTo(inv, { scale: 1.18 }, { scale: 1, duration: 1.8, ease: "power3.out" });
            revealInvitacion();
          }, 1.25)
          .to(env, { opacity: 0, duration: .7, onComplete: () => gsap.set(env, { visibility: "hidden" }) }, 1.3);
      };
      env.addEventListener("pointerdown", e => { if (done) return; y0 = e.clientY; });
      env.addEventListener("pointermove", e => { if (y0 !== null && !done && y0 - e.clientY > 50) { y0 = null; finish(); } });
      env.addEventListener("pointerup", () => { if (y0 === null || done) return; y0 = null; finish(); });
      window.abrirSobre = finish;
    };
    // Las puertas de palacio
    const doorsSequence = () => {
      const inv = $("#invitacion");
      gsap.timeline()
        .set("#doors", { visibility: "visible" }, 0)
        .fromTo(".door", { opacity: 0 }, { opacity: 1, duration: .5, ease: "power1.out" }, 0)
        .fromTo(".seal", { scale: .4, opacity: 0, rotationY: -90, transformPerspective: 600 }, { scale: 1, opacity: 1, rotationY: 0, duration: .9, ease: "back.out(1.5)" }, .25)
        .set(inv, { visibility: "visible", opacity: 1 }, .8)
        .add(() => tl.pause(), .8)
        .to(".seal", { scale: 1.25, opacity: 0, duration: .5, ease: "power2.in" }, 1.5)
        .to(".door.l", { rotationY: -108, duration: 1.9, ease: "power3.inOut" }, 1.7)
        .to(".door.r", { rotationY: 108, duration: 1.9, ease: "power3.inOut" }, 1.7)
        .to(".door .shade", { opacity: .55, duration: 1.9, ease: "power2.in" }, 1.7)
        .fromTo(inv, { scale: .92 }, { scale: 1, duration: 2.2, ease: "power2.out" }, 1.6)
        .add(revealInvitacion, 2)
        .set("#doors", { visibility: "hidden" }, 3.7);
    };
    if (!REEL) stage.addEventListener("click", e => { if (!e.target.closest("#invitacion, #envelope")) openInv(); });

    let rz;
    addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => {
      if (!$("#win").classList.contains("open")) tl.invalidate();
    }, 150); });

    window.abrirInvitacion = openInv;
    window.portada = { tl, seek: s => tl.seek(t(s), false), play: () => tl.play(), pause: () => tl.pause() };
  }
})();
</script>
</body>
</html>
